<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #04060c; color: #dfe8ff;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 620px); gap: 14px; padding: 14px; }
  .cell { position: relative; width: 620px; height: 620px; background: #04060c;
    border: 1px solid #16213c; border-radius: 16px; overflow: hidden; }
  .cell canvas { display: block; }
  .num { position: absolute; top: 14px; left: 18px; font-size: 15px; color: #6d80a8;
    letter-spacing: .14em; font-weight: 600; }
  .tag { position: absolute; left: 18px; bottom: 16px; right: 18px; font-size: 21px;
    font-weight: 600; text-shadow: 0 2px 16px rgba(0,0,0,.95); }
  .tag small { display: block; font-size: 13px; font-weight: 400; color: #93a7cc;
    margin-top: 5px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const SIZE = 620;
const TEX_DAY = 'https://unpkg.com/three-globe@2.44.0/example/img/earth-day.jpg';

const CITIES = [
  [39.90,116.41],[31.23,121.47],[22.32,114.17],[35.68,139.65],[37.57,126.98],
  [1.35,103.82],[13.76,100.50],[19.08,72.88],[25.20,55.27],[41.01,28.98],
  [55.76,37.62],[30.04,31.24],[-1.29,36.82],[-33.92,18.42],[51.51,-0.13],
  [48.86,2.35],[52.52,13.41],[40.42,-3.70],[41.90,12.50],[52.37,4.90],
  [40.71,-74.01],[34.05,-118.24],[41.88,-87.63],[43.65,-79.38],[19.43,-99.13],
  [-23.55,-46.63],[-34.60,-58.38],[-12.05,-77.04],[-33.87,151.21],[-36.85,174.76]
];

const sph = (lat, lon, r = 1) => {
  const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  return new THREE.Vector3(r * Math.cos(la) * Math.sin(lo), r * Math.sin(la), r * Math.cos(la) * Math.cos(lo));
};

function glowSprite() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.12, 'rgba(255,246,225,1)');
  grd.addColorStop(0.30, 'rgba(255,214,120,.55)');
  grd.addColorStop(0.55, 'rgba(255,190,90,.12)');
  grd.addColorStop(1, 'rgba(255,180,60,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

function addStars(scene, count = 1800, radius = 70) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.max(0, 1 - u * u));
    pos[i * 3] = r * Math.cos(th) * radius;
    pos[i * 3 + 1] = u * radius;
    pos[i * 3 + 2] = r * Math.sin(th) * radius;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xbdd2ff, size: 0.34, sizeAttenuation: true, transparent: true,
    opacity: 0.85, depthWrite: false
  })));
}

function fresnelShell(color, power = 2.6, strength = 1.0, scale = 1.045) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uPower: { value: power },
      uStrength: { value: strength }
    },
    vertexShader: `
      varying vec3 vN; varying vec3 vP;
      void main() {
        vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vP = mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uPower; uniform float uStrength;
      varying vec3 vN; varying vec3 vP;
      void main() {
        float f = pow(1.0 - abs(dot(normalize(vN), normalize(-vP))), uPower);
        gl_FragColor = vec4(uColor, 1.0) * f * uStrength;
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  return new THREE.Mesh(new THREE.SphereGeometry(scale, 96, 64), mat);
}

function graticules(color = 0x6fe8ff, step = 30, opacity = 0.42, r = 1.002) {
  const verts = [];
  const push = (a, b) => { verts.push(a.x, a.y, a.z, b.x, b.y, b.z); };
  for (let lon = -180; lon < 180; lon += step) {
    for (let lat = -90; lat < 90; lat += 4) push(sph(lat, lon, r), sph(lat + 4, lon, r));
  }
  for (let lat = -75; lat <= 75; lat += step) {
    for (let lon = -180; lon < 180; lon += 4) push(sph(lat, lon, r), sph(lat, lon + 4, r));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false
  }));
}

function cityPoints(radius, size = 0.185) {
  const pos = [];
  for (const [lat, lon] of CITIES) {
    const v = sph(lat, lon, radius);
    pos.push(v.x, v.y, v.z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({
    size, map: glowSprite(), transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, color: 0xffffff, alphaTest: 0.01
  }));
}

function arcs(color = 0x4affd0, opacity = 0.5, lift = 0.20) {
  const verts = [];
  const pairs = [
    [0, 14], [20, 14], [3, 21], [28, 5], [25, 13], [7, 8],
    [2, 29], [10, 16], [9, 0], [24, 17], [12, 7], [22, 15]
  ];
  for (const [a, b] of pairs) {
    const p1 = sph(CITIES[a][0], CITIES[a][1]);
    const p2 = sph(CITIES[b][0], CITIES[b][1]);
    const mid = p1.clone().add(p2).multiplyScalar(0.5);
    const l = 1 + lift * p1.distanceTo(p2);
    mid.normalize().multiplyScalar(l);
    const pts = new THREE.QuadraticBezierCurve3(p1, mid, p2).getPoints(50);
    for (let i = 0; i < pts.length - 1; i++) {
      verts.push(pts[i].x, pts[i].y, pts[i].z, pts[i + 1].x, pts[i + 1].y, pts[i + 1].z);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false
  }));
}

const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');

/**
 * 陆地点云。用斐波那契球面采样而不是按经纬度铺格子——
 * 经纬格子在两极会挤成同心波纹，看着像渲染出了 bug。
 */
async function landGeometry(count = 46000, r = 0.985) {
  const tex = await loader.loadAsync(TEX_DAY);
  const src = tex.image;
  const W = 1440, H = 720;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  const pos = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < count; i++) {
    const yy = 1 - (i / (count - 1)) * 2;
    const rad = Math.sqrt(Math.max(0, 1 - yy * yy));
    const th = golden * i;
    const xx = rad * Math.cos(th);
    const zz = rad * Math.sin(th);
    const lat = Math.asin(yy) * 180 / Math.PI;
    const lon = Math.atan2(xx, zz) * 180 / Math.PI;
    const px = Math.min(W - 1, Math.max(0, Math.floor((lon + 180) / 360 * W)));
    const py = Math.min(H - 1, Math.max(0, Math.floor((90 - lat) / 180 * H)));
    const k = (py * W + px) * 4;
    if (d[k + 2] - d[k] > 20 && d[k + 2] - d[k + 1] > 12) continue;   // 海洋
    pos.push(xx * r, yy * r, zz * r);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return g;
}

function shell(radius, opacity, color = 0x2ad4ff) {
  return new THREE.Mesh(
    new THREE.SphereGeometry(radius, 72, 54),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false })
  );
}

function rings(spec) {
  const group = new THREE.Group();
  for (const [tilt, radius, opacity] of spec) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(radius, 0.0035, 8, 240),
      new THREE.MeshBasicMaterial({
        color: 0x7feaff, transparent: true, opacity,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    ring.rotation.set(Math.PI / 2 + tilt, 0, tilt * 1.4);
    group.add(ring);
  }
  return group;
}

function base(container) {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
  camera.position.set(0, 0.8, 3.0);
  camera.lookAt(0, 0, 0);
  const renderer = new THREE.WebGLRenderer({
    antialias: true, alpha: false, preserveDrawingBuffer: true,
    failIfMajorPerformanceCaveat: false
  });
  renderer.setPixelRatio(1);
  renderer.setSize(SIZE, SIZE);
  renderer.setClearColor(0x04060c, 1);
  container.appendChild(renderer.domElement);
  addStars(scene);
  return { scene, camera, renderer };
}

const BUILDERS = [
  /* A：点阵在内核，玻璃壳在外面 —— 有纵深 */
  async (el) => {
    const { scene, camera, renderer } = base(el);
    scene.add(new THREE.Points(await landGeometry(46000, 0.978), new THREE.PointsMaterial({
      color: 0xbdefff, size: 0.0145, sizeAttenuation: true,
      transparent: true, opacity: 1, depthWrite: false
    })));
    scene.add(shell(1.0, 0.014));
    scene.add(graticules(0x6fe8ff, 30, 0.26, 1.003));
    scene.add(rings([[0.85, 1.22, 0.5], [-0.5, 1.34, 0.28], [0.15, 1.46, 0.18]]));
    scene.add(cityPoints(1.008));
    scene.add(fresnelShell(0x2ad4ff, 3.6, 0.7, 1.05));
    return { scene, camera, renderer };
  },

  /* B：点阵直接铺在玻璃壳表面 —— 更"全息投影" */
  async (el) => {
    const { scene, camera, renderer } = base(el);
    scene.add(new THREE.Points(await landGeometry(52000, 1.002), new THREE.PointsMaterial({
      color: 0xcaf2ff, size: 0.0155, sizeAttenuation: true,
      transparent: true, opacity: 1, depthWrite: false
    })));
    scene.add(shell(1.0, 0.01));
    scene.add(graticules(0x6fe8ff, 45, 0.16, 1.006));
    scene.add(rings([[0.85, 1.2, 0.45], [-0.62, 1.32, 0.25]]));
    scene.add(cityPoints(1.02, 0.2));
    scene.add(fresnelShell(0x2ad4ff, 3.8, 0.8, 1.05));
    scene.add(fresnelShell(0xcdefff, 7.0, 0.3, 1.012));
    return { scene, camera, renderer };
  },

  /* C：A + 城市弧线 —— 信息量最大 */
  async (el) => {
    const { scene, camera, renderer } = base(el);
    scene.add(new THREE.Points(await landGeometry(46000, 0.978), new THREE.PointsMaterial({
      color: 0xbdefff, size: 0.0145, sizeAttenuation: true,
      transparent: true, opacity: 0.95, depthWrite: false
    })));
    scene.add(shell(1.0, 0.012));
    scene.add(graticules(0x6fe8ff, 30, 0.22, 1.003));
    scene.add(rings([[0.85, 1.22, 0.45], [-0.5, 1.34, 0.25]]));
    scene.add(arcs(0x5affd8, 0.8, 0.22));
    scene.add(cityPoints(1.008));
    scene.add(fresnelShell(0x2ad4ff, 3.6, 0.7, 1.05));
    return { scene, camera, renderer };
  }
];

const META = [
  ['A · 点阵内芯', '陆地粒子藏在玻璃球内部，有纵深感。玻璃壳线条最完整，整体最"完整一件"。'],
  ['B · 点阵贴壳', '粒子直接铺在玻璃表面，壳体几乎消失。更像一副悬浮的全息投影，最轻最干净。'],
  ['C · 内芯 + 弧线', '在 A 的基础上加了城市之间的连线。信息量最大，最有"数据在流动"的感觉。']
];

const grid = document.getElementById('grid');
await Promise.all(BUILDERS.map(async (build, i) => {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const num = document.createElement('div');
  num.className = 'num';
  num.textContent = String.fromCharCode(65 + i);
  cell.appendChild(num);
  grid.appendChild(cell);
  try {
    const { scene, camera, renderer } = await build(cell);
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.innerHTML = META[i][0] + '<small>' + META[i][1] + '</small>';
    cell.appendChild(tag);
    const tick = () => { renderer.render(scene, camera); requestAnimationFrame(tick); };
    tick();
  } catch (err) {
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = '渲染失败: ' + err.message;
    cell.appendChild(tag);
  }
}));
document.title = 'ready';
</script>
</body>
</html>
