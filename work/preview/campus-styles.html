<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #06080d; color: #dfe8ff; overflow: hidden;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 620px); gap: 14px; padding: 14px; }
  .cell { position: relative; width: 620px; height: 620px; border: 1px solid #16213c;
    border-radius: 16px; overflow: hidden; background: #06080d; }
  .cell canvas { display: block; }
  .num { position: absolute; top: 14px; left: 18px; font-size: 15px; color: #7f93b8;
    letter-spacing: .14em; font-weight: 600; text-shadow: 0 2px 10px #000; }
  .tag { position: absolute; left: 18px; bottom: 16px; right: 18px; font-size: 20px;
    font-weight: 600; text-shadow: 0 2px 16px rgba(0,0,0,.95); }
  .tag small { display: block; font-size: 13px; font-weight: 400; color: #a8bcdd;
    margin-top: 5px; line-height: 1.5; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const SIZE = 620;
const DATA_URL = '/campus/campus.json';
const data = await (await fetch(DATA_URL + '?t=' + Date.now())).json();

// 量范围，三种风格共用
let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
for (const b of data.buildings) for (const p of b.o) {
  if (p[0] < minX) minX = p[0];
  if (p[0] > maxX) maxX = p[0];
  if (p[1] < minZ) minZ = p[1];
  if (p[1] > maxZ) maxZ = p[1];
}
const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
const spanX = maxX - minX, spanZ = maxZ - minZ;
const radius = Math.hypot(spanX, spanZ) / 2;

function shapeOf(ring) {
  const s = new THREE.Shape();
  ring.forEach(([x, z], i) => (i ? s.lineTo(x, z) : s.moveTo(x, z)));
  return s;
}

/** 建筑体块。挤出 + 绕 X 轴立起来（形状的 y 变成 -z，挤出方向变成 +y）。 */
function block(ring, h, material) {
  const geo = new THREE.ExtrudeGeometry(shapeOf(ring), { depth: h, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function flatPoly(ring, y, material) {
  const geo = new THREE.ShapeGeometry(shapeOf(ring));
  geo.rotateX(Math.PI / 2);
  geo.translate(0, y, 0);
  const m = new THREE.Mesh(geo, material);
  m.receiveShadow = true;
  return m;
}

function makeBase(container, opts) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(SIZE, SIZE);
  renderer.setClearColor(opts.clear, 1);
  renderer.shadowMap.enabled = !!opts.shadows;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if (opts.toneMapping) {
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = opts.exposure || 1;
  }
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 1, 40000);
  const vHalf = camera.fov * Math.PI / 360;
  // 0.72 是试出来的：按半径算的距离太保守，校区在画面里只占一半，四周全是空
  const dist = radius / Math.sin(vHalf) * 0.72;
  const pitch = 34 * Math.PI / 180;
  camera.position.set(cx, dist * Math.sin(pitch), cz + dist * Math.cos(pitch) * 0.94);
  camera.lookAt(cx, 0, cz);
  return { renderer, scene, camera };
}

/** 场地底板：比校园稍大一圈，像摆在桌上的模型底座 */
function plinth(group, material, lift) {
  const pad = 60;
  const g = new THREE.Mesh(new THREE.BoxGeometry(spanX + pad * 2, 8, spanZ + pad * 2), material);
  g.position.set(cx, lift, cz);
  g.receiveShadow = true;
  group.add(g);
}

/* ---------------- A 暖光沙盘：阳光 + 投影 + 米白建筑 ---------------- */
function buildA(container) {
  const { renderer, scene, camera } = makeBase(container, {
    clear: 0x1b2230, shadows: true, toneMapping: true, exposure: 1.05
  });
  scene.add(new THREE.HemisphereLight(0xcfe2ff, 0x2a2118, 0.55));
  const sun = new THREE.DirectionalLight(0xffd2a0, 3.2);
  sun.position.set(cx - 700, 900, cz + 500);
  sun.target.position.set(cx, 0, cz);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const s = radius * 1.3;
  Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 100, far: 4000 });
  sun.shadow.bias = -0.0008;
  scene.add(sun, sun.target);

  const group = new THREE.Group();
  scene.add(group);
  plinth(group, new THREE.MeshLambertMaterial({ color: 0x3a3a3c }), -5);

  const ground = flatPoly(data.campus, 0, new THREE.MeshLambertMaterial({ color: 0xb9b3a6 }));
  group.add(ground);

  return finish(renderer, scene, camera, group, data, {
    buildingColor: 0xe8e2d6, tallColor: 0xdcd4c4, roadColor: 0x8b8478,
    greenColor: 0x6f8a5a, pitchColor: 0x5f7f4c, edge: 0x6b6355
  });
}

/* ---------------- B 夜幕校园：深色体块 + 自发光道路 ---------------- */
function buildB(container) {
  const { renderer, scene, camera } = makeBase(container, { clear: 0x05070f, shadows: false });
  scene.add(new THREE.AmbientLight(0x2a3a5e, 1.4));
  const key = new THREE.DirectionalLight(0x6fa8ff, 1.1);
  key.position.set(cx + 600, 700, cz - 500);
  scene.add(key);

  const group = new THREE.Group();
  scene.add(group);
  plinth(group, new THREE.MeshBasicMaterial({ color: 0x0a1020 }), -5);
  group.add(flatPoly(data.campus, 0, new THREE.MeshBasicMaterial({ color: 0x0b1424 })));

  return finish(renderer, scene, camera, group, data, {
    buildingColor: 0x2f4a7a, tallColor: 0x3d5f96, roadColor: 0x39c4ff,
    greenColor: 0x12352a, pitchColor: 0x1a5c3f, edge: 0x2f6fae,
    glowRoads: true, emissive: 0x0e1f3d, emissiveIntensity: 1
  });
}

/* ---------------- C 白模轴测：纯白 + 灰阶阴影 + 细描边 ---------------- */
function buildC(container) {
  const { renderer, scene, camera } = makeBase(container, {
    clear: 0x2a2f38, shadows: true, toneMapping: true, exposure: 1.0
  });
  scene.add(new THREE.HemisphereLight(0xffffff, 0x555a66, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 2.6);
  sun.position.set(cx - 600, 1000, cz + 400);
  sun.target.position.set(cx, 0, cz);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const s = radius * 1.3;
  Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 100, far: 4000 });
  sun.shadow.bias = -0.0008;
  scene.add(sun, sun.target);

  const group = new THREE.Group();
  scene.add(group);
  plinth(group, new THREE.MeshLambertMaterial({ color: 0x3c424d }), -5);
  group.add(flatPoly(data.campus, 0, new THREE.MeshLambertMaterial({ color: 0xd8dce4 })));

  return finish(renderer, scene, camera, group, data, {
    buildingColor: 0xf5f6f8, tallColor: 0xffffff, roadColor: 0x9aa3b2,
    greenColor: 0xc2cbd8, pitchColor: 0xb6c0cf, edge: 0x5a6270
  });
}

/** 三种风格共用：建筑、道路、绿地、描边 */
function finish(renderer, scene, camera, group, data, o) {
  const matNormal = new THREE.MeshLambertMaterial({
    color: o.buildingColor, emissive: o.emissive || 0x000000, emissiveIntensity: o.emissiveIntensity || 1
  });
  const matTall = new THREE.MeshLambertMaterial({
    color: o.tallColor, emissive: o.emissive || 0x000000, emissiveIntensity: o.emissiveIntensity || 1
  });
  for (const b of data.buildings) {
    group.add(block(b.o, b.h, b.h >= 20 ? matTall : matNormal));
  }

  const v = [];
  for (const r of data.roads) {
    for (let i = 0; i < r.o.length - 1; i++) {
      v.push(r.o[i][0], 1.2, r.o[i][1], r.o[i + 1][0], 1.2, r.o[i + 1][1]);
    }
  }
  if (v.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
    group.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({
      color: o.roadColor, transparent: true, opacity: o.glowRoads ? 0.55 : 0.35
    })));
  }

  for (const gr of data.greens) {
    group.add(flatPoly(gr.o, 0.8, new THREE.MeshLambertMaterial({
      color: gr.k === 'pitch' ? o.pitchColor : o.greenColor
    })));
  }

  renderer.render(scene, camera);
  return { renderer, scene, camera };
}

const BUILDERS = [buildA, buildB, buildC];
const META = [
  ['暖光沙盘', '真实阳光投影、米白建筑、深色底座。像摆在桌上的实体模型，最像"一个地方"'],
  ['夜幕校园', '深色体块配自发光道路和冷蓝边光。信息感和科技感强，适合当展示背景'],
  ['白模轴测', '纯白建筑加灰阶阴影、细描边。建筑事务所出图那种克制感，最干净']
];

const grid = document.getElementById('grid');
await Promise.all(BUILDERS.map(async (build, i) => {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const num = document.createElement('div');
  num.className = 'num';
  num.textContent = String.fromCharCode(65 + i);
  cell.appendChild(num);
  grid.appendChild(cell);
  try {
    build(cell);
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.innerHTML = META[i][0] + '<small>' + META[i][1] + '</small>';
    cell.appendChild(tag);
  } catch (err) {
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = '失败: ' + err.message;
    cell.appendChild(tag);
  }
}));
document.title = 'ready';
</script>
</body>
</html>
