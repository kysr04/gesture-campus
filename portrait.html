<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>粒子自我 · Particle Self</title>
<meta name="description" content="用手势把照片变成会呼吸的 3D 粒子。摄像头画面只在本机处理。">
<meta name="theme-color" content="#04060e">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#04060e;color:#e6eeff;overflow:hidden;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  #app{position:relative;height:100%;width:100%;overflow:hidden}
  #stage{position:absolute;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  #side{position:absolute;z-index:6;left:20px;top:20px;bottom:20px;width:280px;
    display:flex;flex-direction:column;gap:12px;padding:16px;
    background:rgba(7,10,19,.72);border:1px solid rgba(120,160,255,.18);border-radius:20px;
    box-shadow:0 24px 70px rgba(0,0,0,.48);backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);overflow:auto}
  #brand{display:flex;align-items:center;gap:10px}
  #brand .mark{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,rgba(127,224,255,.2),rgba(55,224,138,.14));
    border:1px solid rgba(127,224,255,.25);color:#9fe8ff;font-size:14px}
  #brand h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.10em;color:#e6eeff}
  #brand span{display:block;margin-top:2px;font-size:8.5px;letter-spacing:.18em;color:#5f7093}
  #cam{display:block;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;
    border:1px solid rgba(120,160,255,.14);opacity:.92}
  #state{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;
    background:rgba(11,17,32,.75);border:1px solid rgba(120,160,255,.14);font-size:13px;font-weight:600}
  #dot{width:8px;height:8px;border-radius:50%;background:#4a9dff;animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.25}}
  #demo-now{width:100%;padding:9px 12px;border:1px solid rgba(127,224,255,.24);border-radius:11px;
    background:linear-gradient(135deg,rgba(127,224,255,.12),rgba(55,224,138,.08));
    color:#bfe9ff;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  #demo-now:hover{background:linear-gradient(135deg,rgba(127,224,255,.2),rgba(55,224,138,.14))}
  #settings{font-size:11px;color:#7d90b5}
  #settings summary{cursor:pointer;list-style:none;padding:2px 0;color:#7d90b5}
  #settings summary::-webkit-details-marker{display:none}
  #settings summary::before{content:"⚙ ";}
  #cal-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  #cal-row button{flex:1 1 auto;padding:7px 8px;border:1px solid rgba(120,160,255,.16);border-radius:8px;
    background:rgba(11,17,32,.8);color:#8ea3c8;font:inherit;font-size:10.5px;cursor:pointer}
  #cal-row button:hover{background:#111a2c;color:#cfe0ff}
  #cal-info{margin-top:6px;font-size:10px;color:#5f7093;line-height:1.4}
  #hint{font-size:11px;color:#6f7f9f;line-height:1.8;margin-top:auto}
  #hint b{color:#9fb2d8;font-weight:600}
  #footnote{font-size:9.5px;color:#4f5d7a;letter-spacing:.04em}
  #hud{position:absolute;z-index:4;right:22px;top:22px;padding:8px 13px;border-radius:999px;
    background:rgba(7,10,19,.58);border:1px solid rgba(120,160,255,.14);
    color:#8ea3c8;font-size:11px;letter-spacing:.04em;pointer-events:none;backdrop-filter:blur(10px)}
  #boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:28px;text-align:center;overflow:auto;
    background:
      radial-gradient(circle at 50% 45%,rgba(20,44,92,.38),rgba(4,6,14,.86) 58%,rgba(4,6,14,.96)),
      linear-gradient(180deg,rgba(4,6,14,.35),rgba(4,6,14,.9));
    backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px)}
  #boot.off{display:none}
  .boot-inner{width:min(720px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;
    animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .brand{font-size:10px;letter-spacing:.28em;color:#6f9dff;text-transform:uppercase}
  #boot h1{margin:0;font-size:clamp(34px,6vw,58px);line-height:1.08;font-weight:650;letter-spacing:-.02em}
  #boot h1 em{font-style:normal;background:linear-gradient(110deg,#9fe8ff,#6f9dff 45%,#d6c4ff);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  #boot .sub{margin:0;max-width:560px;font-size:14px;line-height:1.8;color:#8ea3c8}
  .cta{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:4px}
  #go,#demo-btn{padding:13px 26px;border-radius:999px;font:inherit;font-size:14px;font-weight:650;cursor:pointer}
  #go{border:0;color:#04121f;background:linear-gradient(135deg,#7fe0ff,#37e08a);box-shadow:0 10px 34px rgba(55,224,138,.24)}
  #go[disabled]{opacity:.35;cursor:default}
  #demo-btn{border:1px solid rgba(127,224,255,.26);color:#bfe9ff;background:rgba(7,10,19,.52)}
  #demo-btn:hover{background:rgba(127,224,255,.1)}
  .steps{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:4px}
  .steps span{padding:6px 11px;border-radius:999px;background:rgba(7,10,19,.52);
    border:1px solid rgba(120,160,255,.13);font-size:10.5px;color:#7d90b5}
  #msg{font-size:12px;color:#7d90b5;max-width:460px;line-height:1.7}
  #bar{width:min(320px,70vw);height:4px;border-radius:3px;background:rgba(20,29,49,.9);overflow:hidden}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#4a9dff,#37e08a);transition:width .2s}
  #err{font-size:12px;color:#ff8b8b;max-width:460px;white-space:pre-wrap;line-height:1.6}
  .privacy{font-size:10px;color:#4f5d7a;letter-spacing:.04em}
  #demo-exit{display:none;position:fixed;z-index:30;right:20px;bottom:20px;padding:10px 16px;border-radius:999px;
    background:rgba(7,10,19,.72);border:1px solid rgba(127,224,255,.24);color:#bfe9ff;
    font-size:12px;text-decoration:none;backdrop-filter:blur(12px)}
  #burst-flash{position:fixed;inset:0;z-index:24;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%,rgba(255,184,224,.85),rgba(255,110,190,.28) 32%,transparent 66%);
    mix-blend-mode:screen}
  body.demo #demo-exit{display:block}
  body.demo #side{display:none}
  @media (max-width:760px){
    #side{left:12px;top:12px;bottom:auto;width:160px;padding:10px;gap:7px;border-radius:14px}
    #brand h1{font-size:13px}
    #brand span{font-size:7px}
    #state{font-size:10.5px;padding:6px 8px}
    #demo-now{padding:7px 8px;font-size:10.5px}
    #hint,#footnote{display:none}
    #hud{right:12px;top:12px;font-size:9.5px;padding:6px 9px}
    #boot h1{font-size:32px}
    #boot .sub{font-size:12.5px}
    #go,#demo-btn{width:100%;max-width:280px}
    .steps{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="brand">
      <div class="mark">✦</div>
      <div><h1>粒子自我</h1><span>PARTICLE SELF</span></div>
    </div>
    <canvas id="cam" width="320" height="240"></canvas>
    <div id="state"><span id="dot"></span><span id="label">初始化</span></div>
    <button id="demo-now" type="button">▶ 观看演示</button>
    <details id="settings">
      <summary>设置与标定</summary>
      <div id="cal-row">
        <button id="calibrate" type="button">标定捏合</button>
        <button id="cal-reset" type="button">重置</button>
      </div>
      <div id="cal-info">默认捏合范围</div>
    </details>
    <div id="hint">
      <b>手掌平移</b> 穿行<br>
      <b>捏住</b> 蓄力成心<br>
      <b>松手</b> 爆炸<br>
      <b>快速双捏</b> 锁定 / 解锁<br>
      <b>比 1–3 / 小指</b> 切换形态<br>
      <b>双手</b> 推进 / 后退
    </div>
    <div id="footnote">本地运行 · 摄像头不出设备</div>
  </aside>
  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="hud">粒子自我 · 手掌即方向</div>
  </main>
</div>
<a id="demo-exit" href="./portrait.html">用手体验 →</a>
<div id="burst-flash"></div>

<div id="boot">
  <div class="boot-inner">
    <div class="brand">Particle Self · 手势粒子人像</div>
    <h1>让你的照片<br><em>变成会呼吸的粒子</em></h1>
    <p class="sub">抬手穿过星云，捏住蓄力成心，松手爆炸。所有画面只在本机运行，摄像头画面不会离开设备。</p>
    <div class="cta">
      <button id="go" disabled>加载摄像头…</button>
      <button id="demo-btn" type="button">观看演示</button>
    </div>
    <div class="steps">
      <span>手掌平移 · 穿行</span>
      <span>捏住蓄力 · 松手爆炸</span>
      <span>比 1–3 / 小指 · 切换形态</span>
    </div>
    <div id="msg">正在准备粒子场…</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="err"></div>
    <div class="privacy">本地运行 · 无需上传 · 摄像头画面不出设备</div>
  </div>
</div>

<script type="module">
/* ═══════════════════════════════════════════════════════════════════════
   粒子手势交互 —— 从零实现

   设计要点：相机永远在粒子云内部绕行，所以手掌平移读起来是"穿行"而不是
   "看着一团东西转"。捏合时在相机前方聚起一团粒子，张开则散去。
   ═══════════════════════════════════════════════════════════════════════ */

/* ------------------------------ 参数 ---------------------------------- */

const CFG = {
  particles: 15000,        // 直接使用外部粒子坐标 JSON 的点数
  shellInner: 12,          // 云内半径要小于相机轨道半径，粒子才会从身边掠过
  shellOuter: 95,
  orbitBase: 9,            // 相机轨道半径 = orbitBase + dist * orbitGain
  orbitGain: 18,
  distMin: 0.06, distMax: 2.0,
  yawGain: 150,            // 手掌横移一个手掌宽度转多少度
  pitchGain: 110,
  pitchLimit: 70,
  deadzonePx: 2.0,
  smoothMin: 10, smoothBeta: 0.6,
  grabAhead: 7,            // 抓取球心放在相机前方多远
  grabRadius: 22,          // 引力半径：太大边上一圈粒子只挪一半，会糊成一团
  palmAhead: 9,            // 手掌力场中心放在相机前方多远
  palmRadius: 20,          // 手掌排斥/旋涡的影响半径
  grabSpin: 2.9,           // 汇聚时绕视线轴的旋转量，转起来才像"被吸走"
  grabRamp: 0.30,          // 单个粒子从原位缩到球心的耗时
  grabWave: 0.45,          // 波前延迟：越远的粒子越晚动，形成向内涌的层次
  pinchOpen: 0.85,         // 指距比高于此值视为张开
  pinchShut: 0.35,         // 低于此值视为捏紧
  pinchChargeSec: 2.2,     // 捏住多久充满
  pinchBurstDelayMs: 300,  // 松手后等这么久再爆炸，给双捏留窗口
  pinchDoubleMs: 400,      // 双捏判定窗口
  portraitHoldMs: 480,     // 比 1 停住多久算“叫人像出来”
  portraitLostMs: 1200,    // 手离开画面多久后人像散开
  stillPx: 5,              // 短窗口平均位移低于此值算静止
  stillWindow: 8,
  flickTau: 0.5,           // 甩动惯性衰减时间常数，秒
  flickMin: 12,            // 低于这个角速度就不滑行
  flickWindow: 6,
  reacquireSec: 0.15,      // 手回来后的增益渐入
  lostFrames: 6,
  twoHandConfirm: 3,
  twoHandExit: 5,
  dprLimit: 2
};

// 形态表。手指 1/2/3/4 分别对应 0/1/2/3。
// 0/1 是平面人像，2/3 是局部 3D 形态，仍然走同一套 aTarget/aColor/aSize 管线。
const SHAPES = [
  { id: 'portrait',  label: '人像1', kind: 'portrait' },
  { id: 'portrait2', label: '人像2', kind: 'portrait' },
  { id: 'galaxy',    label: '银河',  kind: 'shape' },
  { id: 'dna',       label: 'DNA',   kind: 'shape' }
];
const isPortraitShape = (idx) => !!(SHAPES[idx] && SHAPES[idx].kind === 'portrait');

const PINCH_CAL_KEY = 'particle-pinch-cal-v1';
function readPinchCal(){
  try {
    const raw = JSON.parse(localStorage.getItem(PINCH_CAL_KEY) || 'null');
    if (raw && Number.isFinite(raw.lo) && Number.isFinite(raw.hi) && raw.hi - raw.lo >= 0.2) {
      return { lo: raw.lo, hi: raw.hi, calibrated: true };
    }
  } catch(_) {}
  return { lo: CFG.pinchShut, hi: CFG.pinchOpen, calibrated: false };
}
let pinchCal = readPinchCal();

// 人像：一张抠好的透明底照片，所有粒子最后都落到它上面
const PORTRAIT = {
  url: './assets/portrait-particles.json',
  photoUrl: './assets/portrait.png',
  height: 7.2,             // 在世界里的高度
  ahead: 8.6               // 摆在相机前方多远
};

const TM_URLS = [
  { js: 'https://registry.npmmirror.com/@mediapipe/tasks-vision/1.1.1/files/vision_bundle.mjs',
    wasm: 'https://registry.npmmirror.com/@mediapipe/tasks-vision/1.1.1/files/wasm' },
  { js: 'https://unpkg.com/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs',
    wasm: 'https://unpkg.com/@mediapipe/tasks-vision@1.1.1/wasm' }
];
const THREE_URLS = [
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
];
const MODEL_URLS = [
  './hand_landmarker.task',
  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
];
const MODEL_CACHE = 'particle-hand-model-v1';
const MODEL_KEY = '/__model__/hand_landmarker.task';

const HAND_EDGES = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]
];

/* ------------------------------ 工具 ---------------------------------- */

const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const DEBUG_GRAB = new URLSearchParams(location.search).get('grab') === '1';
// grab=2 直接把抓取状态钉在"完全收拢"，用来截图看最终形态
const DEBUG_GRAB_HOLD = new URLSearchParams(location.search).get('grab') === '2';
const DEBUG_PORTRAIT = new URLSearchParams(location.search).get('portrait') === '1';
const DEBUG_MORPH = parseFloat(new URLSearchParams(location.search).get('morph'));
const DEBUG_SHAPE = parseInt(new URLSearchParams(location.search).get('shape'), 10);
const DEBUG_PINCH = parseFloat(new URLSearchParams(location.search).get('pinch'));
const DEBUG_QUALITY_LOCK = new URLSearchParams(location.search).get('lockq') === '1';
const DEMO_MODE = new URLSearchParams(location.search).get('demo') === '1';
// 三个可调项：n=粒子数，drift=漂移幅度，tw=闪烁幅度
const QS = new URLSearchParams(location.search);
const TUNE = {
  n: parseInt(QS.get('n'), 10),
  drift: parseFloat(QS.get('drift')),
  tw: parseFloat(QS.get('tw')),
  size: parseFloat(QS.get('size')),
  edge: parseFloat(QS.get('edge'))
};
const PORTRAIT_POINT_SIZE = 3.3;
const QUALITY = { low: 9000, mid: 15000, high: 24000 };
const QUALITY_ORDER = ['low', 'mid', 'high'];
const QUALITY_LABEL = { low: '低画质', mid: '中画质', high: '高画质', custom: '自定义' };
const qParam = QS.get('q');
let qualityLevel = QUALITY[qParam] ? qParam : 'mid';
if (QUALITY[qParam]) CFG.particles = QUALITY[qParam];
if (Number.isFinite(TUNE.n) && TUNE.n >= 2000 && TUNE.n <= 220000) {
  CFG.particles = TUNE.n;
  qualityLevel = 'custom';
}
let activeParticles = CFG.particles;
const INITIAL_QUALITY_LEVEL = qualityLevel;
const lerp = (a,b,t)=> a+(b-a)*t;
const wait = ms=> new Promise(r=>setTimeout(r,ms));

/** 指数平滑：dt 越大跟得越快，和帧率无关。 */
const smoothTo = (cur, target, rate, dt)=> cur + (target-cur)*(1-Math.exp(-rate*dt));

/* ---------------------------- 手部量算 -------------------------------- */

const dist2 = (a,b)=> Math.hypot(a.x-b.x, a.y-b.y);

function palm(lm){
  // 手腕是侧倾支点，用它做平移参考最稳
  return { x: lm[0].x, y: lm[0].y, scale: dist2(lm[0], lm[9]) || 1e-6 };
}

function fingers(lm){
  const w = lm[0];
  const up = (tip, pip) => dist2(lm[tip], w) > dist2(lm[pip], w) * 1.06;
  const index = up(8, 6), middle = up(12, 10), ring = up(16, 14), pinky = up(20, 18);
  let extended = 0;
  for (const v of [index, middle, ring, pinky]) if (v) extended++;
  const s = palm(lm).scale;
  return {
    extended, index, middle, ring, pinky,
    thumbIn: dist2(lm[4], lm[5]) / s < 0.9,
    pinch: dist2(lm[4], lm[8]) / s
  };
}

/* ---------------------------- 相机状态 -------------------------------- */

const view = { yaw: 0, pitch: 0, dist: 0.35, roll: 0 };
let prevPalm = null;
let yawVel = 0, pitchVel = 0;
let flick = [];              // 最近几帧的 yaw/pitch 增量
let coasting = null;         // { yaw, pitch } 角速度，度/秒
let awaitingReacquire = false;
let gainRamp = 1;
let bob = 0;               // 相机前向惯量

/* ------------------------------ 场景 ---------------------------------- */

const stage = document.getElementById('stage');
const glCanvas = document.getElementById('gl');
const hudEl = document.getElementById('hud');
let THREE = null, renderer = null, scene = null, camera = null;
let field = null, glow = null, aura = null, portraitInfo = null, portraitMesh = null;
let genericGlow = null, photoGlow = null;
// [0]=JSON原色人像，[1]=照片蓝色调人像，[2]=银河，[3]=DNA
let portraitSets = [null, null, null, null];
let currentPortrait = 0;             // 当前形态索引，沿用旧名字减少改动
let switchQueue = null;             // 待切换的目标 index
let grabMix = 0, grabTarget = 0, grabT = 0;
let grabHeld = false;                       // 捏合滞后：避免临界抖动
let pinchOverride = null;                   // 测试/截图时强制一个捏合强度
let heartCharge = 0;
let heartLocked = false;
let lockedCharge = 0;
let pendingBurstAt = 0;
let lastPinchReleaseAt = 0;
let lastPinchReleaseCharge = 0;
let lastPinch01 = 0;
let burstK = 0, burstKick = 0;
let heartCooldownUntil = 0;
let waitPinchRelease = false;
const pinchPoint = { x: 0.5, y: 0.5 };      // 拇指-食指捏合点（归一化图像坐标）
const filterPinchX = { v: null }, filterPinchY = { v: null };
const palmPoint = { x: 0.5, y: 0.5 };       // 掌心在画面里的位置
const heartPoint = { x: 0.5, y: 0.5 };      // 爱心贴在掌心的位置
const filterPalmCenterX = { v: null }, filterPalmCenterY = { v: null };
const filterHeartX = { v: null }, filterHeartY = { v: null };
let palmTarget = 0, palmStrength = 0;
let palmPresent = false;
let portraitMix = 0, portraitTarget = 0;
let qualityAccum = 0, qualityFrames = 0, qualityCooldown = 0;
let demoCaption = '星云';
let trailScene = null, trailCamera = null;
let trailFadeMat = null;
let heartAura = null;
let chargeRing = null;
let burstRing = null, burstFlash = null;
let burstFxT = 1e9;
const BURST_FX_LIFE = 0.8;
const TRAILS_ENABLED = new URLSearchParams(location.search).get('trails') !== '0';

async function loadThree(onStage){
  let err = null;
  for (const url of THREE_URLS) {
    try { onStage('正在加载 3D 库…（' + new URL(url).host + '）'); return await import(url); }
    catch (e) { err = e; }
  }
  throw err || new Error('three.js 加载失败');
}

function fieldMaterial(){
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uOpacity: { value: 1 },
      uGrab: { value: new THREE.Vector3(0, 0, -999) },   // 抓取中心（世界坐标）
      uGrabAxis: { value: new THREE.Vector3(0, 0, 1) },  // 汇聚旋转轴（视线方向）
      uGrabRight: { value: new THREE.Vector3(1, 0, 0) }, // 心形所在平面的右方向
      uGrabUp: { value: new THREE.Vector3(0, 1, 0) },    // 心形所在平面的上方向
      uGrabR: { value: 26 },                             // 影响半径
      uGrabK: { value: 0 },                              // 强度 0~1
      uGrabForm: { value: 0 },                           // 位置成形：比亮度更快到位
      uGrabT: { value: 0 },                              // 从捏下开始经过的秒数
      uPalm: { value: new THREE.Vector3(0, 0, -999) },    // 手掌力场中心
      uPalmR: { value: CFG.palmRadius },
      uPalmK: { value: 0 },
      uBurstK: { value: 0 },
      uMorph: { value: 0 },                              // 0=星云 1=人像
      uPCenter: { value: new THREE.Vector3() },
      uPRight: { value: new THREE.Vector3(1,0,0) },
      uPUp: { value: new THREE.Vector3(0,1,0) },
      uPNormal: { value: new THREE.Vector3(0,0,1) },
      uPhotoGain: { value: 0.32 },                       // 人像态单点透明度：靠叠加发光，不能单点就压满

      uTwinkle: { value: Number.isFinite(TUNE.tw) ? TUNE.tw : 0.12 },
      uSize: { value: (Number.isFinite(TUNE.size) ? TUNE.size : PORTRAIT_POINT_SIZE) * renderer.getPixelRatio() },
      uHeadTurn: { value: 0 },                           // 头部轻微左右转，露出一点体积
      uHeadTilt: { value: 0 },
      uPortraitH: { value: PORTRAIT.height },
      cA: { value: new THREE.Color(0x9fe8ff) },
      cB: { value: new THREE.Color(0x6f9dff) },
      cC: { value: new THREE.Color(0xd6c4ff) }
    },
    vertexShader: `
      attribute float aSeed; attribute float aTint;
      attribute vec3 aTarget; attribute vec3 aColor; attribute float aEdge;
      attribute float aSize; attribute float aAlpha;
      uniform float uTime;
      uniform vec3 uGrab; uniform vec3 uGrabAxis; uniform vec3 uGrabRight; uniform vec3 uGrabUp;
      uniform float uGrabR; uniform float uGrabK; uniform float uGrabForm; uniform float uGrabT;
      uniform vec3 uPalm; uniform float uPalmR; uniform float uPalmK;
      uniform float uBurstK;
      uniform vec3 uPCenter; uniform vec3 uPRight; uniform vec3 uPUp; uniform vec3 uPNormal;
      uniform float uMorph; uniform float uDrift; uniform float uSize;
      uniform float uHeadTurn; uniform float uHeadTilt; uniform float uPortraitH;
      varying float vShade; varying float vTint; varying float vWarm; varying float vPhoto; varying float vEdge;
      varying float vSeed; varying float vHeartG; varying float vDust; varying float vDepth; varying float vAlpha;
      varying vec3 vColor;

      vec3 rotAxis(vec3 v, vec3 axis, float ang){
        float c = cos(ang), s = sin(ang);
        return v*c + cross(axis, v)*s + axis*dot(axis, v)*(1.0-c);
      }

      void main(){
        vec3 p = position;
        float t = uTime * 0.35 + aSeed * 6.283;
        p.x += sin(t * 0.70) * 1.6;
        p.y += cos(t * 0.53) * 1.1;
        p.z += sin(t * 0.61 + 1.7) * 1.6;

        // 手掌力场：掌心附近的粒子被推开，同时绕视线轴轻微旋涡。
        if (uPalmK > 0.001) {
          vec3 pd = p - uPalm;
          float pdlen = length(pd);
          float pf = 1.0 - smoothstep(0.0, uPalmR, pdlen);
          if (pf > 0.0001) {
            vec3 pdir = pd / max(pdlen, 0.0001);
            vec3 swirl = normalize(cross(normalize(uGrabAxis), pdir) + vec3(0.00001));
            float palmFade = (1.0 - smoothstep(0.0, 0.08, uMorph)) * (1.0 - uGrabK * 0.65);
            p += (pdir * 7.5 + swirl * 2.4) * pf * uPalmK * palmFade;
          }
        }

        // 抓取：半径内的粒子错开起跑，先后飞进手心里的一颗霓虹爱心。
        float grabW = 0.0;
        vHeartG = 0.0;
        if (uGrabK > 0.001 && uMorph < 0.02) {
          vec3 q = p - uGrab;
          float gd = length(q);
          float d01 = clamp(gd / uGrabR, 0.0, 1.0);
          float falloff = 1.0 - smoothstep(0.55, 1.0, d01);
          float start = clamp((uGrabT - d01 * 0.45) / 0.30, 0.0, 1.0);
          start = start * start * (3.0 - 2.0 * start);
          // 位置用 form 快速成形，亮度用 uGrabK 跟随捏合力度慢慢加深。
          float k = start * uGrabForm * falloff;
          float heat = start * pow(max(uGrabK, 0.0001), 0.62) * falloff;
          if (max(k, heat) > 0.0005) {
            vec3 axis = normalize(uGrabAxis);
            vec3 right = normalize(uGrabRight);
            vec3 upv = normalize(uGrabUp);
            // 每颗粒子固定一个参数角，随时间沿心形轮廓流动
            float hh = fract(sin(aSeed * 91.37) * 43758.5453);
            float th = aSeed * 6.28318 + uTime * 0.55;
            float hx = 16.0 * pow(sin(th), 3.0) / 17.0;
            float hy = (13.0 * cos(th) - 5.0 * cos(2.0 * th) - 2.0 * cos(3.0 * th) - cos(4.0 * th)) / 17.0 + 0.18;
            // 90% 的粒子贴在外轮廓，内部只留很薄一层，避免高蓄力糊成白团
            float rr = hh < 0.90 ? (0.90 + hh / 0.90 * 0.10) : (0.12 + (hh - 0.90) / 0.10 * 0.62);
            float heartScale = 1.8 + 0.9 * uGrabK;
            float pulse = 1.0 + 0.10 * uGrabK * sin(uTime * 6.28318 * (1.0 + 0.6 * uGrabK));
            vec3 heartW = uGrab
              + (right * hx + upv * hy) * heartScale * rr * pulse
              + axis * ((hh - 0.5) * 0.45);
            // 飞行途中绕视线轻轻转一下，落进心形时有收束感
            vec3 swing = rotAxis(p - uGrab, axis, k * 0.5);
            p = uGrab + mix(swing, heartW - uGrab, k);
            grabW = heat;
            vHeartG = clamp(hy * heartScale * rr / 2.7 + 0.5, 0.0, 1.0);
          }
        }

        // 松手爆炸：爱心附近的粒子沿各自方向冲出去。
        if (uBurstK > 0.001) {
          vec3 bd = p - uGrab;
          float bl = length(bd);
          float bf = 1.0 - smoothstep(0.0, 11.0, bl);
          vec3 bdir = normalize(bd + vec3(
            sin(aSeed * 91.7), cos(aSeed * 63.1), sin(aSeed * 37.9)
          ) * 0.35);
          p += bdir * uBurstK * bf * 9.5;
        }

        // 人像：aTarget 是照片平面上的点，z 是从明暗和轮廓估出来的厚度。
        // aEdge < 0 的点是头部周围的悬浮尘埃；其余是脸、头发和衣服上的网点。
        float dust = step(aEdge, -0.5);
        float edgeAmt = clamp(max(aEdge, 0.0), 0.0, 1.0);
        vec3 local = aTarget;
        // 绕 Y / X 只转几度，靠鼻子、眼窝、发际线的深度差产生体积感。
        float cy = cos(uHeadTurn), sy = sin(uHeadTurn);
        local.xz = mat2(cy, -sy, sy, cy) * local.xz;
        float cx = cos(uHeadTilt), sx = sin(uHeadTilt);
        local.yz = mat2(cx, -sx, sx, cx) * local.yz;
        vec3 targetW = uPCenter + uPRight * local.x + uPUp * local.y + uPNormal * local.z;
        // 结构点几乎不动，暗部和尘埃才允许呼吸，脸不会一直发虚。
        float driftAmt = uDrift * (0.08 + 0.28 * (1.0 - edgeAmt) + 1.8 * dust);
        targetW += vec3(
          sin(uTime * 0.70 + aSeed * 41.0),
          cos(uTime * 0.55 + aSeed * 29.0),
          sin(uTime * 0.85 + aSeed * 17.0)
        ) * driftAmt;
        // 从上往下扫过一遍，再按粒子自己的节奏落位。
        float scan = clamp(0.5 - local.y / max(uPortraitH, 0.001), 0.0, 1.0);
        float mp = clamp(uMorph * 1.42 - aSeed * 0.16 - scan * 0.10, 0.0, 1.0);
        mp = mp * mp * (3.0 - 2.0 * mp);
        mp = 1.0 - pow(1.0 - mp, 3.0);
        p = mix(p, targetW, mp);

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float d = -mv.z;
        vShade = clamp(1.0 - (d - 20.0) / 150.0, 0.22, 1.0) * (1.0 + grabW * 0.35);
        vTint = aTint;
        vWarm = grabW;
        vPhoto = mp;
        vEdge = edgeAmt * mp;
        vSeed = aSeed;
        vColor = aColor;
        vDust = dust * mp;
        vDepth = local.z;
        vAlpha = aAlpha;
        float halo = step(0.90, fract(aSeed * 17.0));
        float sz = clamp(150.0 / d, 1.2, 9.0) * (0.7 + aSeed * 0.6)
          * (1.0 + 0.18 * grabW + 0.45 * halo * grabW);
        gl_PointSize = mix(sz, aSize, mp);
        gl_PointSize *= 1.0 + uBurstK * 2.0;
        gl_PointSize *= 1.0 + sin(3.14159 * mp) * 0.22;   // 飞行途中只轻微放大，落位时不炸成光团
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform float uOpacity; uniform vec3 cA; uniform vec3 cB; uniform vec3 cC;
      uniform float uPhotoGain; uniform float uTime; uniform float uTwinkle; uniform float uGrabK; uniform float uBurstK;
      varying float vShade; varying float vTint; varying float vWarm; varying float vPhoto; varying float vEdge;
      varying vec3 vColor; varying float vSeed; varying float vHeartG; varying float vDust; varying float vDepth; varying float vAlpha;
      void main(){
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        // 星云要软光点；人像要更实的小点，细密的网点才立得住。
        float a = mix(smoothstep(0.5, 0.05, r), smoothstep(0.5, 0.38, r), vPhoto);
        vec3 col = mix(mix(cA, cB, vTint), cC, smoothstep(0.75, 1.0, vTint));
        // 抓取 = 霓虹爱心：底部玫瑰、顶部蓝青，双色渐变
        vec3 heartCol = mix(vec3(1.0, 0.28, 0.50), vec3(0.25, 0.72, 1.0), vHeartG);
        heartCol = mix(heartCol, vec3(1.0, 0.82, 0.92), uGrabK * 0.06);
        col = mix(col, heartCol, min(1.0, vWarm * 0.98));
        col = mix(col, vColor, vPhoto);
        // 轮廓、眉眼和唇线用冷白青提亮，暗部保留深蓝体积。
        col = mix(col, vec3(0.56, 0.92, 1.0), vEdge * 0.38);
        col = mix(col, vec3(0.03, 0.16, 0.42), vDust);
        float depthShade = clamp(1.0 + vDepth * 0.10, 0.82, 1.18);
        col *= depthShade;
        // 半路只闪一层蓝光，持续时间短，不会把整张脸洗白。
        float transit = sin(3.14159 * vPhoto);
        col = mix(col, vec3(0.10, 0.46, 1.0), transit * 0.24);
        float alpha = a * vShade * uOpacity * mix(1.0, 1.02, vWarm);
        alpha *= mix(1.0, vAlpha, vPhoto);
        alpha *= mix(1.0, 1.0 + vEdge * 0.55, vPhoto);
        alpha *= 1.0 + transit * 0.18;
        alpha *= mix(1.0, 0.52, vDust);
        // 抓取时把没被吸走的背景粒子压暗，爱心才能成为唯一焦点
        alpha *= mix(1.0, 0.28, uGrabK * (1.0 - vWarm));
        // 人像态每颗粒子自己呼吸，整张脸才会"活"起来
        float tw = 1.0 - uTwinkle + uTwinkle * sin(uTime * 2.6 + vSeed * 62.83);
        alpha *= mix(1.0, tw, vPhoto);
        col = mix(col, vec3(1.0, 0.62, 0.86), uBurstK * 0.45);
        alpha *= 1.0 + uBurstK * 1.1;
        gl_FragColor = vec4(col, alpha);

    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
