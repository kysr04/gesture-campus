}

/**
 * 把抠好的照片采样成 n 个粒子目标点。
 * 位置存的是"人像平面坐标"，真正的世界坐标在着色器里按相机朝向算，
 * 这样人像永远正面朝着你。
 */
async function loadPortrait(n, mode){
  // mode='json'：使用外部粒子坐标（原色）
  // mode='photo'：从 portrait.png 采样（蓝色调）
  if (mode === 'json') {
  const res = await fetch(PORTRAIT.url);
  if (!res.ok) throw new Error('人像 JSON 加载失败 ' + res.status);
  const pts = await res.json();
  if (!Array.isArray(pts) || !pts.length) throw new Error('人像 JSON 为空');

  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  for (const p of pts) {
    if (p.x < minx) minx = p.x;
    if (p.x > maxx) maxx = p.x;
    if (p.y < miny) miny = p.y;
    if (p.y > maxy) maxy = p.y;
  }
  const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
  const spanX = Math.max(1e-6, maxx - minx), spanY = Math.max(1e-6, maxy - miny);
  const jplaneH = PORTRAIT.height;
  const jplaneW = jplaneH * (spanX / spanY);

  const jtarget = new Float32Array(n * 3);
  const jcolor = new Float32Array(n * 3);
  const jedgeAttr = new Float32Array(n);
  const sizeAttr = new Float32Array(n);
  const alphaAttr = new Float32Array(n);

  // JSON 的 r 是原图像素半径，按屏幕高度等比换算成屏幕像素。
  const visH = 2 * PORTRAIT.ahead * Math.tan(31 * Math.PI / 180);
  const screenH = (jplaneH / visH) * (window.innerHeight || 800);
  const rScale = (screenH / spanY) * 3.5 * (renderer ? renderer.getPixelRatio() : 1);

  for (let i = 0; i < n; i++) {
    const p = pts[i % pts.length];
    const c = p.c || [255, 255, 255];
    const lum = (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) / 255;
    jtarget[i*3]   = (p.x - cx) / spanX * jplaneW;
    jtarget[i*3+1] = -(p.y - cy) / spanY * jplaneH;
    jtarget[i*3+2] = (lum - 0.5) * 0.5;      // 明暗给一点点厚度
    jcolor[i*3]   = Math.pow(c[0] / 255, 2.2);
    jcolor[i*3+1] = Math.pow(c[1] / 255, 2.2);
    jcolor[i*3+2] = Math.pow(c[2] / 255, 2.2);
    sizeAttr[i]  = (p.r || 2) * rScale;
    alphaAttr[i] = p.a != null ? p.a : 1;
    jedgeAttr[i]  = 0;
  }
  return { target: jtarget, color: jcolor, edge: jedgeAttr, size: sizeAttr, alpha: alphaAttr, planeW: jplaneW, planeH: jplaneH, meshPositions: [] };
  }

  // ===== portrait.png 采样（蓝色调，比 2 用）=====
  const img = new Image();
  img.src = PORTRAIT.photoUrl;
  await img.decode();

  // 采样密一点，眼睛、唇缝和发丝才不会在放大后变成一团。
  const W = 680;
  const H = Math.round(W * img.naturalHeight / img.naturalWidth);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingEnabled = true;
  x.imageSmoothingQuality = 'high';
  x.drawImage(img, 0, 0, W, H);
  const px = x.getImageData(0, 0, W, H).data;
  const N = W * H;

  // 亮度只描述明暗，不再直接等于颜色强度。
  // 抠图边缘先清掉低 alpha 的白边，否则放大后会浮出一圈白雾。
  const alpha = new Uint8Array(N);
  const alphaF = new Float32Array(N);
  const lum = new Float32Array(N);
  const skin = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const p = i * 4;
    const a = px[p + 3] < 24 ? 0 : px[p + 3];
    alpha[i] = a;
    alphaF[i] = a / 255;
    const r = px[p], g = px[p+1], b = px[p+2];
    const l = a ? (0.299*r + 0.587*g + 0.114*b) / 255 : 0;
    lum[i] = l;
    // 皮肤偏暖（R 明显高于 B），头发和衣服更灰/更暗。
    const warm = clamp((r - b) / 85, 0, 1);
    skin[i] = clamp((warm - 0.16) / 0.55, 0, 1)
            * clamp((l - 0.24) / 0.28, 0, 1);
  }

  /** 可分离盒式模糊，用来做低频明暗和轮廓距离。 */
  const boxBlur = (src, radius, passes) => {
    const a = Float32Array.from(src);
    const b = new Float32Array(N);
    const r = Math.max(1, radius | 0), win = r * 2 + 1;
    const at = (xx, yy) => a[clamp(yy, 0, H-1) * W + clamp(xx, 0, W-1)];
    for (let pass = 0; pass < passes; pass++) {
      for (let y = 0; y < H; y++) {
        const row = y * W;
        let sum = 0;
        for (let xx = -r; xx <= r; xx++) sum += at(xx, y);
        for (let xx = 0; xx < W; xx++) {
          b[row + xx] = sum / win;
          sum += at(xx + r + 1, y) - at(xx - r, y);
        }
      }
      for (let xx = 0; xx < W; xx++) {
        let sum = 0;
        for (let yy = -r; yy <= r; yy++) sum += b[clamp(yy, 0, H-1) * W + xx];
        for (let yy = 0; yy < H; yy++) {
          a[yy * W + xx] = sum / win;
          sum += b[clamp(yy + r + 1, 0, H-1) * W + xx]
               - b[clamp(yy - r, 0, H-1) * W + xx];
        }
      }
    }
    return a;
  };

  const base = boxBlur(lum, 5, 2);
  const skinCtx = boxBlur(skin, 8, 2);

  // 高频细节：眼睛、眉毛、鼻翼、唇缝和发丝都在这里。
  const feature = new Float32Array(N);
  let featureMax = 0, featureSum = 0, featureCount = 0;
  for (let yy = 1; yy < H-1; yy++) {
    for (let xx = 1; xx < W-1; xx++) {
      const i = yy*W + xx;
      if (alpha[i] < 24) continue;
      const gx = Math.abs(lum[i+1] - lum[i-1]) * 0.5;
      const gy = Math.abs(lum[i+W] - lum[i-W]) * 0.5;
      const hp = Math.abs(lum[i] - base[i]);
      feature[i] = clamp(gx * 4.4 + gy * 4.4 + hp * 5.2, 0, 1);
      featureMax = Math.max(featureMax, feature[i]);
      featureSum += feature[i];
      featureCount++;
    }
  }

  // 从透明边界向内做距离变换，得到发丝/肩膀的外轮廓带。
  const dist = new Int32Array(N).fill(9999);
  const queue = new Int32Array(N);
  let qh = 0, qt = 0;
  for (let yy = 0; yy < H; yy++) {
    for (let xx = 0; xx < W; xx++) {
      const i = yy*W + xx;
      if (alpha[i] < 24) continue;
      // 图片底边不是人像轮廓，不要在那儿点一条亮线。
      const edgePx = (xx > 0 && alpha[i-1] < 24)
        || (xx < W-1 && alpha[i+1] < 24)
        || (yy > 0 && alpha[i-W] < 24)
        || (yy < H-1 && alpha[i+W] < 24);
      if (edgePx) { dist[i] = 0; queue[qt++] = i; }
    }
  }
  while (qh < qt) {
    const i = queue[qh++];
    const d = dist[i] + 1;
    const xx = i % W, yy = (i / W) | 0;
    if (xx > 0 && alpha[i-1] > 24 && dist[i-1] > d) { dist[i-1] = d; queue[qt++] = i-1; }
    if (xx < W-1 && alpha[i+1] > 24 && dist[i+1] > d) { dist[i+1] = d; queue[qt++] = i+1; }
    if (yy > 0 && alpha[i-W] > 24 && dist[i-W] > d) { dist[i-W] = d; queue[qt++] = i-W; }
    if (yy < H-1 && alpha[i+W] > 24 && dist[i+W] > d) { dist[i+W] = d; queue[qt++] = i+W; }
  }
  const rim = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    if (dist[i] < 9999) rim[i] = clamp(1 - dist[i] / 7, 0, 1);
  }

  // 伪深度：低频明暗给出鼻梁/眼窝，距离场把头部做成一个鼓起的体块。
  const depth = new Float32Array(N);
  for (let yy = 0; yy < H; yy++) {
    const faceZone = 1 - clamp((yy / H - 0.70) / 0.14, 0, 1);
    for (let xx = 0; xx < W; xx++) {
      const i = yy*W + xx;
      if (alpha[i] < 24) continue;
      const dome = Math.min(1, dist[i] / 34) * 0.42 * faceZone;
      depth[i] = clamp((base[i] - 0.34) * 1.48, -0.52, 0.72)
               + dome - rim[i] * 0.20;
    }
  }

  // 用深度梯度算一个假法线，从左上方打光。鼻子、脸颊和眼窝就有了明暗。
  const reliefShade = new Float32Array(N).fill(1);
  for (let yy = 1; yy < H-1; yy++) {
    for (let xx = 1; xx < W-1; xx++) {
      const i = yy*W + xx;
      if (alpha[i] < 24) continue;
      const dx = (depth[i-1] - depth[i+1]) * 4.5;
      const dy = (depth[i-W] - depth[i+W]) * 4.5;
      const inv = 1 / Math.sqrt(dx*dx + dy*dy + 1);
      const lit = clamp(dx * inv * -0.58 + dy * inv * 0.54 + inv * 0.60, 0, 1);
      reliefShade[i] = 0.50 + 0.58 * lit;
    }
  }

  const cand = [];
  const cum = [];
  const EDGE_W = Number.isFinite(TUNE.edge) ? TUNE.edge : 1.0;
  let total = 0;
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    if (alpha[i] > 24) {
      cand.push(i);
      const yy = (i / W) | 0;
      const bottomFade = 1 - clamp((yy / H - 0.68) / 0.24, 0, 1) * 0.95;
      const detail = clamp((feature[i] - 0.14) / 0.52, 0, 1);
      // 被皮肤包围的暗部是眼窝、鼻孔和唇缝，要挖空，不能像头发一样铺满。
      const faceDark = skinCtx[i] * clamp((0.48 - lum[i]) / 0.30, 0, 1);
      const rimW = rim[i] * (0.06 + 0.94 * (1 - skinCtx[i]));
      // 遮罩内保底密度，头发和衣服不会因为暗而消失；
      // 细节和轮廓再叠上去，眼睛、眉毛、唇线才会变亮。
      total += (0.26
             + 0.30 * skin[i]
             + 0.20 * alphaF[i]
             + 0.26 * (1 - Math.min(1, lum[i] * 1.35))
             + detail * (0.90 + 6.8 * skinCtx[i]) * EDGE_W
             + rimW * 1.00
             + base[i] * 0.10) * bottomFade
             * (1 - faceDark * 0.52);
      cum.push(total);
    }
  }
  if (!cand.length) throw new Error('人像没有可用的像素');
  const pick = (r) => {
    let lo = 0, hi = cum.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < r) lo = mid + 1; else hi = mid; }
    return cand[lo];
  };

  const planeH = PORTRAIT.height;
  const planeW = planeH * W / H;
  const target = new Float32Array(n * 3);
  const color = new Float32Array(n * 3);
  const edgeAttr = new Float32Array(n);
  const sizeAttr = new Float32Array(n);
  const alphaAttr = new Float32Array(n);
  const baseSize = PORTRAIT_POINT_SIZE * (renderer ? renderer.getPixelRatio() : 1);
  const jx = planeW / W, jy = planeH / H;
  const dustCount = Math.floor(n * 0.024);

  // 细网格线：只铺到头/颈，不铺到肩膀底边。它让粒子表面更像图1的立体网罩。
  const meshPositions = [];
  const meshStep = 9;
  const meshRows = Math.max(2, Math.floor((H * 0.80) / meshStep));
  const meshCols = Math.max(2, Math.floor(W / meshStep));
  const grid = new Array(meshRows * meshCols).fill(null);
  for (let gy = 0; gy < meshRows; gy++) {
    for (let gx = 0; gx < meshCols; gx++) {
      const xx = Math.min(W - 1, gx * meshStep);
      const yy = Math.min(H - 1, gy * meshStep);
      const i = yy * W + xx;
      if (alpha[i] < 80) continue;
      grid[gy * meshCols + gx] = {
        x: (xx / W - 0.5) * planeW,
        y: -(yy / H - 0.5) * planeH,
        z: depth[i] + 0.03
      };
    }
  }
  for (let gy = 0; gy < meshRows; gy++) {
    for (let gx = 0; gx < meshCols; gx++) {
      const a = grid[gy * meshCols + gx];
      if (!a) continue;
      const right = gx + 1 < meshCols ? grid[gy * meshCols + gx + 1] : null;
      const below = gy + 1 < meshRows ? grid[(gy + 1) * meshCols + gx] : null;
      if (right) meshPositions.push(a.x,a.y,a.z, right.x,right.y,right.z);
      if (below) meshPositions.push(a.x,a.y,a.z, below.x,below.y,below.z);
    }
  }

  for (let i = 0; i < n; i++) {
    if (i < dustCount) {
      // 头部周围保留一小撮悬浮尘埃，落位后仍有“数字空间”的空气感。
      let dx = 0, dy = 0, ok = false;
      for (let tries = 0; tries < 12; tries++) {
        dx = (Math.random() - 0.5) * planeW * 1.30;
        dy = (Math.random() - 0.5) * planeH * 1.12;
        const pxX = clamp(Math.floor((dx / planeW + 0.5) * W), 0, W - 1);
        const pxY = clamp(Math.floor((0.5 - dy / planeH) * H), 0, H - 1);
        if (alpha[pxY * W + pxX] <= 24) { ok = true; break; }
      }
      if (!ok) {
        dx = (Math.random() < 0.5 ? -1 : 1) * planeW * (0.48 + Math.random() * 0.18);
        dy = (Math.random() - 0.5) * planeH * 1.04;
      }
      target[i*3]   = dx;
      target[i*3+1] = dy;
      target[i*3+2] = (Math.random() - 0.5) * 3.0;
      const g = 0.35 + Math.random() * 0.55;
      color[i*3]   = 0.012 * g;
      color[i*3+1] = 0.09 * g;
      color[i*3+2] = 0.30 * g;
      edgeAttr[i] = -1 - Math.random() * 0.25;
      sizeAttr[i] = baseSize * 0.62;
      alphaAttr[i] = 1;
      continue;
    }

    const k = pick(Math.random() * total);
    const sx = k % W, sy = (k / W) | 0;
    target[i*3]   = (sx / W - 0.5) * planeW + (Math.random() - 0.5) * jx * 0.72;
    target[i*3+1] = -(sy / H - 0.5) * planeH + (Math.random() - 0.5) * jy * 0.72;
    target[i*3+2] = depth[k] + (Math.random() - 0.5) * 0.07;
    const detail = clamp((feature[k] - 0.14) / 0.52, 0, 1);
    const faceDark = skinCtx[k] * clamp((0.48 - lum[k]) / 0.30, 0, 1);
    const rimW = rim[k] * (0.06 + 0.94 * (1 - skinCtx[k]));
    const syK = (k / W) | 0;
    const bodyDim = 1 - clamp((syK / H - 0.68) / 0.24, 0, 1) * 0.80;
    edgeAttr[i] = clamp(detail * (0.14 + 0.22 * skinCtx[k]) + rimW * 0.92, 0, 1) * bodyDim;

    // 三档受控蓝：暗部是海军蓝，脸是中蓝，轮廓和五官才用冷白青。
    // 保留原图的局部明暗，鼻梁、眼窝和唇形才不会被低频色块抹平。
    const form = base[k] * 0.60 + lum[k] * 0.40;
    const lv = clamp((form - 0.05) / 0.68, 0, 1);
    const tone = clamp((Math.pow(lv, 0.90) + skin[k] * 0.08) * (1 - faceDark * 0.36)
                     + clamp(depth[k] * 0.035, -0.025, 0.045), 0, 1);
    let cr = lerp(0.010, 0.070, tone);
    let cg = lerp(0.040, 0.420, tone);
    let cb = lerp(0.130, 0.880, tone);
    const shade = reliefShade[k];
    const hairDim = 0.42 + 0.58 * skinCtx[k];
    cr *= shade;
    cg *= shade;
    cb *= shade;
    cr *= hairDim * bodyDim;
    cg *= hairDim * bodyDim;
    cb *= hairDim * bodyDim;
    const ice = clamp(edgeAttr[i] * (0.58 + 0.16 * shade), 0, 0.68);
    cr = lerp(cr, 0.500, ice);
    cg = lerp(cg, 0.930, ice);
    cb = lerp(cb, 1.000, ice);
    color[i*3]   = cr;
    color[i*3+1] = cg;
    color[i*3+2] = cb;
    sizeAttr[i]  = baseSize * (0.72 + Math.random() * 0.28);
    alphaAttr[i] = 1;
  }

  // 背后那团光也按人像轮廓生成，而不是一个圆形光斑。
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = 280;
  glowCanvas.height = Math.round(glowCanvas.width * img.naturalHeight / img.naturalWidth);
  const gx = glowCanvas.getContext('2d');
  gx.filter = 'blur(17px)';
  gx.drawImage(img, 0, 0, glowCanvas.width, glowCanvas.height);
  gx.globalCompositeOperation = 'source-in';
  gx.fillStyle = '#1f6dff';
  gx.fillRect(0, 0, glowCanvas.width, glowCanvas.height);
  gx.globalCompositeOperation = 'source-over';
  gx.globalAlpha = 0.20;
  gx.filter = 'blur(8px)';
  gx.drawImage(img, 0, 0, glowCanvas.width, glowCanvas.height);
  gx.globalCompositeOperation = 'source-in';
  gx.fillStyle = '#6fdcff';
  gx.fillRect(0, 0, glowCanvas.width, glowCanvas.height);

  return {
    target, color, edge: edgeAttr, size: sizeAttr, alpha: alphaAttr, planeW, planeH, glowCanvas, meshPositions,
    stats: {
      featureMax: +featureMax.toFixed(3),
      featureMean: +(featureSum / Math.max(1, featureCount)).toFixed(3),
      pixels: featureCount
    }
  };
}

/** 固定种子，保证每次刷新和截图生成同一套形态。 */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shapeBaseSize(){
  return PORTRAIT_POINT_SIZE * (renderer ? renderer.getPixelRatio() : 1);
}

/** 银河：三条对数螺旋臂 + 明亮核心，先做一个固定倾斜角产生深度。 */
function buildGalaxy(n){
  const rand = mulberry32(0x9e3779b9);
  const target = new Float32Array(n * 3);
  const color = new Float32Array(n * 3);
  const edge = new Float32Array(n);
  const size = new Float32Array(n);
  const alpha = new Float32Array(n);
  const base = shapeBaseSize();
  const arms = 3, turns = 2.3, maxR = 5.4;
  const tiltX = 0.62, yawY = -0.22;
  const cosX = Math.cos(tiltX), sinX = Math.sin(tiltX);
  const cosY = Math.cos(yawY), sinY = Math.sin(yawY);

  for (let i = 0; i < n; i++) {
    const core = i < n * 0.12;
    const arm = i % arms;
    const t = core ? Math.pow(rand(), 1.7) : Math.pow(rand(), 0.72);
    const theta = t * Math.PI * 2 * turns
      + arm * (Math.PI * 2 / arms)
      + (rand() - 0.5) * 0.35 * (1 - t);
    const r = core
      ? Math.pow(rand(), 0.7) * 1.15
      : 0.5 + t * maxR * (0.82 + rand() * 0.18);
    const y0 = (rand() - 0.5) * (core ? 0.55 : 0.25 + r * 0.075);
    const x0 = Math.cos(theta) * r;
    const z0 = Math.sin(theta) * r;
    const y1 = y0 * cosX - z0 * sinX;
    const z1 = y0 * sinX + z0 * cosX;
    const x1 = x0 * cosY + z1 * sinY;
    const z2 = -x0 * sinY + z1 * cosY;

    target[i*3] = x1;
    target[i*3+1] = y1;
    target[i*3+2] = z2;

    const u = core ? 0 : clamp((r - 0.9) / maxR, 0, 1);
    let cr = lerp(1.00, 0.28, u);
    let cg = lerp(0.82, 0.56, u);
    let cb = lerp(0.42, 1.00, u);
    if (!core && i % 9 === 0) { cr = 0.72; cg = 0.36; cb = 1.00; }
    const g = 0.82 + rand() * 0.18;
    color[i*3]   = Math.min(1, cr * g);
    color[i*3+1] = Math.min(1, cg * g);
    color[i*3+2] = Math.min(1, cb * g);
    edge[i] = 0;
    size[i] = base * (core ? 1.10 + rand() * 0.60 : 0.55 + rand() * 0.55);
    alpha[i] = core ? 1.0 : 0.62 + rand() * 0.38;
  }

  return { target, color, edge, size, alpha, planeW: 11, planeH: 11, glowCanvas: null, meshPositions: [] };
}

/** DNA：双螺旋两条链 + 中间横档，局部 3D 坐标。 */
function buildDNA(n){
  const rand = mulberry32(0x51ed27);
  const target = new Float32Array(n * 3);
  const color = new Float32Array(n * 3);
  const edge = new Float32Array(n);
  const size = new Float32Array(n);
  const alpha = new Float32Array(n);
  const base = shapeBaseSize();
  const height = 7.2, radius = 1.55, turns = 3.4;
  const strandCount = Math.floor(n * 0.72);
  const tiltZ = 0.12, cosZ = Math.cos(tiltZ), sinZ = Math.sin(tiltZ);

  for (let i = 0; i < n; i++) {
    const t = rand() * 2 - 1;
    const y0 = t * height * 0.5;
    const ang = t * Math.PI * turns;
    const rung = i >= strandCount;
    let x0, z0;
    if (rung) {
      const s = rand();
      x0 = lerp(Math.cos(ang) * radius, -Math.cos(ang) * radius, s);
      z0 = lerp(Math.sin(ang) * radius, -Math.sin(ang) * radius, s);
    } else {
      const phase = (i % 2) * Math.PI;
      x0 = Math.cos(ang + phase) * radius;
      z0 = Math.sin(ang + phase) * radius;
    }
    x0 += (rand() - 0.5) * 0.08;
    z0 += (rand() - 0.5) * 0.08;

    target[i*3]   = x0 * cosZ - y0 * sinZ;
    target[i*3+1] = x0 * sinZ + y0 * cosZ;
    target[i*3+2] = z0;

    let cr, cg, cb;
    if (rung) { cr = 0.35; cg = 0.55; cb = 0.95; }
    else if (i % 2) { cr = 1.00; cg = 0.30; cb = 0.72; }
    else { cr = 0.22; cg = 0.78; cb = 1.00; }
    color[i*3] = cr; color[i*3+1] = cg; color[i*3+2] = cb;
    edge[i] = 0;
    size[i] = base * (rung ? 0.45 + rand() * 0.25 : 0.65 + rand() * 0.45);
    alpha[i] = rung ? 0.55 : 0.82 + rand() * 0.18;
  }

  return { target, color, edge, size, alpha, planeW: 4.5, planeH: 7.8, glowCanvas: null, meshPositions: [] };
}

function buildField(portrait){
  const n = CFG.particles;
  const pos = new Float32Array(n*3), seed = new Float32Array(n), tint = new Float32Array(n);
  for (let i=0;i<n;i++){
    const u = Math.random()*2-1, th = Math.random()*Math.PI*2;
    const rr = Math.sqrt(Math.max(0,1-u*u));
    const R = CFG.shellInner + Math.pow(Math.random(),0.65)*(CFG.shellOuter-CFG.shellInner);
    pos[i*3]   = rr*Math.cos(th)*R;
    pos[i*3+1] = u*R*0.55;          // 压扁成片状，穿行时更像星云
    pos[i*3+2] = rr*Math.sin(th)*R;
    seed[i] = Math.random();
    tint[i] = Math.random();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
  g.setAttribute('aTint', new THREE.BufferAttribute(tint,1));
  if (portrait) {
    // 用独立副本，避免 swapPortrait 的 set() 反过来污染 portraitSets
    g.setAttribute('aTarget', new THREE.BufferAttribute(new Float32Array(portrait.target), 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(new Float32Array(portrait.color), 3));
    g.setAttribute('aEdge', new THREE.BufferAttribute(new Float32Array(portrait.edge), 1));
    g.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(portrait.size), 1));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(new Float32Array(portrait.alpha), 1));
  }
  return g;
}

/** 切换到第 idx 个形态（0=JSON人像，1=照片人像，2=银河，3=DNA）。 */
function swapPortrait(idx){
  const d = portraitSets[idx];
  if (!d || !field) return;
  const attrs = field.geometry.attributes;
  attrs.aTarget.array.set(d.target);  attrs.aTarget.needsUpdate = true;
  attrs.aColor.array.set(d.color);    attrs.aColor.needsUpdate = true;
  attrs.aEdge.array.set(d.edge);      attrs.aEdge.needsUpdate = true;
  attrs.aSize.array.set(d.size);      attrs.aSize.needsUpdate = true;
  attrs.aAlpha.array.set(d.alpha);    attrs.aAlpha.needsUpdate = true;
  currentPortrait = idx;
  portraitInfo = d;
  if (aura) {
    aura.scale.set(d.planeW * 1.35, d.planeH * 1.20, 1);
    const map = idx === 0 ? genericGlow : idx === 1 ? photoGlow : genericGlow;
    if (map && aura.material.map !== map) {
      aura.material.map = map;
      aura.material.needsUpdate = true;
    }
    if (!isPortraitShape(idx)) aura.material.opacity = 0;
  }
  // 网格线只属于照片人像，切到 JSON 人像或 3D 形态时必须隐藏。
  if (portraitMesh) portraitMesh.visible = idx === 1 && portraitMix > 0.015;
}

/** 手心里那团光的贴图：中心亮核 + 一圈很淡的外环。 */
function glowTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.14, 'rgba(226,246,255,0.80)');
  g.addColorStop(0.34, 'rgba(120,196,255,0.28)');
  g.addColorStop(0.62, 'rgba(74,140,255,0.10)');
  g.addColorStop(1.00, 'rgba(60,110,255,0)');
  x.fillStyle = g;
  x.fillRect(0,0,256,256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function buildGlow(){
  const mat = new THREE.SpriteMaterial({
    map: glowTexture(),
    color: 0xbfe4ff,
    transparent: true,
    opacity: 0,
    depthTest: false,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const s = new THREE.Sprite(mat);
  s.scale.setScalar(4.2);
  s.renderOrder = 5;
  s.frustumCulled = false;
  return s;
}

async function buildScene(onStage){
  THREE = await loadThree(onStage);
  genericGlow = glowTexture();

  renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CFG.dprLimit));
  renderer.setClearColor(0x030916, 1);
  if (TRAILS_ENABLED) {
    // 轻量拖尾：先用半透明背景色盖住上一帧，再叠加当前帧。
    renderer.autoClear = false;
    renderer.clear();
    trailScene = new THREE.Scene();
    trailCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const fade = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.MeshBasicMaterial({
        color: 0x030916, transparent: true, opacity: 0.17,
        depthTest: false, depthWrite: false
      })
    );
    fade.frustumCulled = false;
    trailScene.add(fade);
    trailFadeMat = fade.material;
  } else {
    renderer.autoClear = true;
  }

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(62, 1, 0.5, 4000);

  onStage('正在采样人像…');
  let portrait = null;
  try { portraitSets[0] = await loadPortrait(CFG.particles, 'json'); }
  catch(e){ console.warn('人像1(JSON)加载失败', e); }
  try { portraitSets[1] = await loadPortrait(CFG.particles, 'photo'); }
  catch(e){ console.warn('人像2(照片)加载失败', e); }
  onStage('正在生成银河与 DNA…');
  try { portraitSets[2] = buildGalaxy(CFG.particles); }
  catch(e){ console.warn('银河生成失败', e); }
  try { portraitSets[3] = buildDNA(CFG.particles); }
  catch(e){ console.warn('DNA 生成失败', e); }

  portrait = portraitSets[0] || portraitSets[1] || portraitSets[2] || portraitSets[3] || null;
  currentPortrait = [0, 1, 2, 3].find(i => !!portraitSets[i]) ?? 0;
  portraitInfo = portrait;
  window.__portraitStats = portrait ? portrait.stats : null;

  field = new THREE.Points(buildField(portrait), fieldMaterial());
  field.geometry.setDrawRange(0, activeParticles);
  updateHudQuality();
  scene.add(field);

  glow = buildGlow();
  scene.add(glow);
  heartAura = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture(), color: 0xff5fa8,
    transparent: true, opacity: 0,
    depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  heartAura.scale.setScalar(8);
  heartAura.renderOrder = 4;
  heartAura.frustumCulled = false;
  scene.add(heartAura);
  chargeRing = new THREE.Mesh(
    new THREE.RingGeometry(0.985, 1.0, 96),
    new THREE.MeshBasicMaterial({
      color: 0xff7fbd, transparent: true, opacity: 0,
      side: THREE.DoubleSide, depthTest: false, depthWrite: false,
      blending: THREE.AdditiveBlending
    })
  );
  chargeRing.renderOrder = 4;
  chargeRing.frustumCulled = false;
  scene.add(chargeRing);
  burstRing = new THREE.Mesh(
    new THREE.RingGeometry(0.985, 1.0, 96),
    new THREE.MeshBasicMaterial({
      color: 0xffc0e0, transparent: true, opacity: 0,
      side: THREE.DoubleSide, depthTest: false, depthWrite: false,
      blending: THREE.AdditiveBlending
    })
  );
  burstRing.renderOrder = 5;
  burstRing.frustumCulled = false;
  scene.add(burstRing);
  burstFlash = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture(), color: 0xffd0e8,
    transparent: true, opacity: 0,
    depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  burstFlash.renderOrder = 5;
  burstFlash.frustumCulled = false;
  scene.add(burstFlash);

  if (portraitSets[1] && portraitSets[1].glowCanvas) {
    photoGlow = new THREE.CanvasTexture(portraitSets[1].glowCanvas);
    photoGlow.colorSpace = THREE.SRGBColorSpace;
  }

  // 人像背后的蓝色光晕
  aura = new THREE.Sprite(new THREE.SpriteMaterial({
    map: currentPortrait === 1 && photoGlow ? photoGlow : genericGlow,
    color: 0xffffff, transparent: true, opacity: 0,
    depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  aura.scale.set(portrait ? portrait.planeW * 1.35 : 11, portrait ? portrait.planeH * 1.20 : 11, 1);
  aura.renderOrder = -1;
  aura.frustumCulled = false;
  scene.add(aura);

  if (portrait && portrait.meshPositions && portrait.meshPositions.length) {
    const meshGeo = new THREE.BufferGeometry();
    meshGeo.setAttribute('position', new THREE.Float32BufferAttribute(portrait.meshPositions, 3));
    const meshMat = new THREE.LineBasicMaterial({
      color: 0x54c8ff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false
    });
    portraitMesh = new THREE.LineSegments(meshGeo, meshMat);
    portraitMesh.frustumCulled = false;
    portraitMesh.renderOrder = 1;
    portraitMesh.visible = false;
    scene.add(portraitMesh);
  }

  // 调试用：?shape=0..3 直接落到指定形态，配合 ?morph=1 出截图。
  if (Number.isFinite(DEBUG_SHAPE) && portraitSets[DEBUG_SHAPE]) {
    swapPortrait(DEBUG_SHAPE);
    portraitOn = true;
    portraitTarget = 1;
    if (Number.isFinite(DEBUG_MORPH)) portraitMix = DEBUG_MORPH;
  }

  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=> setTimeout(resize, 250));
  window.__ready = true;
}

function resize(){
  if (!renderer) return;
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  renderer.setSize(w, h, false);      // canvas 由 CSS 铺满，这里只改绘制缓冲
  if (field) {
    field.material.uniforms.uSize.value =
      (Number.isFinite(TUNE.size) ? TUNE.size : PORTRAIT_POINT_SIZE) * renderer.getPixelRatio();
  }
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function updateHudQuality(){
  if (!hudEl) return;
  const prefix = DEMO_MODE ? '演示 · ' + demoCaption + ' · ' : '粒子自我 · 手掌即方向 · ';
  hudEl.textContent = prefix +
    activeParticles.toLocaleString() + ' 粒子 · ' + (QUALITY_LABEL[qualityLevel] || '');
}

/** 2 秒平均帧时间超预算就降一档；每档至少停 3 秒，避免来回抖。 */
function stepQuality(dt){
  if (!field) return;
  if (dt <= 0 || dt > 0.2) return;
  if (qualityCooldown > 0) {
    qualityCooldown = Math.max(0, qualityCooldown - dt);
    return;
  }
  qualityAccum += dt;
  qualityFrames++;
  if (qualityAccum < 2.0) return;
  const avg = qualityAccum / qualityFrames;
  qualityAccum = 0;
  qualityFrames = 0;
  if (avg <= 0.026) return;
  let idx = QUALITY_ORDER.indexOf(qualityLevel);
  if (idx < 0) {
    if (CFG.particles > QUALITY.mid) idx = QUALITY_ORDER.indexOf('high');
    else if (CFG.particles > QUALITY.low) idx = QUALITY_ORDER.indexOf('mid');
    else idx = QUALITY_ORDER.indexOf('low');
  }
  if (idx <= 0) return;
  qualityLevel = QUALITY_ORDER[idx - 1];
  activeParticles = Math.min(CFG.particles, QUALITY[qualityLevel]);
  field.geometry.setDrawRange(0, activeParticles);
  qualityCooldown = 3.0;
  updateHudQuality();
  console.info('auto quality ->', qualityLevel, activeParticles);
}

function applyCamera(dt, elapsed){
  if (!renderer) return;
  // 甩动惯性：只在检测帧之外也继续推进，手停下后还会滑一小段。
  if (coasting) {
    view.yaw += coasting.yaw * dt;
    view.pitch = clamp(view.pitch + coasting.pitch * dt, -CFG.pitchLimit, CFG.pitchLimit);
    const k = Math.exp(-dt / CFG.flickTau);
    coasting.yaw *= k;
    coasting.pitch *= k;
    if (Math.hypot(coasting.yaw, coasting.pitch) < CFG.flickMin) coasting = null;
  }
  const r = CFG.orbitBase + view.dist * CFG.orbitGain + burstKick;
  const yaw = view.yaw * Math.PI/180;
  const pitch = clamp(view.pitch, -CFG.pitchLimit, CFG.pitchLimit) * Math.PI/180;
  camera.position.set(
    r*Math.cos(pitch)*Math.sin(yaw),
    r*Math.sin(pitch),
    r*Math.cos(pitch)*Math.cos(yaw)
  );
  const dir = new THREE.Vector3(0,0,0).sub(camera.position).normalize();
  const up = new THREE.Vector3(0,1,0).applyAxisAngle(dir, view.roll*Math.PI/180);
  camera.up.copy(up);
  camera.lookAt(0,0,0);
  camera.updateMatrixWorld();

  // 爱心状态机：捏住蓄力，松手 300ms 后爆炸；窗口内再捏一次则锁定。
  const nowMs = elapsed * 1000;
  if (DEBUG_GRAB_HOLD) {
    heartCharge = 1;
    grabTarget = 1;
  } else if (DEBUG_GRAB) {
    heartCharge = 1;
    grabTarget = 1;
  } else if (pinchOverride != null) {
    heartCharge = pinchOverride;
    grabTarget = pinchOverride;
  } else if (Number.isFinite(DEBUG_PINCH) && !portraitOn) {
    heartCharge = clamp(DEBUG_PINCH, 0, 1);
    grabTarget = heartCharge;
  } else if (portraitOn) {
    grabTarget = 0;
  } else if (heartLocked) {
    heartCharge = lockedCharge;
    grabTarget = lockedCharge;
  } else if (pendingBurstAt) {
    if (nowMs >= pendingBurstAt) {
      triggerBurst();
      grabTarget = 0;
    } else {
      grabTarget = heartCharge;
    }
  } else if (grabHeld) {
    heartCharge = Math.min(1, heartCharge + dt / CFG.pinchChargeSec);
    grabTarget = Math.max(0.18, lastPinch01 * 0.35, heartCharge);
  } else {
    grabTarget = 0;
    if (grabMix < 0.02) heartCharge = 0;
  }

  grabMix = smoothTo(grabMix, grabTarget, grabTarget > grabMix ? 14 : 8, dt);
  if (grabTarget > 0.01) grabT = Math.min(grabT + dt, 3.0);
  else if (grabMix < 0.02) grabT = 0;
  if (DEBUG_GRAB_HOLD) { grabMix = 1; grabT = 3; }
  burstK *= Math.exp(-dt / 0.5);
  if (burstK < 0.001) burstK = 0;
  burstKick *= Math.exp(-dt / 0.4);
  if (burstKick < 0.001) burstKick = 0;

  const fu = field.material.uniforms;
  fu.uGrabAxis.value.copy(dir);
  const grRight = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const grUp = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  fu.uGrabRight.value.copy(grRight);
  fu.uGrabUp.value.copy(grUp);
  palmStrength = smoothTo(palmStrength, palmTarget, palmTarget > palmStrength ? 12 : 8, dt);
  const palmNdcX = (palmPoint.x - 0.5) * 2;
  const palmNdcY = (0.5 - palmPoint.y) * 2;
  const palmHalfH = CFG.palmAhead * Math.tan(31 * Math.PI / 180);
  const palmHalfW = palmHalfH * camera.aspect;
  fu.uPalm.value.copy(camera.position)
    .addScaledVector(dir, CFG.palmAhead)
    .addScaledVector(grRight, palmNdcX * palmHalfW)
    .addScaledVector(grUp, palmNdcY * palmHalfH);
  fu.uPalmK.value = palmStrength;
  fu.uPalmR.value = CFG.palmRadius;
  // 爱心贴在掌心：用掌心位置投影到相机前方；锁定且手离开时保留最后位置。
  if (palmPresent || !heartLocked) {
    const ndcX = (heartPoint.x - 0.5) * 2;
    const ndcY = (0.5 - heartPoint.y) * 2;
    const halfH = CFG.grabAhead * Math.tan(31 * Math.PI / 180);
    const halfW = halfH * camera.aspect;
    fu.uGrab.value.copy(camera.position)
      .addScaledVector(dir, CFG.grabAhead)
      .addScaledVector(grRight, ndcX * halfW)
      .addScaledVector(grUp, ndcY * halfH);
  }
  const grabPoint = fu.uGrab.value;
  fu.uGrabK.value = grabMix;
  const formT = clamp((grabMix - 0.02) / 0.28, 0, 1);
  fu.uGrabForm.value = formT * formT * (3 - 2 * formT);
  fu.uGrabT.value = grabT;
  fu.uGrabR.value = CFG.grabRadius + 6 * clamp(heartCharge, 0, 1);
  fu.uBurstK.value = burstK;
  fu.uTime.value = elapsed;

  if (glow) {
    glow.position.copy(grabPoint);
    glow.scale.setScalar(3.0 + 1.2 * grabMix);
    glow.material.opacity = 0.08 + grabMix * 0.20;
    glow.material.color.setRGB(1.0, 0.30 + 0.22 * grabMix, 0.48 + 0.24 * grabMix);
  }
  if (heartAura) {
    heartAura.position.copy(grabPoint);
    heartAura.scale.setScalar(6.0 + 2.0 * grabMix);
    heartAura.material.opacity = grabMix * 0.05;
    heartAura.material.color.setRGB(1.0, 0.32 + 0.20 * grabMix, 0.56 + 0.18 * grabMix);
  }
  if (chargeRing) {
    chargeRing.position.copy(grabPoint);
    chargeRing.quaternion.copy(camera.quaternion);
    chargeRing.rotateZ(elapsed * (0.4 + heartCharge * 1.4));
    chargeRing.scale.setScalar(1.6 + 0.8 * clamp(heartCharge, 0, 1));
    chargeRing.material.opacity = grabMix * 0.28;
    chargeRing.material.color.setRGB(1.0, 0.45 + 0.20 * grabMix, 0.75 + 0.15 * grabMix);
  }
  if (burstRing && burstFlash) {
    if (burstFxT < BURST_FX_LIFE) {
      const t = clamp(burstFxT / BURST_FX_LIFE, 0, 1);
      const e = 1 - Math.pow(1 - t, 3);
      burstRing.position.copy(grabPoint);
      burstRing.quaternion.copy(camera.quaternion);
      burstRing.scale.setScalar(0.8 + 2.2 * e);
      burstRing.material.opacity = (1 - t) * 0.75;
      burstRing.material.color.setRGB(1.0, 0.65 + 0.25 * t, 0.85 + 0.10 * t);
      burstFlash.position.copy(grabPoint);
      burstFlash.scale.setScalar(1.2 + 2.2 * e);
      burstFlash.material.opacity = (1 - t) * 0.85;
    } else {
      burstRing.material.opacity = 0;
      burstFlash.material.opacity = 0;
    }
    burstFxT += dt;
  }
  if (trailFadeMat) {
    trailFadeMat.opacity = clamp(0.22 - 0.06 * grabMix, 0.14, 0.22);
  }

  // 人像：粒子按自己的节奏飞过去，最后全靠粒子自己堆出五官
  portraitMix = smoothTo(portraitMix, portraitTarget, portraitTarget > 0 ? 3.4 : 3.2, dt);
  if (DEBUG_PORTRAIT) portraitMix = 1;
  if (!Number.isNaN(DEBUG_MORPH)) portraitMix = DEBUG_MORPH;
  fu.uMorph.value = portraitMix;
  // 先散开再聚：散到底后切数据，再重新聚拢
  if (switchQueue != null && portraitMix < 0.04) {
    swapPortrait(switchQueue);
    portraitOn = true;
    portraitTarget = 1;
    switchQueue = null;
  }
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const upv = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  const fwd = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 2).negate();
  fu.uPCenter.value.copy(camera.position).addScaledVector(fwd, PORTRAIT.ahead);
  fu.uPRight.value.copy(right);
  fu.uPUp.value.copy(upv);
  fu.uPNormal.value.copy(fwd).negate();
  // 保真优先：不再额外转头，只留一丝呼吸感，脸型按原照片来。
  fu.uHeadTurn.value = Math.sin(elapsed * 0.32) * 0.006;
  fu.uHeadTilt.value = Math.cos(elapsed * 0.27) * 0.004;
  if (portraitMesh) {
    portraitMesh.position.copy(fu.uPCenter.value);
    portraitMesh.quaternion.copy(camera.quaternion);
    portraitMesh.rotateY(fu.uHeadTurn.value);
    portraitMesh.rotateX(fu.uHeadTilt.value);
    portraitMesh.visible = currentPortrait === 1 && portraitMix > 0.015;
    portraitMesh.material.opacity = Math.pow(clamp(portraitMix, 0, 1), 2) * 0.06;
  }
  if (aura) {
    aura.position.copy(camera.position).addScaledVector(fwd, PORTRAIT.ahead + 0.55);
    if (portraitInfo) aura.scale.set(portraitInfo.planeW * 1.35, portraitInfo.planeH * 1.20, 1);
    aura.material.opacity = isPortraitShape(currentPortrait) ? portraitMix * 0.08 : 0;
  }
  if (TRAILS_ENABLED && trailScene && trailCamera) {
    renderer.autoClear = false;
    renderer.render(trailScene, trailCamera);
    renderer.render(scene, camera);
  } else {
    renderer.autoClear = true;
    renderer.render(scene, camera);
  }
}

/* ---------------------------- 手势状态机 ------------------------------ */

const ui = {
  label: document.getElementById('label'),
  dot: document.getElementById('dot')
};
const setLabel = (text, color='#4a9dff')=>{
  ui.label.textContent = text;
  ui.dot.style.background = color;
  ui.dot.style.animation = color === '#4a9dff' ? 'blink 1.1s infinite' : 'none';
};

const calBtn = document.getElementById('calibrate');
const calResetBtn = document.getElementById('cal-reset');
const calInfoEl = document.getElementById('cal-info');
let calState = { active: false, phase: 'open', phaseStart: 0, max: -Infinity, min: Infinity };

function updateCalInfo(){
  if (!calInfoEl) return;
  calInfoEl.textContent = (pinchCal.calibrated ? '已标定 ' : '默认 ') +
    pinchCal.lo.toFixed(2) + '–' + pinchCal.hi.toFixed(2);
}

function startCalibration(){
  calState = { active: true, phase: 'open', phaseStart: 0, max: -Infinity, min: Infinity };
  grabTarget = 0;
  grabHeld = false;
  pinchOverride = null;
  calBtn.textContent = '取消标定';
  setLabel('标定：先张开手掌', '#ffd166');
}

function finishCalibration(){
  const lo = calState.min;
  const hi = calState.max;
  if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi - lo < 0.25) {
    setLabel('标定失败：范围太小', '#ff8b8b');
  } else {
    pinchCal = { lo, hi, calibrated: true };
    try { localStorage.setItem(PINCH_CAL_KEY, JSON.stringify({ lo, hi })); } catch(_) {}
    setLabel('标定完成', '#37e08a');
  }
  calState.active = false;
  calBtn.textContent = '重新标定';
  updateCalInfo();
}

calBtn.addEventListener('click', () => {
  if (calState.active) {
    calState.active = false;
    calBtn.textContent = '标定捏合';
    setLabel('已取消标定', '#7a9dff');
    return;
  }
  startCalibration();
});

calResetBtn.addEventListener('click', () => {
  pinchCal = { lo: CFG.pinchShut, hi: CFG.pinchOpen, calibrated: false };
  try { localStorage.removeItem(PINCH_CAL_KEY); } catch(_) {}
  calState.active = false;
  calBtn.textContent = '标定捏合';
  updateCalInfo();
  setLabel('已恢复默认捏合范围', '#7a9dff');
});

updateCalInfo();
if (pinchCal.calibrated) calBtn.textContent = '重新标定';

let lostCount = 0;
let twoHandFrames = 0, singleFrames = 0, twoHand = false;
let pendingShape = -1, pendingSince = 0, lostAt = 0;
let portraitCooldownUntil = 0;
let portraitOn = false;
let moveBuf = [];
const filterPalmX = { v: null }, filterPalmY = { v: null };

function oneEuro(state, x, dt){
  if (state.v === null) { state.v = x; return x; }
  const a = 1 - Math.exp(-CFG.smoothMin * dt);
  state.v = a*x + (1-a)*state.v;
  return state.v;
}

function triggerBurst(){
  const power = Math.max(heartCharge, lockedCharge, 0.3);
  burstK = Math.max(burstK, clamp(power, 0.3, 1.0));
  burstKick = 0.6;
  burstFxT = 0;
  if (burstFlashEl) {
    burstFlashEl.style.transition = 'none';
    burstFlashEl.style.opacity = '0.85';
    requestAnimationFrame(() => {
      burstFlashEl.style.transition = 'opacity .35s ease-out';
      burstFlashEl.style.opacity = '0';
    });
  }
  grabTarget = 0;
  heartCharge = 0;
  lockedCharge = 0;
  heartLocked = false;
  pendingBurstAt = 0;
  lastPinchReleaseAt = 0;
  lastPinchReleaseCharge = 0;
}

function onPinchEnter(now){
  if (now < heartCooldownUntil) return;
  // 松手后 300ms 内再捏：取消引爆，锁定/解锁。
  if (now - lastPinchReleaseAt < CFG.pinchDoubleMs && lastPinchReleaseCharge > 0.2) {
    if (heartLocked) {
      const charge = Math.max(lockedCharge, 0.6);
      heartCharge = charge;
      triggerBurst();
      heartCooldownUntil = now + 350;
      waitPinchRelease = true;
      grabHeld = false;
    } else {
      heartLocked = true;
      lockedCharge = Math.max(lastPinchReleaseCharge, 0.6);
      heartCharge = lockedCharge;
      pendingBurstAt = 0;
    }
    lastPinchReleaseAt = 0;
    return;
  }
  if (heartLocked) return;
  heartCharge = Math.max(heartCharge, lastPinch01 * 0.2);
}

function onPinchRelease(now){
  lastPinchReleaseAt = now;
  lastPinchReleaseCharge = heartLocked ? lockedCharge : heartCharge;
  if (heartLocked) return;
  if (heartCharge > 0.02) {
    pendingBurstAt = now + CFG.pinchBurstDelayMs;
  } else {
    pendingBurstAt = 0;
    heartCharge = 0;
  }
}

/** 每帧喂一次手部结果，返回本帧的控制意图。 */
function stepHands(hands, now, dt){
  const hasHand = hands.length > 0;

  // 标定模式：先张开 2 秒，再捏紧 2 秒，记录个人范围。
  if (calState.active) {
    if (!hasHand) {
      calState.phaseStart = 0;
      setLabel('标定：把手放进画面', '#ffd166');
      return;
    }
    const cf = fingers(hands[0]);
    if (!calState.phaseStart) calState.phaseStart = now;
    const elapsed = now - calState.phaseStart;
    if (calState.phase === 'open') {
      calState.max = Math.max(calState.max, cf.pinch);
      if (elapsed >= 2000) {
        calState.phase = 'close';
        calState.phaseStart = now;
        calState.min = Infinity;
        setLabel('标定：现在捏紧', '#ffd166');
      } else {
        setLabel('标定：保持张开 ' + Math.ceil((2000 - elapsed) / 1000) + 's', '#ffd166');
      }
    } else {
      calState.min = Math.min(calState.min, cf.pinch);
      if (elapsed >= 2000) {
        finishCalibration();
      } else {
        setLabel('标定：保持捏紧 ' + Math.ceil((2000 - elapsed) / 1000) + 's', '#ffd166');
      }
    }
    return;
  }

  if (!hasHand) {
    lostCount++;
    if (lostCount === CFG.lostFrames) {
      prevPalm = null;
      moveBuf = [];
      awaitingReacquire = true;
      gainRamp = 0;
      flick.length = 0;
      coasting = null;
    }
    const debugPinch = Number.isFinite(DEBUG_PINCH) && !portraitOn
      ? clamp(DEBUG_PINCH, 0, 1) : null;
    grabHeld = false;
    palmPresent = false;
    if (!heartLocked) {
      heartCharge = 0;
      pendingBurstAt = 0;
      waitPinchRelease = false;
    }
    palmTarget = 0;
    pendingShape = -1; pendingSince = 0;
    pinchPoint.x = 0.5; pinchPoint.y = 0.5;
    if (portraitOn) {
      if (!lostAt) lostAt = now;
      if (now - lostAt >= CFG.portraitLostMs) {
        portraitOn = false;
        portraitTarget = 0;
        portraitCooldownUntil = now + 900;
      }
      const label = (SHAPES[currentPortrait] && SHAPES[currentPortrait].label) || '形态';
      setLabel(portraitOn ? label + ' · 手回到画面' : '未检测到手', portraitOn ? '#c9b3ff' : '#4a9dff');
    } else {
      setLabel('未检测到手', '#4a9dff');
    }
    if (debugPinch != null) setLabel('调试捏合 ' + Math.round(debugPinch * 100) + '%', '#ffd166');
    return;
  }
  lostCount = 0;
  lostAt = 0;

  // 手回来第一帧只重建基准，不把这一帧的位移当成拖拽。
  if (awaitingReacquire) {
    prevPalm = palm(hands[0]);
    moveBuf = [];
    flick.length = 0;
    coasting = null;
    gainRamp = 0;
    awaitingReacquire = false;
    stepHands.lastCount = hands.length;
    stepHands.gapBase = null;
    filterPalmX.v = null;
    filterPalmY.v = null;
    filterPinchX.v = null;
    filterPinchY.v = null;
    filterHeartX.v = null;
    filterHeartY.v = null;
    grabHeld = false;
    palmPresent = true;
    if (!heartLocked) {
      heartCharge = 0;
      pendingBurstAt = 0;
    }
    waitPinchRelease = true;
    palmTarget = 0;
    setLabel('重新捕获', '#37e08a');
    return;
  }

  const main = hands[0];
  const p = palm(main);
  const f = fingers(main);
  pinchPoint.x = oneEuro(filterPinchX, (main[4].x + main[8].x) / 2, dt);
  pinchPoint.y = oneEuro(filterPinchY, (main[4].y + main[8].y) / 2, dt);
  palmPoint.x = oneEuro(filterPalmCenterX, (main[0].x + main[9].x) / 2, dt);
  palmPoint.y = oneEuro(filterPalmCenterY, (main[0].y + main[9].y) / 2, dt);
  palmPresent = true;
  heartPoint.x = oneEuro(filterHeartX, palmPoint.x + (main[12].x - palmPoint.x) * 0.15, dt);
  heartPoint.y = oneEuro(filterHeartY, palmPoint.y + (main[12].y - palmPoint.y) * 0.15, dt);

  // 手数变化时重建基准：(1) 手序可能翻转 (2) 换手后位移会突然很大
  if (hands.length !== stepHands.lastCount) {
    stepHands.lastCount = hands.length;
    prevPalm = null;
    moveBuf = [];
  }
  if (!prevPalm) { prevPalm = p; gainRamp = 1; setLabel('开始跟踪', '#37e08a'); return; }
  gainRamp = Math.min(1, gainRamp + dt / CFG.reacquireSec);

  const dxPx = (p.x - prevPalm.x) * stage.clientWidth;
  const dyPx = (p.y - prevPalm.y) * stage.clientHeight;
  moveBuf.push(dxPx, dyPx);
  while (moveBuf.length > CFG.stillWindow*2) { moveBuf.shift(); moveBuf.shift(); }

  // 双手：距离控制推进/后退
  if (hands.length >= 2) {
    twoHandFrames++; singleFrames = 0;
    if (twoHandFrames >= CFG.twoHandConfirm) twoHand = true;
  } else {
    singleFrames++; twoHandFrames = 0;
    if (twoHand && singleFrames >= CFG.twoHandExit) twoHand = false;
  }

  if (twoHand && hands.length >= 2) {
    const a = palm(hands[0]), b = palm(hands[1]);
    const gap = Math.hypot((a.x-b.x)*stage.clientWidth, (a.y-b.y)*stage.clientHeight);
    if (stepHands.gapBase == null) stepHands.gapBase = gap;
    // 两手分开 = 后退，合拢 = 前进
    view.dist = clamp(view.dist * (stepHands.gapBase / Math.max(gap, 1)), CFG.distMin, CFG.distMax);
    if (stepHands.gapBase) stepHands.gapBase = lerp(stepHands.gapBase, gap, 0.05);
    palmPresent = true;
    grabHeld = false;
    if (!heartLocked) { heartCharge = 0; pendingBurstAt = 0; }
    palmTarget = 0;
    coasting = null; flick.length = 0;
    pendingShape = -1; pendingSince = 0;
    setLabel('双手推进', '#7a9dff');
    prevPalm = p;
    return;
  }
  stepHands.gapBase = null;

  // 静止判定：用短窗口的平均位移，抖动方向来回摆、均值接近零
  let sx = 0, sy = 0;
  for (let i=0;i<moveBuf.length;i+=2){ sx += moveBuf[i]; sy += moveBuf[i+1]; }
  const n = moveBuf.length/2 || 1;
  const still = Math.hypot(sx/n, sy/n) <= CFG.stillPx;

  // 比 1/2/3 或小指 = 人像1 / 人像2 / 银河 / DNA。
  // 四条门控：对应手指伸直、拇指内收、手基本静止、保持一会儿。
  const isOne = f.index && !f.middle && !f.ring && !f.pinky && f.thumbIn;
  const isTwo = f.index && f.middle && !f.ring && !f.pinky && f.thumbIn;
  const isThree = f.index && f.middle && f.ring && !f.pinky && f.thumbIn;
  // 4 指和张开手掌太像，DNA 改用“小指单独伸出”，避免掌一开就误切。
  const isPinky = !f.index && !f.middle && !f.ring && f.pinky && f.thumbIn;
  const poseIndex = isOne ? 0 : isTwo ? 1 : isThree ? 2 : isPinky ? 3 : -1;
  const poseReady = poseIndex >= 0 && !!portraitSets[poseIndex] && still;

  if (!portraitOn && switchQueue == null) {
    if (poseReady) {
      if (pendingShape !== poseIndex) { pendingShape = poseIndex; pendingSince = now; }
      if (now - pendingSince >= CFG.portraitHoldMs && now >= portraitCooldownUntil) {
        heartLocked = false; heartCharge = 0; pendingBurstAt = 0;
        coasting = null; flick.length = 0;
        swapPortrait(poseIndex);
        portraitOn = true;
        portraitTarget = 1;
        portraitCooldownUntil = now + 900;
        pendingShape = -1; pendingSince = 0;
      }
    } else {
      pendingShape = -1; pendingSince = 0;
    }
  } else if (portraitOn && switchQueue == null) {
    // 已有形态时，比另一个数字也要停住一会儿，先散开再换数据。
    if (poseReady && poseIndex !== currentPortrait) {
      if (pendingShape !== poseIndex) { pendingShape = poseIndex; pendingSince = now; }
      if (now - pendingSince >= CFG.portraitHoldMs && now >= portraitCooldownUntil) {
        heartLocked = false; heartCharge = 0; pendingBurstAt = 0;
        coasting = null; flick.length = 0;
        switchQueue = poseIndex;
        portraitOn = false;
        portraitTarget = 0;
        portraitCooldownUntil = now + 900;
        pendingShape = -1; pendingSince = 0;
      }
    } else {
      pendingShape = -1; pendingSince = 0;
    }
  } else {
    pendingShape = -1; pendingSince = 0;
  }

  // 手掌平移 = 朝向。用增量累加，手停住就停。
  const gain = f.scale || 1;
  const turn = portraitOn ? 0.3 : 1;   // 人像出来时手还在动，减一点转速，人像才稳
  const moved = Math.hypot(dxPx, dyPx) > CFG.deadzonePx;
  if (moved) {
    const dYaw = -(dxPx / (gain*stage.clientWidth)) * CFG.yawGain * turn * gainRamp;
    const dPitch = (dyPx / (gain*stage.clientWidth)) * CFG.pitchGain * turn * gainRamp;
    view.yaw += dYaw;
    view.pitch = clamp(view.pitch + dPitch, -CFG.pitchLimit, CFG.pitchLimit);
    yawVel = dYaw / Math.max(dt, 1/120);
    pitchVel = dPitch / Math.max(dt, 1/120);
    coasting = null;
    if (gainRamp > 0.5) {
      flick.push({ yaw: dYaw, pitch: dPitch, dt });
      if (flick.length > CFG.flickWindow) flick.shift();
    }
  } else if (!coasting && flick.length >= 3) {
    // 手停住：看最近几帧的平均角速度，快划才滑行，慢停直接停。
    let sy = 0, sp = 0, sd = 0;
    for (const s of flick) { sy += s.yaw; sp += s.pitch; sd += s.dt; }
    const vy = sy / Math.max(sd, 1e-4);
    const vp = sp / Math.max(sd, 1e-4);
    if (Math.hypot(vy, vp) > CFG.flickMin) coasting = { yaw: vy, pitch: vp };
    flick.length = 0;
  }

  // 捏合 = 抓取。指距比越小捏得越紧。
  const calHi = pinchCal.hi, calLo = pinchCal.lo;
  let pinch01 = clamp((calHi - f.pinch) / Math.max(0.05, calHi - calLo), 0, 1);
  if (pinch01 < 0.05) pinch01 = 0;
  if (!portraitOn && Number.isFinite(DEBUG_PINCH)) pinch01 = clamp(DEBUG_PINCH, 0, 1);
  if (pinch01 > 0.05) { coasting = null; flick.length = 0; }
  lastPinch01 = pinch01;
  const wasHeld = grabHeld;
  if (waitPinchRelease) {
    if (pinch01 < 0.30) waitPinchRelease = false;
  } else if (!grabHeld && pinch01 > 0.45 && now >= heartCooldownUntil) {
    grabHeld = true;
  } else if (grabHeld && pinch01 < 0.30) {
    grabHeld = false;
  }
  if (!wasHeld && grabHeld) {
    // 形态态捏合也生效：先把形态散回星云，再让爱心接手。
    if (portraitOn) {
      portraitOn = false;
      portraitTarget = 0;
      switchQueue = null;
      pendingShape = -1; pendingSince = 0;
      portraitCooldownUntil = now + 600;
    }
    onPinchEnter(now);
  } else if (wasHeld && !grabHeld) {
    onPinchRelease(now);
  }

  // 手越快地划过，力场越强；形态态和捏合态都收一点，避免破坏主体。
  const speed = Math.hypot(dxPx, dyPx) / Math.max(dt, 1 / 120);
  const speed01 = clamp(speed / 2200, 0, 1);
  palmTarget = clamp(
    (0.48 + 0.78 * speed01) *
    (portraitOn ? 0.38 : 1) *
    (pinch01 > 0.05 ? 0.55 : 1),
    0, 1.2
  );

  const shapeLabel = (SHAPES[currentPortrait] && SHAPES[currentPortrait].label) || '形态';
  if (portraitOn) setLabel(shapeLabel + ' · 放下手散开', '#c9b3ff');
  else if (switchQueue != null) setLabel('切换中…', '#c9b3ff');
  else if (pendingShape >= 0) setLabel('保持比 ' + (pendingShape + 1) + '…', '#7a9dff');
  else if (heartLocked) setLabel('爱心已锁定', '#ffd166');
  else if (burstFxT < BURST_FX_LIFE) setLabel('爆炸', '#ff8b8b');
  else if (pendingBurstAt) setLabel('准备引爆…', '#ffd166');
  else if (grabHeld) setLabel('蓄力 ' + Math.round(heartCharge * 100) + '%', '#ffd166');
  else if (grabMix > 0.05) setLabel('散开中', '#ffd166');
  else setLabel('穿行中', '#37e08a');
  prevPalm = p;
}
stepHands.lastCount = -1;
stepHands.gapBase = null;

/* ------------------------- 摄像头与识别 ------------------------------- */

const camCanvas = document.getElementById('cam');
const camCtx = camCanvas.getContext('2d');
const video = document.createElement('video');
video.playsInline = true; video.muted = true; video.autoplay = true;

let landmarker = null, running = false;
let lastDetect = 0, lastTime = -1;

function drawCamera(hands){
  const w = camCanvas.width, h = camCanvas.height;
  camCtx.setTransform(1,0,0,1,0,0);
  camCtx.clearRect(0,0,w,h);
  camCtx.save();
  camCtx.translate(w,0); camCtx.scale(-1,1);
  try { camCtx.drawImage(video,0,0,w,h); } catch(_){}
  camCtx.restore();
  if (!hands || !hands.length) return;
  for (const lm of hands) {
    const P = i => ({ x: (1-lm[i].x)*w, y: lm[i].y*h });
    camCtx.strokeStyle = 'rgba(74,157,255,.85)'; camCtx.lineWidth = 2;
    camCtx.beginPath();
    for (const [a,b] of HAND_EDGES){ const pa=P(a), pb=P(b); camCtx.moveTo(pa.x,pa.y); camCtx.lineTo(pb.x,pb.y); }
    camCtx.stroke();
    for (let i=0;i<lm.length;i++){
      const q = P(i);
      camCtx.beginPath();
      camCtx.arc(q.x, q.y, [4,8,12,16,20].includes(i)?3.6:2.2, 0, Math.PI*2);
      camCtx.fillStyle = [4,8,12,16,20].includes(i) ? '#ffd166' : '#eaf2ff';
      camCtx.fill();
    }
  }
}

function loop(now){
  requestAnimationFrame(loop);
  const dt = loop.last ? Math.min(0.05, (now-loop.last)/1000) : 1/60;
  loop.last = now;

  if (!DEBUG_QUALITY_LOCK) stepQuality(dt);

  if (running && landmarker && video.readyState >= 2 && video.videoWidth &&
      now - lastDetect >= 33 && video.currentTime !== lastTime) {
    lastDetect = now;
    lastTime = video.currentTime;
    let hands = [];
    try { hands = (landmarker.detectForVideo(video, now) || {}).landmarks || []; }
    catch(_) { hands = []; }
    stepHands(hands, now, dt);
    drawCamera(hands);
    if (!hands.length && !DEBUG_GRAB && pinchOverride == null && !Number.isFinite(DEBUG_PINCH)) {
      grabTarget = 0;
    }
  }

  applyCamera(dt, now/1000);
}

/* ---------------------------- 启动流程 -------------------------------- */

const boot = document.getElementById('boot');
const msgEl = document.getElementById('msg');
const fillEl = document.getElementById('fill');
const goBtn = document.getElementById('go');
const errEl = document.getElementById('err');
const demoBtn = document.getElementById('demo-btn');
const demoNow = document.getElementById('demo-now');
const burstFlashEl = document.getElementById('burst-flash');

async function openCache(){
  try { return typeof caches === 'undefined' ? null : await caches.open(MODEL_CACHE); }
  catch(_) { return null; }
}

/** 多源竞速：同时下，5 秒后留传得多的那个。单源顺序会卡在不通的线路上。 */
async function fetchModel(onProgress){
  const cache = await openCache();
  if (cache) {
    const hit = await cache.match(MODEL_KEY).catch(()=>null);
    if (hit) { onProgress(1,1,1,true); return new Uint8Array(await hit.arrayBuffer()); }
  }
  const racers = MODEL_URLS.map(url => ({ url, ctrl: new AbortController(), chunks: [], got: 0, total: 0, done: false, ok: false }));
  const run = async r => {
    try {
      const res = await fetch(r.url, { signal: r.ctrl.signal });
      if (!res.ok) throw new Error('HTTP '+res.status);
      r.total = Number(res.headers.get('content-length')) || 0;
      const reader = res.body.getReader();
      for(;;){ const {done,value} = await reader.read(); if (done) break; r.chunks.push(value); r.got += value.length; }
      r.ok = true;
    } catch(e) { r.err = e; }
    r.done = true;
  };
  racers.forEach(run);
  const probeEnd = performance.now() + 5000, hardEnd = performance.now() + 20000;
  let win = null;
  while (performance.now() < hardEnd) {
    const done = racers.find(r => r.done && r.ok);
    if (done) { win = done; break; }
    if (performance.now() > probeEnd) {
      const best = [...racers].sort((a,b)=>b.got-a.got)[0];
      if (best && best.got > 65536) { win = best; break; }
    }
    await wait(150);
  }
  if (!win) throw new Error('模型源都没开始传输');
  racers.forEach(r => { if (r !== win) r.ctrl.abort(); });
  let last = performance.now(), lastBytes = win.got;
  while (!win.done) {
    await wait(200);
    if (win.got !== lastBytes) { lastBytes = win.got; last = performance.now(); }
    onProgress(win.total ? win.got/win.total : 0, win.got, win.total, false);
    if (performance.now() - last > 20000) { win.ctrl.abort(); throw new Error('下载停滞'); }
  }
  if (!win.ok) throw new Error('下载中断');
  const buf = new Uint8Array(win.got);
  let off = 0;
  for (const c of win.chunks) { buf.set(c, off); off += c.length; }
  if (cache) cache.put(MODEL_KEY, new Response(buf.slice(), { headers: { 'Content-Type':'application/octet-stream' } })).catch(()=>{});
  return buf;
}

async function createLandmarker(buf){
  let mod = null, wasm = '', err = null;
  for (const cdn of TM_URLS) {
    try { mod = await import(cdn.js); wasm = cdn.wasm; break; } catch(e){ err = e; }
  }
  if (!mod) throw err || new Error('MediaPipe 运行时加载失败');
  const fileset = await mod.FilesetResolver.forVisionTasks(wasm);
  const opt = {
    baseOptions: { modelAssetBuffer: buf, delegate: 'GPU' },
    runningMode: 'VIDEO', numHands: 2
  };
  try { return await mod.HandLandmarker.createFromOptions(fileset, opt); }
  catch(_) { opt.baseOptions.delegate = 'CPU'; return await mod.HandLandmarker.createFromOptions(fileset, opt); }
}

async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }
  });
  video.srcObject = stream;
  await video.play();
  await new Promise(r => video.videoWidth ? r() : video.addEventListener('loadeddata', r, { once: true }));
}

let demoStarted = false;

async function startDemo(){
  if (demoStarted) return;
  demoStarted = true;
  if (video.srcObject) {
    try { video.srcObject.getTracks().forEach(t => t.stop()); } catch(_) {}
    video.srcObject = null;
  }
  running = false;
  document.body.classList.add('demo');
  boot.classList.add('off');
  setLabel('演示模式', '#7a9dff');
  await wait(800);
  demoLoop();
}

function demoSetCaption(text){
  demoCaption = text;
  updateHudQuality();
}

async function demoShowShape(idx, holdMs = 3200){
  const label = (SHAPES[idx] && SHAPES[idx].label) || '形态';
  if (currentPortrait !== idx) {
    demoSetCaption('过渡');
    portraitOn = false;
    portraitTarget = 0;
    await wait(1200);          // 先散开，再换属性，避免硬切
    swapPortrait(idx);
  }
  demoSetCaption(label);
  portraitOn = true;
  portraitTarget = 1;
  setLabel('演示 · ' + label, '#c9b3ff');
  await wait(holdMs);
}

async function demoLoop(){
  await wait(1200);
  while (true) {
    for (const idx of [0, 1, 2, 3]) await demoShowShape(idx, 3200);

    // 回到星云，演示一次蓄力 → 爆炸
    portraitOn = false;
    portraitTarget = 0;
    heartLocked = false;
    lockedCharge = 0;
    heartCharge = 0;
    pendingBurstAt = 0;
    pinchOverride = null;
    demoSetCaption('星云');
    setLabel('演示 · 星云', '#c9b3ff');
    await wait(1400);

    grabHeld = true;
    for (let i = 0; i <= 45; i++) {
      heartCharge = Math.max(heartCharge, i / 45);
      demoSetCaption('蓄力 ' + Math.round(i / 45 * 100) + '%');
      await wait(60);
    }
    await wait(300);
    grabHeld = false;
    onPinchRelease(performance.now());
    demoSetCaption('松手 · 爆炸');
    await wait(900);
    heartCharge = 0;
    pendingBurstAt = 0;
    grabTarget = 0;
    demoSetCaption('星云');
    await wait(1400);
  }
}

async function boot0(){
  msgEl.textContent = '正在构建粒子场…';
  try { await buildScene(t => { msgEl.textContent = t; }); }
  catch(e){ msgEl.textContent = '3D 初始化失败'; errEl.textContent = String(e.message||e); return; }

  if (DEMO_MODE) {
    requestAnimationFrame(loop);
    startDemo();
    return;
  }

  msgEl.textContent = '正在准备手部识别…';
  let lastPaint = 0;
  try {
    const buf = await fetchModel((frac, got, total, cached) => {
      const now = performance.now();
      if (now - lastPaint < 120 && frac < 1) return;
      lastPaint = now;
      fillEl.style.width = (cached ? 100 : Math.round(frac*100)) + '%';
      msgEl.textContent = cached
        ? '识别模型已缓存，无需再下载。'
        : '正在下载手部模型（首次约 7.8MB）' + (total ? ' — ' + Math.round(frac*100) + '%  ' + (got/1048576).toFixed(1) + '/' + (total/1048576).toFixed(1) + ' MB' : '');
    });
    fillEl.style.width = '100%';
    landmarker = await createLandmarker(buf);
    msgEl.textContent = '就绪。点击开始，浏览器会请求摄像头权限。';
    goBtn.disabled = false;
    goBtn.textContent = '开启摄像头';
  } catch(e) {
    msgEl.textContent = '模型加载失败';
    errEl.textContent = String(e.message||e);
  }
  requestAnimationFrame(loop);
}

goBtn.addEventListener('click', async ()=>{
  goBtn.disabled = true;
  goBtn.textContent = '启动中…';
  try { await startCamera(); }
  catch(e){
    goBtn.disabled = false; goBtn.textContent = '重试';
    errEl.textContent = '拿不到摄像头：' + String(e.message||e) + '\n必须是 HTTPS 或 localhost。';
    return;
  }
  boot.classList.add('off');
  running = true;
  setLabel('未检测到手', '#4a9dff');
});

demoBtn.addEventListener('click', startDemo);
demoNow.addEventListener('click', startDemo);

// 调试用：控制台里能读到当前抓取状态
window.__dbg = () => ({
  grabMix, grabT, grabTarget, dist: view.dist,
  grabHeld, heartCharge, heartLocked, lockedCharge, pendingBurstAt, burstK, burstFxT,
  heartPoint: { ...heartPoint }, palmPresent,
  portraitMix, portraitTarget, portraitOn,
  palmStrength, palmTarget, palmPoint: { ...palmPoint }, trails: TRAILS_ENABLED,
  shapeIndex: currentPortrait, shapeLabel: (SHAPES[currentPortrait] && SHAPES[currentPortrait].label) || null,
  pinchOverride,
  pinchCal: { ...pinchCal },
  qualityLevel, activeParticles, configuredParticles: CFG.particles,
  coasting: coasting ? { yaw: +coasting.yaw.toFixed(1), pitch: +coasting.pitch.toFixed(1) } : null,
  gainRamp, awaitingReacquire,
  uGrabK: field ? field.material.uniforms.uGrabK.value : null,
  uGrabT: field ? field.material.uniforms.uGrabT.value : null,
  uMorph: field ? field.material.uniforms.uMorph.value : null,
  grabRadius: CFG.grabRadius,
  cam: camera ? camera.position.toArray().map(v => +v.toFixed(2)) : null
});
// 测试用：喂合成的关键点，不依赖摄像头
window.__test = {
  step: (hands, now, dt) => { stepHands(hands, now, dt); applyCamera(dt, now/1000); },
  state: () => ({ grabMix, grabT, grabTarget, grabHeld, heartCharge, heartLocked, lockedCharge, pendingBurstAt, burstK, burstFxT, heartPoint: { ...heartPoint }, palmPresent, pinchOverride, pinchCal: { ...pinchCal }, calibration: { ...calState }, qualityLevel, activeParticles, configuredParticles: CFG.particles, portraitMix, portraitOn, currentPortrait, shapeIndex: currentPortrait, switchQueue, pendingShape, yaw: view.yaw, pitch: view.pitch, dist: view.dist, coasting: !!coasting, coastingYaw: coasting ? coasting.yaw : 0, coastingPitch: coasting ? coasting.pitch : 0, gainRamp, awaitingReacquire, palmStrength, palmTarget, palmPoint: { ...palmPoint }, trails: TRAILS_ENABLED }),
  reset: () => { prevPalm = null; moveBuf = []; stepHands.lastCount = -1; stepHands.gapBase = null; pendingShape = -1; pendingSince = 0; portraitCooldownUntil = 0; pinchOverride = null; flick.length = 0; coasting = null; awaitingReacquire = false; gainRamp = 1; palmTarget = 0; palmStrength = 0; palmPoint.x = 0.5; palmPoint.y = 0.5; heartPoint.x = 0.5; heartPoint.y = 0.5; heartCharge = 0; heartLocked = false; lockedCharge = 0; pendingBurstAt = 0; lastPinchReleaseAt = 0; lastPinchReleaseCharge = 0; lastPinch01 = 0; burstK = 0; burstKick = 0; burstFxT = 1e9; heartCooldownUntil = 0; waitPinchRelease = false; grabHeld = false; palmPresent = false; },
  setPinch: (v) => { pinchOverride = clamp(v, 0, 1); grabTarget = pinchOverride; return pinchOverride; },
  clearPinch: () => { pinchOverride = null; },
  startCalibration,
  calibrationState: () => ({ ...calState, pinchCal: { ...pinchCal } }),
  setPinchCal: (lo, hi) => { pinchCal = { lo, hi, calibrated: true }; updateCalInfo(); return { ...pinchCal }; },
  resetPinchCal: () => {
    pinchCal = { lo: CFG.pinchShut, hi: CFG.pinchOpen, calibrated: false };
    try { localStorage.removeItem(PINCH_CAL_KEY); } catch(_) {}
    calState.active = false;
    calBtn.textContent = '标定捏合';
    updateCalInfo();
  },
  tickQuality: (dt) => stepQuality(dt),
  resetQuality: () => {
    qualityLevel = INITIAL_QUALITY_LEVEL;
    activeParticles = CFG.particles;
    qualityAccum = 0;
    qualityFrames = 0;
    qualityCooldown = 0;
    if (field) field.geometry.setDrawRange(0, activeParticles);
    updateHudQuality();
  },
  setPortrait: (v) => { portraitOn = !!v; portraitTarget = v ? 1 : 0; },
  setShape: (i) => {
    if (!portraitSets[i]) return false;
    swapPortrait(i);
    switchQueue = null;
    portraitOn = true;
    portraitTarget = 1;
    return true;
  },
  swap: swapPortrait
};
