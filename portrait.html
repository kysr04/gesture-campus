<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>粒子手势 · Particle Field</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#04060e;color:#e6eeff;overflow:hidden;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #app{display:flex;height:100%}
  #side{flex:0 0 280px;display:flex;flex-direction:column;gap:10px;padding:12px;
    background:#070a13;border-right:1px solid #141d31}
  #side h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;color:#7d90b5}
  #cam{display:block;width:100%;aspect-ratio:4/3;background:#000;border-radius:10px;
    border:1px solid #141d31}
  #state{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;
    background:#0b1120;border:1px solid #1a2540;font-size:14px;font-weight:600}
  #dot{width:8px;height:8px;border-radius:50%;background:#4a9dff;animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.25}}
  #hint{font-size:11.5px;color:#5f7093;line-height:1.75;margin-top:auto}
  #hint b{color:#8ea3c8}
  #stage{position:relative;flex:1;min-width:0}
  #stage canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;left:16px;top:14px;font-size:12px;color:#5d6c8c;pointer-events:none}
  #boot{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
    background:radial-gradient(circle at 50% 40%,rgba(14,22,44,.92),rgba(4,6,14,.97))}
  #boot.off{display:none}
  #msg{font-size:13px;color:#7d90b5;max-width:440px;line-height:1.7}
  #bar{width:min(340px,76vw);height:6px;border-radius:3px;background:#141d31;overflow:hidden}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#4a9dff,#37e08a);transition:width .2s}
  #go{padding:12px 40px;border:0;border-radius:999px;font:inherit;font-size:16px;
    font-weight:600;color:#04121f;background:linear-gradient(135deg,#7fe0ff,#37e08a)}
  #go[disabled]{opacity:.35}
  #err{font-size:12.5px;color:#ff8b8b;max-width:460px;white-space:pre-wrap;line-height:1.6}
  @media (orientation:portrait) and (max-width:900px){
    #app{display:block}
    #stage{position:absolute;inset:0}
    #side{position:absolute;z-index:5;top:12px;left:12px;width:150px;flex:none;padding:8px;
      gap:6px;background:rgba(7,10,19,.85);border:1px solid #1a2540;border-radius:12px}
    #hint{display:none}
    #state{font-size:11.5px;padding:6px 8px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>手势输入</h1>
    <canvas id="cam" width="320" height="240"></canvas>
    <div id="state"><span id="dot"></span><span id="label">初始化</span></div>
    <div id="hint">
      <b>手掌平移</b> 在粒子中穿行<br>
      <b>比 1</b> 原色人像<br>
      <b>比 2</b> 蓝色调人像<br>
      <b>捏合</b> 把周围的粒子吸进掌心<br>
      <b>两只手</b> 推进 / 后退<br>
      <b>手离开画面</b> 人像散开
    </div>
  </aside>
  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="hud">粒子场 · 手掌即方向</div>
  </main>
</div>

<div id="boot">
  <div id="msg">正在准备…</div>
  <div id="bar"><div id="fill"></div></div>
  <button id="go" disabled>加载中</button>
  <div id="err"></div>
</div>

<script type="module">
/* ═══════════════════════════════════════════════════════════════════════
   粒子手势交互 —— 从零实现

   设计要点：相机永远在粒子云内部绕行，所以手掌平移读起来是"穿行"而不是
   "看着一团东西转"。捏合时在相机前方聚起一团粒子，张开则散去。
   ═══════════════════════════════════════════════════════════════════════ */

/* ------------------------------ 参数 ---------------------------------- */

const CFG = {
  particles: 15000,        // 直接使用外部粒子坐标 JSON 的点数
  shellInner: 12,          // 云内半径要小于相机轨道半径，粒子才会从身边掠过
  shellOuter: 95,
  orbitBase: 9,            // 相机轨道半径 = orbitBase + dist * orbitGain
  orbitGain: 18,
  distMin: 0.06, distMax: 2.0,
  yawGain: 150,            // 手掌横移一个手掌宽度转多少度
  pitchGain: 110,
  pitchLimit: 70,
  deadzonePx: 2.0,
  smoothMin: 10, smoothBeta: 0.6,
  grabAhead: 7,            // 抓取球心放在相机前方多远
  grabRadius: 22,          // 引力半径：太大边上一圈粒子只挪一半，会糊成一团
  grabSpin: 2.9,           // 汇聚时绕视线轴的旋转量，转起来才像"被吸走"
  grabRamp: 0.30,          // 单个粒子从原位缩到球心的耗时
  grabWave: 0.45,          // 波前延迟：越远的粒子越晚动，形成向内涌的层次
  pinchOpen: 0.85,         // 指距比高于此值视为张开
  pinchShut: 0.35,         // 低于此值视为捏紧
  portraitHoldMs: 480,     // 比 1 停住多久算“叫人像出来”
  portraitLostMs: 1200,    // 手离开画面多久后人像散开
  stillPx: 5,              // 短窗口平均位移低于此值算静止
  stillWindow: 8,
  lostFrames: 6,
  twoHandConfirm: 3,
  twoHandExit: 5,
  dprLimit: 2
};

// 人像：一张抠好的透明底照片，所有粒子最后都落到它上面
const PORTRAIT = {
  url: './assets/portrait-particles.json',
  photoUrl: './assets/portrait.png',
  height: 7.2,             // 在世界里的高度
  ahead: 8.6               // 摆在相机前方多远
};

const TM_URLS = [
  { js: 'https://registry.npmmirror.com/@mediapipe/tasks-vision/1.1.1/files/vision_bundle.mjs',
    wasm: 'https://registry.npmmirror.com/@mediapipe/tasks-vision/1.1.1/files/wasm' },
  { js: 'https://unpkg.com/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs',
    wasm: 'https://unpkg.com/@mediapipe/tasks-vision@1.1.1/wasm' }
];
const THREE_URLS = [
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
];
const MODEL_URLS = [
  './hand_landmarker.task',
  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
];
const MODEL_CACHE = 'particle-hand-model-v1';
const MODEL_KEY = '/__model__/hand_landmarker.task';

const HAND_EDGES = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]
];

/* ------------------------------ 工具 ---------------------------------- */

const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const DEBUG_GRAB = new URLSearchParams(location.search).get('grab') === '1';
// grab=2 直接把抓取状态钉在"完全收拢"，用来截图看最终形态
const DEBUG_GRAB_HOLD = new URLSearchParams(location.search).get('grab') === '2';
const DEBUG_PORTRAIT = new URLSearchParams(location.search).get('portrait') === '1';
const DEBUG_MORPH = parseFloat(new URLSearchParams(location.search).get('morph'));
// 三个可调项：n=粒子数，drift=漂移幅度，tw=闪烁幅度
const QS = new URLSearchParams(location.search);
const TUNE = {
  n: parseInt(QS.get('n'), 10),
  drift: parseFloat(QS.get('drift')),
  tw: parseFloat(QS.get('tw')),
  size: parseFloat(QS.get('size')),
  edge: parseFloat(QS.get('edge'))
};
const PORTRAIT_POINT_SIZE = 3.3;
if (Number.isFinite(TUNE.n) && TUNE.n >= 20000 && TUNE.n <= 220000) CFG.particles = TUNE.n;
const lerp = (a,b,t)=> a+(b-a)*t;
const wait = ms=> new Promise(r=>setTimeout(r,ms));

/** 指数平滑：dt 越大跟得越快，和帧率无关。 */
const smoothTo = (cur, target, rate, dt)=> cur + (target-cur)*(1-Math.exp(-rate*dt));

/* ---------------------------- 手部量算 -------------------------------- */

const dist2 = (a,b)=> Math.hypot(a.x-b.x, a.y-b.y);

function palm(lm){
  // 手腕是侧倾支点，用它做平移参考最稳
  return { x: lm[0].x, y: lm[0].y, scale: dist2(lm[0], lm[9]) || 1e-6 };
}

function fingers(lm){
  const w = lm[0];
  const up = (tip, pip) => dist2(lm[tip], w) > dist2(lm[pip], w) * 1.06;
  const index = up(8, 6), middle = up(12, 10), ring = up(16, 14), pinky = up(20, 18);
  let extended = 0;
  for (const v of [index, middle, ring, pinky]) if (v) extended++;
  const s = palm(lm).scale;
  return {
    extended, index, middle, ring, pinky,
    thumbIn: dist2(lm[4], lm[5]) / s < 0.9,
    pinch: dist2(lm[4], lm[8]) / s
  };
}

/* ---------------------------- 相机状态 -------------------------------- */

const view = { yaw: 0, pitch: 0, dist: 0.35, roll: 0 };
let prevPalm = null;
let yawVel = 0, pitchVel = 0;
let bob = 0;               // 相机前向惯量

/* ------------------------------ 场景 ---------------------------------- */

const stage = document.getElementById('stage');
const glCanvas = document.getElementById('gl');
let THREE = null, renderer = null, scene = null, camera = null;
let field = null, glow = null, aura = null, portraitInfo = null, portraitMesh = null;
let portraitSets = [null, null];   // [0]=JSON原色，[1]=照片蓝色调
let currentPortrait = 0;
let switchQueue = null;             // 待切换的目标 index
let grabMix = 0, grabTarget = 0, grabT = 0;
let grabHeld = false;                       // 捏合滞后：避免临界抖动
const pinchPoint = { x: 0.5, y: 0.5 };      // 拇指-食指捏合点（归一化图像坐标）
const filterPinchX = { v: null }, filterPinchY = { v: null };
let portraitMix = 0, portraitTarget = 0;

async function loadThree(onStage){
  let err = null;
  for (const url of THREE_URLS) {
    try { onStage('正在加载 3D 库…（' + new URL(url).host + '）'); return await import(url); }
    catch (e) { err = e; }
  }
  throw err || new Error('three.js 加载失败');
}

function fieldMaterial(){
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uOpacity: { value: 1 },
      uGrab: { value: new THREE.Vector3(0, 0, -999) },   // 抓取中心（世界坐标）
      uGrabAxis: { value: new THREE.Vector3(0, 0, 1) },  // 汇聚旋转轴（视线方向）
      uGrabRight: { value: new THREE.Vector3(1, 0, 0) }, // 心形所在平面的右方向
      uGrabUp: { value: new THREE.Vector3(0, 1, 0) },    // 心形所在平面的上方向
      uGrabR: { value: 26 },                             // 影响半径
      uGrabK: { value: 0 },                              // 强度 0~1
      uGrabT: { value: 0 },                              // 从捏下开始经过的秒数
      uMorph: { value: 0 },                              // 0=星云 1=人像
      uPCenter: { value: new THREE.Vector3() },
      uPRight: { value: new THREE.Vector3(1,0,0) },
      uPUp: { value: new THREE.Vector3(0,1,0) },
      uPNormal: { value: new THREE.Vector3(0,0,1) },
      uPhotoGain: { value: 0.32 },                       // 人像态单点透明度：靠叠加发光，不能单点就压满
      uDrift: { value: Number.isFinite(TUNE.drift) ? TUNE.drift : 0.055 },
      uTwinkle: { value: Number.isFinite(TUNE.tw) ? TUNE.tw : 0.12 },
      uSize: { value: (Number.isFinite(TUNE.size) ? TUNE.size : PORTRAIT_POINT_SIZE) * renderer.getPixelRatio() },
      uHeadTurn: { value: 0 },                           // 头部轻微左右转，露出一点体积
      uHeadTilt: { value: 0 },
      uPortraitH: { value: PORTRAIT.height },
      cA: { value: new THREE.Color(0x9fe8ff) },
      cB: { value: new THREE.Color(0x6f9dff) },
      cC: { value: new THREE.Color(0xd6c4ff) }
    },
    vertexShader: `
      attribute float aSeed; attribute float aTint;
      attribute vec3 aTarget; attribute vec3 aColor; attribute float aEdge;
      attribute float aSize; attribute float aAlpha;
      uniform float uTime;
      uniform vec3 uGrab; uniform vec3 uGrabAxis; uniform vec3 uGrabRight; uniform vec3 uGrabUp;
      uniform float uGrabR; uniform float uGrabK; uniform float uGrabT;
      uniform vec3 uPCenter; uniform vec3 uPRight; uniform vec3 uPUp; uniform vec3 uPNormal;
      uniform float uMorph; uniform float uDrift; uniform float uSize;
      uniform float uHeadTurn; uniform float uHeadTilt; uniform float uPortraitH;
      varying float vShade; varying float vTint; varying float vWarm; varying float vPhoto; varying float vEdge;
      varying float vSeed; varying float vHeartG; varying float vDust; varying float vDepth; varying float vAlpha;
      varying vec3 vColor;

      vec3 rotAxis(vec3 v, vec3 axis, float ang){
        float c = cos(ang), s = sin(ang);
        return v*c + cross(axis, v)*s + axis*dot(axis, v)*(1.0-c);
      }

      void main(){
        vec3 p = position;
        float t = uTime * 0.35 + aSeed * 6.283;
        p.x += sin(t * 0.70) * 1.6;
        p.y += cos(t * 0.53) * 1.1;
        p.z += sin(t * 0.61 + 1.7) * 1.6;

        // 抓取：半径内的粒子错开起跑，先后飞进手心里的一颗霓虹爱心。
        float grabW = 0.0;
        vHeartG = 0.0;
        if (uGrabK > 0.001 && uMorph < 0.02) {
          vec3 q = p - uGrab;
          float gd = length(q);
          float d01 = clamp(gd / uGrabR, 0.0, 1.0);
          float falloff = 1.0 - smoothstep(0.55, 1.0, d01);
          float start = clamp((uGrabT - d01 * 0.45) / 0.30, 0.0, 1.0);
          start = start * start * (3.0 - 2.0 * start);
          float k = start * uGrabK * falloff;
          if (k > 0.0005) {
            vec3 axis = normalize(uGrabAxis);
            vec3 right = normalize(uGrabRight);
            vec3 upv = normalize(uGrabUp);
            // 每颗粒子固定一个参数角，随时间沿心形轮廓流动
            float hh = fract(sin(aSeed * 91.37) * 43758.5453);
            float th = aSeed * 6.28318 + uTime * 0.55;
            float hx = 16.0 * pow(sin(th), 3.0) / 17.0;
            float hy = (13.0 * cos(th) - 5.0 * cos(2.0 * th) - 2.0 * cos(3.0 * th) - cos(4.0 * th)) / 17.0 + 0.18;
            // 74% 的粒子贴在外轮廓，其余散在内部，像霓虹灯管 + 薄雾
            float rr = hh < 0.74 ? (0.90 + hh / 0.74 * 0.10) : (0.12 + (hh - 0.74) / 0.26 * 0.62);
            float pulse = 1.0 + 0.045 * sin(uTime * 2.4);
            vec3 heartW = uGrab
              + (right * hx + upv * hy) * 2.3 * rr * pulse
              + axis * ((hh - 0.5) * 0.45);
            // 飞行途中绕视线轻轻转一下，落进心形时有收束感
            vec3 swing = rotAxis(p - uGrab, axis, k * 0.5);
            p = uGrab + mix(swing, heartW - uGrab, k);
            grabW = k;
            vHeartG = clamp(hy * 2.3 * rr / 2.4 + 0.5, 0.0, 1.0);
          }
        }

        // 人像：aTarget 是照片平面上的点，z 是从明暗和轮廓估出来的厚度。
        // aEdge < 0 的点是头部周围的悬浮尘埃；其余是脸、头发和衣服上的网点。
        float dust = step(aEdge, -0.5);
        float edgeAmt = clamp(max(aEdge, 0.0), 0.0, 1.0);
        vec3 local = aTarget;
        // 绕 Y / X 只转几度，靠鼻子、眼窝、发际线的深度差产生体积感。
        float cy = cos(uHeadTurn), sy = sin(uHeadTurn);
        local.xz = mat2(cy, -sy, sy, cy) * local.xz;
        float cx = cos(uHeadTilt), sx = sin(uHeadTilt);
        local.yz = mat2(cx, -sx, sx, cx) * local.yz;
        vec3 targetW = uPCenter + uPRight * local.x + uPUp * local.y + uPNormal * local.z;
        // 结构点几乎不动，暗部和尘埃才允许呼吸，脸不会一直发虚。
        float driftAmt = uDrift * (0.08 + 0.28 * (1.0 - edgeAmt) + 1.8 * dust);
        targetW += vec3(
          sin(uTime * 0.70 + aSeed * 41.0),
          cos(uTime * 0.55 + aSeed * 29.0),
          sin(uTime * 0.85 + aSeed * 17.0)
        ) * driftAmt;
        // 从上往下扫过一遍，再按粒子自己的节奏落位。
        float scan = clamp(0.5 - local.y / max(uPortraitH, 0.001), 0.0, 1.0);
        float mp = clamp(uMorph * 1.42 - aSeed * 0.16 - scan * 0.10, 0.0, 1.0);
        mp = mp * mp * (3.0 - 2.0 * mp);
        mp = 1.0 - pow(1.0 - mp, 3.0);
        p = mix(p, targetW, mp);

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float d = -mv.z;
        vShade = clamp(1.0 - (d - 20.0) / 150.0, 0.22, 1.0) * (1.0 + grabW * 0.35);
        vTint = aTint;
        vWarm = grabW;
        vPhoto = mp;
        vEdge = edgeAmt * mp;
        vSeed = aSeed;
        vColor = aColor;
        vDust = dust * mp;
        vDepth = local.z;
        vAlpha = aAlpha;
        float sz = clamp(150.0 / d, 1.2, 9.0) * (0.7 + aSeed * 0.6) * (1.0 - 0.30 * grabW);
        gl_PointSize = mix(sz, aSize, mp);
        gl_PointSize *= 1.0 + sin(3.14159 * mp) * 0.22;   // 飞行途中只轻微放大，落位时不炸成光团
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform float uOpacity; uniform vec3 cA; uniform vec3 cB; uniform vec3 cC;
      uniform float uPhotoGain; uniform float uTime; uniform float uTwinkle; uniform float uGrabK;
      varying float vShade; varying float vTint; varying float vWarm; varying float vPhoto; varying float vEdge;
      varying vec3 vColor; varying float vSeed; varying float vHeartG; varying float vDust; varying float vDepth; varying float vAlpha;
      void main(){
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        // 星云要软光点；人像要更实的小点，细密的网点才立得住。
        float a = mix(smoothstep(0.5, 0.05, r), smoothstep(0.5, 0.38, r), vPhoto);
        vec3 col = mix(mix(cA, cB, vTint), cC, smoothstep(0.75, 1.0, vTint));
        // 抓取 = 霓虹爱心：底部玫瑰、顶部蓝青，双色渐变
        vec3 heartCol = mix(vec3(1.0, 0.28, 0.50), vec3(0.25, 0.72, 1.0), vHeartG);
        col = mix(col, heartCol, vWarm * 0.95);
        col = mix(col, vColor, vPhoto);
        // 轮廓、眉眼和唇线用冷白青提亮，暗部保留深蓝体积。
        col = mix(col, vec3(0.56, 0.92, 1.0), vEdge * 0.38);
        col = mix(col, vec3(0.03, 0.16, 0.42), vDust);
        float depthShade = clamp(1.0 + vDepth * 0.10, 0.82, 1.18);
        col *= depthShade;
        // 半路只闪一层蓝光，持续时间短，不会把整张脸洗白。
        float transit = sin(3.14159 * vPhoto);
        col = mix(col, vec3(0.10, 0.46, 1.0), transit * 0.24);
        float alpha = a * vShade * uOpacity * mix(1.0, 0.50, vWarm);
        alpha *= mix(1.0, vAlpha, vPhoto);
        alpha *= mix(1.0, 1.0 + vEdge * 0.55, vPhoto);
        alpha *= 1.0 + transit * 0.18;
        alpha *= mix(1.0, 0.52, vDust);
        // 抓取时把没被吸走的背景粒子压暗，爱心才能成为唯一焦点
        alpha *= mix(1.0, 0.28, uGrabK * (1.0 - vWarm));
        // 人像态每颗粒子自己呼吸，整张脸才会"活"起来
        float tw = 1.0 - uTwinkle + uTwinkle * sin(uTime * 2.6 + vSeed * 62.83);
        alpha *= mix(1.0, tw, vPhoto);
        gl_FragColor = vec4(col, alpha);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
}

/**
 * 把抠好的照片采样成 n 个粒子目标点。
 * 位置存的是"人像平面坐标"，真正的世界坐标在着色器里按相机朝向算，
 * 这样人像永远正面朝着你。
 */
async function loadPortrait(n, mode){
  // mode='json'：使用外部粒子坐标（原色）
  // mode='photo'：从 portrait.png 采样（蓝色调）
  if (mode === 'json') {
  const res = await fetch(PORTRAIT.url);
  if (!res.ok) throw new Error('人像 JSON 加载失败 ' + res.status);
  const pts = await res.json();
  if (!Array.isArray(pts) || !pts.length) throw new Error('人像 JSON 为空');

  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  for (const p of pts) {
    if (p.x < minx) minx = p.x;
    if (p.x > maxx) maxx = p.x;
    if (p.y < miny) miny = p.y;
    if (p.y > maxy) maxy = p.y;
  }
  const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
  const spanX = Math.max(1e-6, maxx - minx), spanY = Math.max(1e-6, maxy - miny);
  const jplaneH = PORTRAIT.height;
  const jplaneW = jplaneH * (spanX / spanY);

  const jtarget = new Float32Array(n * 3);
  const jcolor = new Float32Array(n * 3);
  const jedgeAttr = new Float32Array(n);
  const sizeAttr = new Float32Array(n);
  const alphaAttr = new Float32Array(n);

  // JSON 的 r 是原图像素半径，按屏幕高度等比换算成屏幕像素。
  const visH = 2 * PORTRAIT.ahead * Math.tan(31 * Math.PI / 180);
  const screenH = (jplaneH / visH) * (window.innerHeight || 800);
  const rScale = (screenH / spanY) * 2.0 * (renderer ? renderer.getPixelRatio() : 1);

  for (let i = 0; i < n; i++) {
    const p = pts[i % pts.length];
    const c = p.c || [255, 255, 255];
    const lum = (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) / 255;
    jtarget[i*3]   = (p.x - cx) / spanX * jplaneW;
    jtarget[i*3+1] = -(p.y - cy) / spanY * jplaneH;
    jtarget[i*3+2] = (lum - 0.5) * 0.5;      // 明暗给一点点厚度
    jcolor[i*3]   = Math.pow(c[0] / 255, 2.2);
    jcolor[i*3+1] = Math.pow(c[1] / 255, 2.2);
    jcolor[i*3+2] = Math.pow(c[2] / 255, 2.2);
    sizeAttr[i]  = (p.r || 2) * rScale;
    alphaAttr[i] = p.a != null ? p.a : 1;
    jedgeAttr[i]  = 0;
  }
  return { target: jtarget, color: jcolor, edge: jedgeAttr, size: sizeAttr, alpha: alphaAttr, planeW: jplaneW, planeH: jplaneH, meshPositions: [] };
  }

  // ===== portrait.png 采样（蓝色调，比 2 用）=====
  const img = new Image();
  img.src = PORTRAIT.photoUrl;
  await img.decode();

  // 采样密一点，眼睛、唇缝和发丝才不会在放大后变成一团。
  const W = 680;
  const H = Math.round(W * img.naturalHeight / img.naturalWidth);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingEnabled = true;
  x.imageSmoothingQuality = 'high';
  x.drawImage(img, 0, 0, W, H);
  const px = x.getImageData(0, 0, W, H).data;
  const N = W * H;

  // 亮度只描述明暗，不再直接等于颜色强度。
  // 抠图边缘先清掉低 alpha 的白边，否则放大后会浮出一圈白雾。
  const alpha = new Uint8Array(N);
  const alphaF = new Float32Array(N);
  const lum = new Float32Array(N);
  const skin = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const p = i * 4;
    const a = px[p + 3] < 24 ? 0 : px[p + 3];
    alpha[i] = a;
    alphaF[i] = a / 255;
    const r = px[p], g = px[p+1], b = px[p+2];
    const l = a ? (0.299*r + 0.587*g + 0.114*b) / 255 : 0;
    lum[i] = l;
    // 皮肤偏暖（R 明显高于 B），头发和衣服更灰/更暗。
    const warm = clamp((r - b) / 85, 0, 1);
    skin[i] = clamp((warm - 0.16) / 0.55, 0, 1)
            * clamp((l - 0.24) / 0.28, 0, 1);
  }

  /** 可分离盒式模糊，用来做低频明暗和轮廓距离。 */
  const boxBlur = (src, radius, passes) => {
    const a = Float32Array.from(src);
    const b = new Float32Array(N);
    const r = Math.max(1, radius | 0), win = r * 2 + 1;
    const at = (xx, yy) => a[clamp(yy, 0, H-1) * W + clamp(xx, 0, W-1)];
    for (let pass = 0; pass < passes; pass++) {
      for (let y = 0; y < H; y++) {
        const row = y * W;
        let sum = 0;
        for (let xx = -r; xx <= r; xx++) sum += at(xx, y);
        for (let xx = 0; xx < W; xx++) {
          b[row + xx] = sum / win;
          sum += at(xx + r + 1, y) - at(xx - r, y);
        }
      }
      for (let xx = 0; xx < W; xx++) {
        let sum = 0;
        for (let yy = -r; yy <= r; yy++) sum += b[clamp(yy, 0, H-1) * W + xx];
        for (let yy = 0; yy < H; yy++) {
          a[yy * W + xx] = sum / win;
          sum += b[clamp(yy + r + 1, 0, H-1) * W + xx]
               - b[clamp(yy - r, 0, H-1) * W + xx];
        }
      }
    }
    return a;
  };

  const base = boxBlur(lum, 5, 2);
  const skinCtx = boxBlur(skin, 8, 2);

  // 高频细节：眼睛、眉毛、鼻翼、唇缝和发丝都在这里。
  const feature = new Float32Array(N);
  let featureMax = 0, featureSum = 0, featureCount = 0;
  for (let yy = 1; yy < H-1; yy++) {
    for (let xx = 1; xx < W-1; xx++) {
      const i = yy*W + xx;
      if (alpha[i] < 24) continue;
      const gx = Math.abs(lum[i+1] - lum[i-1]) * 0.5;
      const gy = Math.abs(lum[i+W] - lum[i-W]) * 0.5;
      const hp = Math.abs(lum[i] - base[i]);
      feature[i] = clamp(gx * 4.4 + gy * 4.4 + hp * 5.2, 0, 1);
      featureMax = Math.max(featureMax, feature[i]);
      featureSum += feature[i];
      featureCount++;
    }
  }

  // 从透明边界向内做距离变换，得到发丝/肩膀的外轮廓带。
  const dist = new Int32Array(N).fill(9999);
  const queue = new Int32Array(N);
  let qh = 0, qt = 0;
  for (let yy = 0; yy < H; yy++) {
    for (let xx = 0; xx < W; xx++) {
      const i = yy*W + xx;
      if (alpha[i] < 24) continue;
      // 图片底边不是人像轮廓，不要在那儿点一条亮线。
      const edgePx = (xx > 0 && alpha[i-1] < 24)
        || (xx < W-1 && alpha[i+1] < 24)
        || (yy > 0 && alpha[i-W] < 24)
        || (yy < H-1 && alpha[i+W] < 24);
      if (edgePx) { dist[i] = 0; queue[qt++] = i; }
    }
  }
  while (qh < qt) {
    const i = queue[qh++];
    const d = dist[i] + 1;
    const xx = i % W, yy = (i / W) | 0;
    if (xx > 0 && alpha[i-1] > 24 && dist[i-1] > d) { dist[i-1] = d; queue[qt++] = i-1; }
    if (xx < W-1 && alpha[i+1] > 24 && dist[i+1] > d) { dist[i+1] = d; queue[qt++] = i+1; }
    if (yy > 0 && alpha[i-W] > 24 && dist[i-W] > d) { dist[i-W] = d; queue[qt++] = i-W; }
    if (yy < H-1 && alpha[i+W] > 24 && dist[i+W] > d) { dist[i+W] = d; queue[qt++] = i+W; }
  }
  const rim = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    if (dist[i] < 9999) rim[i] = clamp(1 - dist[i] / 7, 0, 1);
  }

  // 伪深度：低频明暗给出鼻梁/眼窝，距离场把头部做成一个鼓起的体块。
  const depth = new Float32Array(N);
  for (let yy = 0; yy < H; yy++) {
    const faceZone = 1 - clamp((yy / H - 0.70) / 0.14, 0, 1);
    for (let xx = 0; xx < W; xx++) {
      const i = yy*W + xx;
      if (alpha[i] < 24) continue;
      const dome = Math.min(1, dist[i] / 34) * 0.42 * faceZone;
      depth[i] = clamp((base[i] - 0.34) * 1.48, -0.52, 0.72)
               + dome - rim[i] * 0.20;
    }
  }

  // 用深度梯度算一个假法线，从左上方打光。鼻子、脸颊和眼窝就有了明暗。
  const reliefShade = new Float32Array(N).fill(1);
  for (let yy = 1; yy < H-1; yy++) {
    for (let xx = 1; xx < W-1; xx++) {
      const i = yy*W + xx;
      if (alpha[i] < 24) continue;
      const dx = (depth[i-1] - depth[i+1]) * 4.5;
      const dy = (depth[i-W] - depth[i+W]) * 4.5;
      const inv = 1 / Math.sqrt(dx*dx + dy*dy + 1);
      const lit = clamp(dx * inv * -0.58 + dy * inv * 0.54 + inv * 0.60, 0, 1);
      reliefShade[i] = 0.50 + 0.58 * lit;
    }
  }

  const cand = [];
  const cum = [];
  const EDGE_W = Number.isFinite(TUNE.edge) ? TUNE.edge : 1.0;
  let total = 0;
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    if (alpha[i] > 24) {
      cand.push(i);
      const yy = (i / W) | 0;
      const bottomFade = 1 - clamp((yy / H - 0.68) / 0.24, 0, 1) * 0.95;
      const detail = clamp((feature[i] - 0.14) / 0.52, 0, 1);
      // 被皮肤包围的暗部是眼窝、鼻孔和唇缝，要挖空，不能像头发一样铺满。
      const faceDark = skinCtx[i] * clamp((0.48 - lum[i]) / 0.30, 0, 1);
      const rimW = rim[i] * (0.06 + 0.94 * (1 - skinCtx[i]));
      // 遮罩内保底密度，头发和衣服不会因为暗而消失；
      // 细节和轮廓再叠上去，眼睛、眉毛、唇线才会变亮。
      total += (0.26
             + 0.30 * skin[i]
             + 0.20 * alphaF[i]
             + 0.26 * (1 - Math.min(1, lum[i] * 1.35))
             + detail * (0.90 + 6.8 * skinCtx[i]) * EDGE_W
             + rimW * 1.00
             + base[i] * 0.10) * bottomFade
             * (1 - faceDark * 0.52);
      cum.push(total);
    }
  }
  if (!cand.length) throw new Error('人像没有可用的像素');
  const pick = (r) => {
    let lo = 0, hi = cum.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < r) lo = mid + 1; else hi = mid; }
    return cand[lo];
  };

  const planeH = PORTRAIT.height;
  const planeW = planeH * W / H;
  const target = new Float32Array(n * 3);
  const color = new Float32Array(n * 3);
  const edgeAttr = new Float32Array(n);
  const sizeAttr = new Float32Array(n);
  const alphaAttr = new Float32Array(n);
  const baseSize = PORTRAIT_POINT_SIZE * (renderer ? renderer.getPixelRatio() : 1);
  const jx = planeW / W, jy = planeH / H;
  const dustCount = Math.floor(n * 0.024);

  // 细网格线：只铺到头/颈，不铺到肩膀底边。它让粒子表面更像图1的立体网罩。
  const meshPositions = [];
  const meshStep = 9;
  const meshRows = Math.max(2, Math.floor((H * 0.80) / meshStep));
  const meshCols = Math.max(2, Math.floor(W / meshStep));
  const grid = new Array(meshRows * meshCols).fill(null);
  for (let gy = 0; gy < meshRows; gy++) {
    for (let gx = 0; gx < meshCols; gx++) {
      const xx = Math.min(W - 1, gx * meshStep);
      const yy = Math.min(H - 1, gy * meshStep);
      const i = yy * W + xx;
      if (alpha[i] < 80) continue;
      grid[gy * meshCols + gx] = {
        x: (xx / W - 0.5) * planeW,
        y: -(yy / H - 0.5) * planeH,
        z: depth[i] + 0.03
      };
    }
  }
  for (let gy = 0; gy < meshRows; gy++) {
    for (let gx = 0; gx < meshCols; gx++) {
      const a = grid[gy * meshCols + gx];
      if (!a) continue;
      const right = gx + 1 < meshCols ? grid[gy * meshCols + gx + 1] : null;
      const below = gy + 1 < meshRows ? grid[(gy + 1) * meshCols + gx] : null;
      if (right) meshPositions.push(a.x,a.y,a.z, right.x,right.y,right.z);
      if (below) meshPositions.push(a.x,a.y,a.z, below.x,below.y,below.z);
    }
  }

  for (let i = 0; i < n; i++) {
    if (i < dustCount) {
      // 头部周围保留一小撮悬浮尘埃，落位后仍有“数字空间”的空气感。
      let dx = 0, dy = 0, ok = false;
      for (let tries = 0; tries < 12; tries++) {
        dx = (Math.random() - 0.5) * planeW * 1.30;
        dy = (Math.random() - 0.5) * planeH * 1.12;
        const pxX = clamp(Math.floor((dx / planeW + 0.5) * W), 0, W - 1);
        const pxY = clamp(Math.floor((0.5 - dy / planeH) * H), 0, H - 1);
        if (alpha[pxY * W + pxX] <= 24) { ok = true; break; }
      }
      if (!ok) {
        dx = (Math.random() < 0.5 ? -1 : 1) * planeW * (0.48 + Math.random() * 0.18);
        dy = (Math.random() - 0.5) * planeH * 1.04;
      }
      target[i*3]   = dx;
      target[i*3+1] = dy;
      target[i*3+2] = (Math.random() - 0.5) * 3.0;
      const g = 0.35 + Math.random() * 0.55;
      color[i*3]   = 0.012 * g;
      color[i*3+1] = 0.09 * g;
      color[i*3+2] = 0.30 * g;
      edgeAttr[i] = -1 - Math.random() * 0.25;
      sizeAttr[i] = baseSize * 0.62;
      alphaAttr[i] = 1;
      continue;
    }

    const k = pick(Math.random() * total);
    const sx = k % W, sy = (k / W) | 0;
    target[i*3]   = (sx / W - 0.5) * planeW + (Math.random() - 0.5) * jx * 0.72;
    target[i*3+1] = -(sy / H - 0.5) * planeH + (Math.random() - 0.5) * jy * 0.72;
    target[i*3+2] = depth[k] + (Math.random() - 0.5) * 0.07;
    const detail = clamp((feature[k] - 0.14) / 0.52, 0, 1);
    const faceDark = skinCtx[k] * clamp((0.48 - lum[k]) / 0.30, 0, 1);
    const rimW = rim[k] * (0.06 + 0.94 * (1 - skinCtx[k]));
    const syK = (k / W) | 0;
    const bodyDim = 1 - clamp((syK / H - 0.68) / 0.24, 0, 1) * 0.80;
    edgeAttr[i] = clamp(detail * (0.14 + 0.22 * skinCtx[k]) + rimW * 0.92, 0, 1) * bodyDim;

    // 三档受控蓝：暗部是海军蓝，脸是中蓝，轮廓和五官才用冷白青。
    // 保留原图的局部明暗，鼻梁、眼窝和唇形才不会被低频色块抹平。
    const form = base[k] * 0.60 + lum[k] * 0.40;
    const lv = clamp((form - 0.05) / 0.68, 0, 1);
    const tone = clamp((Math.pow(lv, 0.90) + skin[k] * 0.08) * (1 - faceDark * 0.36)
                     + clamp(depth[k] * 0.035, -0.025, 0.045), 0, 1);
    let cr = lerp(0.010, 0.070, tone);
    let cg = lerp(0.040, 0.420, tone);
    let cb = lerp(0.130, 0.880, tone);
    const shade = reliefShade[k];
    const hairDim = 0.42 + 0.58 * skinCtx[k];
    cr *= shade;
    cg *= shade;
    cb *= shade;
    cr *= hairDim * bodyDim;
    cg *= hairDim * bodyDim;
    cb *= hairDim * bodyDim;
    const ice = clamp(edgeAttr[i] * (0.58 + 0.16 * shade), 0, 0.68);
    cr = lerp(cr, 0.500, ice);
    cg = lerp(cg, 0.930, ice);
    cb = lerp(cb, 1.000, ice);
    color[i*3]   = cr;
    color[i*3+1] = cg;
    color[i*3+2] = cb;
    sizeAttr[i]  = baseSize * (0.72 + Math.random() * 0.28);
    alphaAttr[i] = 1;
  }

  // 背后那团光也按人像轮廓生成，而不是一个圆形光斑。
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = 280;
  glowCanvas.height = Math.round(glowCanvas.width * img.naturalHeight / img.naturalWidth);
  const gx = glowCanvas.getContext('2d');
  gx.filter = 'blur(17px)';
  gx.drawImage(img, 0, 0, glowCanvas.width, glowCanvas.height);
  gx.globalCompositeOperation = 'source-in';
  gx.fillStyle = '#1f6dff';
  gx.fillRect(0, 0, glowCanvas.width, glowCanvas.height);
  gx.globalCompositeOperation = 'source-over';
  gx.globalAlpha = 0.20;
  gx.filter = 'blur(8px)';
  gx.drawImage(img, 0, 0, glowCanvas.width, glowCanvas.height);
  gx.globalCompositeOperation = 'source-in';
  gx.fillStyle = '#6fdcff';
  gx.fillRect(0, 0, glowCanvas.width, glowCanvas.height);

  return {
    target, color, edge: edgeAttr, size: sizeAttr, alpha: alphaAttr, planeW, planeH, glowCanvas, meshPositions,
    stats: {
      featureMax: +featureMax.toFixed(3),
      featureMean: +(featureSum / Math.max(1, featureCount)).toFixed(3),
      pixels: featureCount
    }
  };
}

function buildField(portrait){
  const n = CFG.particles;
  const pos = new Float32Array(n*3), seed = new Float32Array(n), tint = new Float32Array(n);
  for (let i=0;i<n;i++){
    const u = Math.random()*2-1, th = Math.random()*Math.PI*2;
    const rr = Math.sqrt(Math.max(0,1-u*u));
    const R = CFG.shellInner + Math.pow(Math.random(),0.65)*(CFG.shellOuter-CFG.shellInner);
    pos[i*3]   = rr*Math.cos(th)*R;
    pos[i*3+1] = u*R*0.55;          // 压扁成片状，穿行时更像星云
    pos[i*3+2] = rr*Math.sin(th)*R;
    seed[i] = Math.random();
    tint[i] = Math.random();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
  g.setAttribute('aTint', new THREE.BufferAttribute(tint,1));
  if (portrait) {
    g.setAttribute('aTarget', new THREE.BufferAttribute(portrait.target, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(portrait.color, 3));
    g.setAttribute('aEdge', new THREE.BufferAttribute(portrait.edge, 1));
    g.setAttribute('aSize', new THREE.BufferAttribute(portrait.size, 1));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(portrait.alpha, 1));
  }
  return g;
}

/** 把人像切换成第 idx 套（0=JSON原色，1=照片蓝色调）。 */
function swapPortrait(idx){
  const d = portraitSets[idx];
  if (!d || !field) return;
  const attrs = field.geometry.attributes;
  attrs.aTarget.array.set(d.target);  attrs.aTarget.needsUpdate = true;
  attrs.aColor.array.set(d.color);    attrs.aColor.needsUpdate = true;
  attrs.aEdge.array.set(d.edge);      attrs.aEdge.needsUpdate = true;
  attrs.aSize.array.set(d.size);      attrs.aSize.needsUpdate = true;
  attrs.aAlpha.array.set(d.alpha);    attrs.aAlpha.needsUpdate = true;
  currentPortrait = idx;
  if (aura) aura.scale.set(d.planeW * 1.35, d.planeH * 1.20, 1);
}

/** 手心里那团光的贴图：中心亮核 + 一圈很淡的外环。 */
function glowTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.14, 'rgba(226,246,255,0.80)');
  g.addColorStop(0.34, 'rgba(120,196,255,0.28)');
  g.addColorStop(0.62, 'rgba(74,140,255,0.10)');
  g.addColorStop(1.00, 'rgba(60,110,255,0)');
  x.fillStyle = g;
  x.fillRect(0,0,256,256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function buildGlow(){
  const mat = new THREE.SpriteMaterial({
    map: glowTexture(),
    color: 0xbfe4ff,
    transparent: true,
    opacity: 0,
    depthTest: false,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const s = new THREE.Sprite(mat);
  s.scale.setScalar(4.2);
  s.renderOrder = 5;
  s.frustumCulled = false;
  return s;
}

async function buildScene(onStage){
  THREE = await loadThree(onStage);

  renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CFG.dprLimit));
  renderer.setClearColor(0x030916, 1);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(62, 1, 0.5, 4000);

  onStage('正在采样人像…');
  let portrait = null;
  try { portraitSets[0] = await loadPortrait(CFG.particles, 'json'); }
  catch(e){ console.warn('人像1(JSON)加载失败', e); }
  try { portraitSets[1] = await loadPortrait(CFG.particles, 'photo'); }
  catch(e){ console.warn('人像2(照片)加载失败', e); }
  portrait = portraitSets[0] || portraitSets[1] || null;
  currentPortrait = portraitSets[0] ? 0 : 1;
  portraitInfo = portrait;
  window.__portraitStats = portrait ? portrait.stats : null;

  field = new THREE.Points(buildField(portrait), fieldMaterial());
  scene.add(field);

  glow = buildGlow();
  scene.add(glow);

  // 人像背后的蓝色光晕
  aura = new THREE.Sprite(new THREE.SpriteMaterial({
    map: portrait && portrait.glowCanvas
      ? (() => { const t = new THREE.CanvasTexture(portrait.glowCanvas); t.colorSpace = THREE.SRGBColorSpace; return t; })()
      : glowTexture(),
    color: 0xffffff, transparent: true, opacity: 0,
    depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  aura.scale.set(portrait ? portrait.planeW * 1.35 : 11, portrait ? portrait.planeH * 1.20 : 11, 1);
  aura.renderOrder = -1;
  aura.frustumCulled = false;
  scene.add(aura);

  if (portrait && portrait.meshPositions && portrait.meshPositions.length) {
    const meshGeo = new THREE.BufferGeometry();
    meshGeo.setAttribute('position', new THREE.Float32BufferAttribute(portrait.meshPositions, 3));
    const meshMat = new THREE.LineBasicMaterial({
      color: 0x54c8ff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false
    });
    portraitMesh = new THREE.LineSegments(meshGeo, meshMat);
    portraitMesh.frustumCulled = false;
    portraitMesh.renderOrder = 1;
    portraitMesh.visible = false;
    scene.add(portraitMesh);
  }

  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=> setTimeout(resize, 250));
  window.__ready = true;
}

function resize(){
  if (!renderer) return;
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  renderer.setSize(w, h, false);      // canvas 由 CSS 铺满，这里只改绘制缓冲
  if (field) {
    field.material.uniforms.uSize.value =
      (Number.isFinite(TUNE.size) ? TUNE.size : PORTRAIT_POINT_SIZE) * renderer.getPixelRatio();
  }
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function applyCamera(dt, elapsed){
  if (!renderer) return;
  const r = CFG.orbitBase + view.dist * CFG.orbitGain;
  const yaw = view.yaw * Math.PI/180;
  const pitch = clamp(view.pitch, -CFG.pitchLimit, CFG.pitchLimit) * Math.PI/180;
  camera.position.set(
    r*Math.cos(pitch)*Math.sin(yaw),
    r*Math.sin(pitch),
    r*Math.cos(pitch)*Math.cos(yaw)
  );
  const dir = new THREE.Vector3(0,0,0).sub(camera.position).normalize();
  const up = new THREE.Vector3(0,1,0).applyAxisAngle(dir, view.roll*Math.PI/180);
  camera.up.copy(up);
  camera.lookAt(0,0,0);
  camera.updateMatrixWorld();

  // 抓取：捏下时计时器开始跑，粒子按"由近到远"的顺序被吸进手心；
  // 松开后强度回落，计时器等回弹结束再归零。
  grabMix = smoothTo(grabMix, grabTarget, grabTarget > 0 ? 16 : 8, dt);
  if (grabTarget > 0) grabT = Math.min(grabT + dt, 3.0);
  else if (grabMix < 0.02) grabT = 0;
  if (DEBUG_GRAB_HOLD) { grabMix = 1; grabT = 3; }

  const fu = field.material.uniforms;
  fu.uGrabAxis.value.copy(dir);
  const grRight = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const grUp = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  fu.uGrabRight.value.copy(grRight);
  fu.uGrabUp.value.copy(grUp);
  // 爱心跟手：把捏合点从图像坐标换算成相机前方的一个偏移
  const ndcX = (pinchPoint.x - 0.5) * 2;
  const ndcY = (0.5 - pinchPoint.y) * 2;
  const halfH = CFG.grabAhead * Math.tan(31 * Math.PI / 180);
  const halfW = halfH * camera.aspect;
  const grabPoint = camera.position.clone()
    .addScaledVector(dir, CFG.grabAhead)
    .addScaledVector(grRight, ndcX * halfW)
    .addScaledVector(grUp, ndcY * halfH);
  fu.uGrab.value.copy(grabPoint);
  fu.uGrabK.value = grabMix;
  fu.uGrabT.value = grabT;
  fu.uGrabR.value = CFG.grabRadius;
  fu.uTime.value = elapsed;

  if (glow) {
    glow.position.copy(grabPoint);
    glow.scale.setScalar(3.0 + 1.6 * grabMix);
    glow.material.opacity = grabMix * 0.25;
    glow.material.color.setRGB(1.0, 0.30 + 0.18 * grabMix, 0.46 + 0.20 * grabMix);
  }

  // 人像：粒子按自己的节奏飞过去，最后全靠粒子自己堆出五官
  portraitMix = smoothTo(portraitMix, portraitTarget, portraitTarget > 0 ? 3.4 : 3.2, dt);
  if (DEBUG_PORTRAIT) portraitMix = 1;
  if (!Number.isNaN(DEBUG_MORPH)) portraitMix = DEBUG_MORPH;
  fu.uMorph.value = portraitMix;
  // 先散开再聚：散到底后切数据，再重新聚拢
  if (switchQueue != null && portraitMix < 0.04) {
    swapPortrait(switchQueue);
    portraitOn = true;
    portraitTarget = 1;
    switchQueue = null;
  }
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const upv = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  const fwd = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 2).negate();
  fu.uPCenter.value.copy(camera.position).addScaledVector(fwd, PORTRAIT.ahead);
  fu.uPRight.value.copy(right);
  fu.uPUp.value.copy(upv);
  fu.uPNormal.value.copy(fwd).negate();
  // 保真优先：不再额外转头，只留一丝呼吸感，脸型按原照片来。
  fu.uHeadTurn.value = Math.sin(elapsed * 0.32) * 0.006;
  fu.uHeadTilt.value = Math.cos(elapsed * 0.27) * 0.004;
  if (portraitMesh) {
    portraitMesh.position.copy(fu.uPCenter.value);
    portraitMesh.quaternion.copy(camera.quaternion);
    portraitMesh.rotateY(fu.uHeadTurn.value);
    portraitMesh.rotateX(fu.uHeadTilt.value);
    portraitMesh.visible = portraitMix > 0.015;
    portraitMesh.material.opacity = Math.pow(clamp(portraitMix, 0, 1), 2) * 0.06;
  }
  if (aura) {
    aura.position.copy(camera.position).addScaledVector(fwd, PORTRAIT.ahead + 0.55);
    if (portraitInfo) aura.scale.set(portraitInfo.planeW * 1.35, portraitInfo.planeH * 1.20, 1);
    aura.material.opacity = portraitMix * 0.18;
  }
  renderer.render(scene, camera);
}

/* ---------------------------- 手势状态机 ------------------------------ */

const ui = {
  label: document.getElementById('label'),
  dot: document.getElementById('dot')
};
const setLabel = (text, color='#4a9dff')=>{
  ui.label.textContent = text;
  ui.dot.style.background = color;
  ui.dot.style.animation = color === '#4a9dff' ? 'blink 1.1s infinite' : 'none';
};

let lostCount = 0;
let twoHandFrames = 0, singleFrames = 0, twoHand = false;
let oneSince = 0, twoSince = 0, lostAt = 0;
let portraitCooldownUntil = 0;
let portraitOn = false;
let moveBuf = [];
const filterPalmX = { v: null }, filterPalmY = { v: null };

function oneEuro(state, x, dt){
  if (state.v === null) { state.v = x; return x; }
  const a = 1 - Math.exp(-CFG.smoothMin * dt);
  state.v = a*x + (1-a)*state.v;
  return state.v;
}

/** 每帧喂一次手部结果，返回本帧的控制意图。 */
function stepHands(hands, now, dt){
  const hasHand = hands.length > 0;

  if (!hasHand) {
    lostCount++;
    if (lostCount === CFG.lostFrames) { prevPalm = null; moveBuf = []; }
    grabTarget = DEBUG_GRAB ? 1 : 0;
    grabHeld = false;
    pinchPoint.x = 0.5; pinchPoint.y = 0.5;
    if (portraitOn) {
      if (!lostAt) lostAt = now;
      if (now - lostAt >= CFG.portraitLostMs) {
        portraitOn = false;
        portraitTarget = 0;
        portraitCooldownUntil = now + 900;
      }
      setLabel(portraitOn ? '人像 · 手回到画面' : '未检测到手', portraitOn ? '#c9b3ff' : '#4a9dff');
    } else {
      setLabel('未检测到手', '#4a9dff');
    }
    return;
  }
  lostCount = 0;
  lostAt = 0;

  const main = hands[0];
  const p = palm(main);
  const f = fingers(main);
  pinchPoint.x = oneEuro(filterPinchX, (main[4].x + main[8].x) / 2, dt);
  pinchPoint.y = oneEuro(filterPinchY, (main[4].y + main[8].y) / 2, dt);

  // 手数变化时重建基准：(1) 手序可能翻转 (2) 换手后位移会突然很大
  if (hands.length !== stepHands.lastCount) {
    stepHands.lastCount = hands.length;
    prevPalm = null;
    moveBuf = [];
  }
  if (!prevPalm) { prevPalm = p; setLabel('开始跟踪', '#37e08a'); return; }

  const dxPx = (p.x - prevPalm.x) * stage.clientWidth;
  const dyPx = (p.y - prevPalm.y) * stage.clientHeight;
  moveBuf.push(dxPx, dyPx);
  while (moveBuf.length > CFG.stillWindow*2) { moveBuf.shift(); moveBuf.shift(); }

  // 双手：距离控制推进/后退
  if (hands.length >= 2) {
    twoHandFrames++; singleFrames = 0;
    if (twoHandFrames >= CFG.twoHandConfirm) twoHand = true;
  } else {
    singleFrames++; twoHandFrames = 0;
    if (twoHand && singleFrames >= CFG.twoHandExit) twoHand = false;
  }

  if (twoHand && hands.length >= 2) {
    const a = palm(hands[0]), b = palm(hands[1]);
    const gap = Math.hypot((a.x-b.x)*stage.clientWidth, (a.y-b.y)*stage.clientHeight);
    if (stepHands.gapBase == null) stepHands.gapBase = gap;
    // 两手分开 = 后退，合拢 = 前进
    view.dist = clamp(view.dist * (stepHands.gapBase / Math.max(gap, 1)), CFG.distMin, CFG.distMax);
    if (stepHands.gapBase) stepHands.gapBase = lerp(stepHands.gapBase, gap, 0.05);
    grabTarget = 0;
    setLabel('双手推进', '#7a9dff');
    prevPalm = p;
    return;
  }
  stepHands.gapBase = null;

  // 静止判定：用短窗口的平均位移，抖动方向来回摆、均值接近零
  let sx = 0, sy = 0;
  for (let i=0;i<moveBuf.length;i+=2){ sx += moveBuf[i]; sy += moveBuf[i+1]; }
  const n = moveBuf.length/2 || 1;
  const still = Math.hypot(sx/n, sy/n) <= CFG.stillPx;

  // 比 1 = JSON 原色人像；比 2 = 照片蓝色调人像。
  // 都是"伸直对应手指 + 拇指内收 + 停住一会儿"。
  const isOne = f.index && !f.middle && !f.ring && !f.pinky && f.thumbIn;
  const isTwo = f.index && f.middle && !f.ring && !f.pinky && f.thumbIn;
  if (!portraitOn && switchQueue == null) {
    if (isOne && still) { if (!oneSince) oneSince = now; } else oneSince = 0;
    if (isTwo && still) { if (!twoSince) twoSince = now; } else twoSince = 0;
    if (oneSince && now - oneSince >= CFG.portraitHoldMs && now >= portraitCooldownUntil) {
      swapPortrait(0);
      portraitOn = true;
      portraitTarget = 1;
      oneSince = 0; twoSince = 0;
    } else if (twoSince && now - twoSince >= CFG.portraitHoldMs && now >= portraitCooldownUntil) {
      swapPortrait(1);
      portraitOn = true;
      portraitTarget = 1;
      oneSince = 0; twoSince = 0;
    }
  } else {
    oneSince = 0; twoSince = 0;
    // 已有人像时比另一个数字：先散开，再聚成对应的人像
    if (portraitOn && switchQueue == null && still) {
      if (isTwo && currentPortrait !== 1) { switchQueue = 1; portraitOn = false; portraitTarget = 0; }
      else if (isOne && currentPortrait !== 0) { switchQueue = 0; portraitOn = false; portraitTarget = 0; }
    }
  }

  // 手掌平移 = 朝向。用增量累加，手停住就停。
  const gx = oneEuro(filterPalmX, p.x, dt);
  const gy = oneEuro(filterPalmY, p.y, dt);
  const gain = f.scale || 1;
  const turn = portraitOn ? 0.3 : 1;   // 人像出来时手还在动，减一点转速，人像才稳
  if (Math.hypot(dxPx, dyPx) > CFG.deadzonePx) {
    view.yaw -= (dxPx / (gain*stage.clientWidth)) * CFG.yawGain * turn;
    view.pitch = clamp(view.pitch + (dyPx / (gain*stage.clientWidth)) * CFG.pitchGain * turn,
                       -CFG.pitchLimit, CFG.pitchLimit);
    yawVel = (dxPx / (gain*stage.clientWidth)) * CFG.yawGain / Math.max(dt, 1/120);
    pitchVel = (dyPx / (gain*stage.clientWidth)) * CFG.pitchGain / Math.max(dt, 1/120);
  }

  // 捏合 = 抓取。指距比越小捏得越紧。
  const pinch = clamp((CFG.pinchOpen - f.pinch) / (CFG.pinchOpen - CFG.pinchShut), 0, 1);
  if (!grabHeld && pinch > 0.62) grabHeld = true;
  else if (grabHeld && pinch < 0.36) grabHeld = false;
  grabTarget = portraitOn ? 0 : (grabHeld ? 1 : 0);
  if (DEBUG_GRAB) grabTarget = 1;      // 调试用：?grab=1 强制抓取，方便无手时看效果

  if (portraitOn) setLabel(currentPortrait === 1 ? '人像2 · 放下手散开' : '人像1 · 放下手散开', '#c9b3ff');
  else if (switchQueue != null) setLabel('切换中…', '#c9b3ff');
  else if (twoSince) setLabel('保持比 2…', '#7a9dff');
  else if (oneSince) setLabel('保持比 1…', '#c9b3ff');
  else if (grabTarget > 0.5) setLabel('抓取中', '#ffd166');
  else setLabel('穿行中', '#37e08a');
  prevPalm = p;
}
stepHands.lastCount = -1;
stepHands.gapBase = null;

/* ------------------------- 摄像头与识别 ------------------------------- */

const camCanvas = document.getElementById('cam');
const camCtx = camCanvas.getContext('2d');
const video = document.createElement('video');
video.playsInline = true; video.muted = true; video.autoplay = true;

let landmarker = null, running = false;
let lastDetect = 0, lastTime = -1;

function drawCamera(hands){
  const w = camCanvas.width, h = camCanvas.height;
  camCtx.setTransform(1,0,0,1,0,0);
  camCtx.clearRect(0,0,w,h);
  camCtx.save();
  camCtx.translate(w,0); camCtx.scale(-1,1);
  try { camCtx.drawImage(video,0,0,w,h); } catch(_){}
  camCtx.restore();
  if (!hands || !hands.length) return;
  for (const lm of hands) {
    const P = i => ({ x: (1-lm[i].x)*w, y: lm[i].y*h });
    camCtx.strokeStyle = 'rgba(74,157,255,.85)'; camCtx.lineWidth = 2;
    camCtx.beginPath();
    for (const [a,b] of HAND_EDGES){ const pa=P(a), pb=P(b); camCtx.moveTo(pa.x,pa.y); camCtx.lineTo(pb.x,pb.y); }
    camCtx.stroke();
    for (let i=0;i<lm.length;i++){
      const q = P(i);
      camCtx.beginPath();
      camCtx.arc(q.x, q.y, [4,8,12,16,20].includes(i)?3.6:2.2, 0, Math.PI*2);
      camCtx.fillStyle = [4,8,12,16,20].includes(i) ? '#ffd166' : '#eaf2ff';
      camCtx.fill();
    }
  }
}

function loop(now){
  requestAnimationFrame(loop);
  const dt = loop.last ? Math.min(0.05, (now-loop.last)/1000) : 1/60;
  loop.last = now;

  if (running && landmarker && video.readyState >= 2 && video.videoWidth &&
      now - lastDetect >= 33 && video.currentTime !== lastTime) {
    lastDetect = now;
    lastTime = video.currentTime;
    let hands = [];
    try { hands = (landmarker.detectForVideo(video, now) || {}).landmarks || []; }
    catch(_) { hands = []; }
    stepHands(hands, now, dt);
    drawCamera(hands);
    if (!hands.length && !DEBUG_GRAB) { grabTarget = 0; }
  }

  applyCamera(dt, now/1000);
}

/* ---------------------------- 启动流程 -------------------------------- */

const boot = document.getElementById('boot');
const msgEl = document.getElementById('msg');
const fillEl = document.getElementById('fill');
const goBtn = document.getElementById('go');
const errEl = document.getElementById('err');

async function openCache(){
  try { return typeof caches === 'undefined' ? null : await caches.open(MODEL_CACHE); }
  catch(_) { return null; }
}

/** 多源竞速：同时下，5 秒后留传得多的那个。单源顺序会卡在不通的线路上。 */
async function fetchModel(onProgress){
  const cache = await openCache();
  if (cache) {
    const hit = await cache.match(MODEL_KEY).catch(()=>null);
    if (hit) { onProgress(1,1,1,true); return new Uint8Array(await hit.arrayBuffer()); }
  }
  const racers = MODEL_URLS.map(url => ({ url, ctrl: new AbortController(), chunks: [], got: 0, total: 0, done: false, ok: false }));
  const run = async r => {
    try {
      const res = await fetch(r.url, { signal: r.ctrl.signal });
      if (!res.ok) throw new Error('HTTP '+res.status);
      r.total = Number(res.headers.get('content-length')) || 0;
      const reader = res.body.getReader();
      for(;;){ const {done,value} = await reader.read(); if (done) break; r.chunks.push(value); r.got += value.length; }
      r.ok = true;
    } catch(e) { r.err = e; }
    r.done = true;
  };
  racers.forEach(run);
  const probeEnd = performance.now() + 5000, hardEnd = performance.now() + 20000;
  let win = null;
  while (performance.now() < hardEnd) {
    const done = racers.find(r => r.done && r.ok);
    if (done) { win = done; break; }
    if (performance.now() > probeEnd) {
      const best = [...racers].sort((a,b)=>b.got-a.got)[0];
      if (best && best.got > 65536) { win = best; break; }
    }
    await wait(150);
  }
  if (!win) throw new Error('模型源都没开始传输');
  racers.forEach(r => { if (r !== win) r.ctrl.abort(); });
  let last = performance.now(), lastBytes = win.got;
  while (!win.done) {
    await wait(200);
    if (win.got !== lastBytes) { lastBytes = win.got; last = performance.now(); }
    onProgress(win.total ? win.got/win.total : 0, win.got, win.total, false);
    if (performance.now() - last > 20000) { win.ctrl.abort(); throw new Error('下载停滞'); }
  }
  if (!win.ok) throw new Error('下载中断');
  const buf = new Uint8Array(win.got);
  let off = 0;
  for (const c of win.chunks) { buf.set(c, off); off += c.length; }
  if (cache) cache.put(MODEL_KEY, new Response(buf.slice(), { headers: { 'Content-Type':'application/octet-stream' } })).catch(()=>{});
  return buf;
}

async function createLandmarker(buf){
  let mod = null, wasm = '', err = null;
  for (const cdn of TM_URLS) {
    try { mod = await import(cdn.js); wasm = cdn.wasm; break; } catch(e){ err = e; }
  }
  if (!mod) throw err || new Error('MediaPipe 运行时加载失败');
  const fileset = await mod.FilesetResolver.forVisionTasks(wasm);
  const opt = {
    baseOptions: { modelAssetBuffer: buf, delegate: 'GPU' },
    runningMode: 'VIDEO', numHands: 2
  };
  try { return await mod.HandLandmarker.createFromOptions(fileset, opt); }
  catch(_) { opt.baseOptions.delegate = 'CPU'; return await mod.HandLandmarker.createFromOptions(fileset, opt); }
}

async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }
  });
  video.srcObject = stream;
  await video.play();
  await new Promise(r => video.videoWidth ? r() : video.addEventListener('loadeddata', r, { once: true }));
}

async function boot0(){
  msgEl.textContent = '正在构建粒子场…';
  try { await buildScene(t => { msgEl.textContent = t; }); }
  catch(e){ msgEl.textContent = '3D 初始化失败'; errEl.textContent = String(e.message||e); return; }

  msgEl.textContent = '正在准备手部识别…';
  let lastPaint = 0;
  try {
    const buf = await fetchModel((frac, got, total, cached) => {
      const now = performance.now();
      if (now - lastPaint < 120 && frac < 1) return;
      lastPaint = now;
      fillEl.style.width = (cached ? 100 : Math.round(frac*100)) + '%';
      msgEl.textContent = cached
        ? '识别模型已缓存，无需再下载。'
        : '正在下载手部模型（首次约 7.8MB）' + (total ? ' — ' + Math.round(frac*100) + '%  ' + (got/1048576).toFixed(1) + '/' + (total/1048576).toFixed(1) + ' MB' : '');
    });
    fillEl.style.width = '100%';
    landmarker = await createLandmarker(buf);
    msgEl.textContent = '就绪。点击开始，浏览器会请求摄像头权限。';
    goBtn.disabled = false;
    goBtn.textContent = '开始';
  } catch(e) {
    msgEl.textContent = '模型加载失败';
    errEl.textContent = String(e.message||e);
  }
  requestAnimationFrame(loop);
}

goBtn.addEventListener('click', async ()=>{
  goBtn.disabled = true;
  goBtn.textContent = '启动中…';
  try { await startCamera(); }
  catch(e){
    goBtn.disabled = false; goBtn.textContent = '重试';
    errEl.textContent = '拿不到摄像头：' + String(e.message||e) + '\n必须是 HTTPS 或 localhost。';
    return;
  }
  boot.classList.add('off');
  running = true;
  setLabel('未检测到手', '#4a9dff');
});

// 调试用：控制台里能读到当前抓取状态
window.__dbg = () => ({
  grabMix, grabT, grabTarget, dist: view.dist,
  portraitMix, portraitTarget, portraitOn,
  uGrabK: field ? field.material.uniforms.uGrabK.value : null,
  uGrabT: field ? field.material.uniforms.uGrabT.value : null,
  uMorph: field ? field.material.uniforms.uMorph.value : null,
  grabRadius: CFG.grabRadius,
  cam: camera ? camera.position.toArray().map(v => +v.toFixed(2)) : null
});
// 测试用：喂合成的关键点，不依赖摄像头
window.__test = {
  step: (hands, now, dt) => { stepHands(hands, now, dt); applyCamera(dt, now/1000); },
  state: () => ({ grabMix, grabT, grabTarget, portraitMix, portraitOn, currentPortrait, switchQueue, yaw: view.yaw, pitch: view.pitch, dist: view.dist }),
  reset: () => { prevPalm = null; moveBuf = []; stepHands.lastCount = -1; stepHands.gapBase = null; },
  setPortrait: (v) => { portraitOn = !!v; portraitTarget = v ? 1 : 0; },
  swap: swapPortrait
};

boot0();
</script>
