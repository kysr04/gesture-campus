<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<link rel="icon" href="data:,">
<title>手势地球</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #04060c; color: #dfe8ff; overflow: hidden;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; height: 100%; width: 100%; }

  /* ---------- 左侧：摄像头与状态 ---------- */
  #cam-panel {
    flex: 0 0 292px; width: 292px; height: 100%;
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px; background: #070b13;
    border-right: 1px solid #141e33;
    overflow: hidden;
  }
  #cam-title {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 12px; letter-spacing: .08em; color: #65779c;
  }
  #cam-title span:last-child { font-variant-numeric: tabular-nums; letter-spacing: 0; }
  #cam-canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 4 / 3;
    background: #000; border-radius: 10px; border: 1px solid #141e33;
  }
  #status-box { border-radius: 10px; padding: 10px 12px; background: #0b111d; border: 1px solid #1a2740; }
  #status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #66748f; margin-right: 8px; vertical-align: middle;
    transition: background .2s ease, box-shadow .2s ease;
  }
  #status-text { font-size: 15px; font-weight: 600; line-height: 1.3; }
  #status-sub { font-size: 12px; color: #74839f; margin-top: 5px; line-height: 1.4; }
  #status-box[data-state="active"] #status-dot { background: #37e08a; box-shadow: 0 0 10px #37e08a99; }
  #status-box[data-state="paused"] #status-dot { background: #ffb020; box-shadow: 0 0 10px #ffb02099; }
  #status-box[data-state="searching"] #status-dot { background: #4a9dff; box-shadow: 0 0 10px #4a9dff99; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  #pinch-wrap { font-size: 11px; color: #74839f; }
  #pinch-bar { height: 5px; border-radius: 3px; background: #141e33; margin-top: 6px; overflow: hidden; }
  #pinch-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4a9dff, #37e08a); transition: width .08s linear; }
  #help { font-size: 11.5px; color: #5a6885; line-height: 1.75; margin-top: auto; }
  #help b { color: #8496b8; font-weight: 600; }

  /* ---------- 右侧：地球 ---------- */
  #globe-panel { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; }
  #globe { position: absolute; inset: 0; }
  /* 双保险：即使将来 setSize 的行为又变了，canvas 也不会溢出容器 */
  #globe canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #tip {
    position: absolute; pointer-events: none; padding: 4px 9px; border-radius: 7px;
    background: rgba(8, 14, 26, .92); border: 1px solid rgba(255, 209, 102, .35);
    color: #ffe6ad; font-size: 13px; white-space: nowrap; opacity: 0;
    transform: translate(-50%, -140%); transition: opacity .12s ease;
  }
  #hud {
    position: absolute; top: 14px; left: 16px; pointer-events: none;
    font-size: 12px; color: #58688a; letter-spacing: .04em;
  }
  #hud strong { color: #9fb2d8; font-weight: 600; }

  /* ---------- 启动遮罩 ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center;
    background: radial-gradient(circle at 50% 40%, rgba(12,22,44,.88) 0%, rgba(4,6,12,.95) 68%);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  #boot.hidden { display: none; }
  #boot h1 { margin: 0; font-size: 21px; font-weight: 600; }
  #boot p { margin: 0; font-size: 13px; color: #74839f; max-width: 460px; line-height: 1.7; }
  #bar-outer { width: min(360px, 78vw); height: 6px; border-radius: 3px; background: #141e33; overflow: hidden; }
  #bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, #4a9dff, #37e08a); transition: width .25s ease; }
  #boot-btn {
    -webkit-appearance: none; appearance: none; border: 0; cursor: pointer;
    padding: 13px 42px; border-radius: 999px; font-size: 16px; font-weight: 600;
    color: #04121f; background: linear-gradient(135deg, #7fe0ff, #37e08a);
    font-family: inherit; transition: opacity .2s ease, transform .12s ease;
  }
  #boot-btn:active { transform: scale(.97); }
  #boot-btn[disabled] { opacity: .35; cursor: default; }
  #boot-err { font-size: 13px; color: #ff8080; max-width: 460px; line-height: 1.6; white-space: pre-wrap; }

  /* ---------- 竖屏：摄像头面板变画中画 ---------- */
  @media (orientation: portrait) and (max-width: 900px) {
    #app { display: block; }
    #globe-panel { position: absolute; inset: 0; }
    #cam-panel {
      position: absolute; z-index: 20; top: 12px; left: 12px;
      width: 168px; height: auto; flex: none; padding: 8px; gap: 7px;
      background: rgba(7, 11, 19, .82);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border: 1px solid #1a2740; border-radius: 12px;
    }
    #cam-title span:last-child, #status-sub, #pinch-wrap, #help { display: none; }
    #status-box { padding: 7px 9px; }
    #status-text { font-size: 12px; }
  }
</style>
</head>
<body>

<div id="app">
  <aside id="cam-panel">
    <div id="cam-title"><span>手势输入</span><span id="fps">--</span></div>
    <canvas id="cam-canvas" width="320" height="240"></canvas>
    <div id="status-box" data-state="searching">
      <div id="status-text"><span id="status-dot"></span><span id="status-label">检测中</span></div>
      <div id="status-sub">把手放进画面</div>
    </div>
    <div id="pinch-wrap">手掌张开度<div id="pinch-bar"><div id="pinch-fill"></div></div></div>
    <div id="help">
      <b>手掌平移</b> 在粒子海里穿行<br>
      <b>捏合手指</b> 抓起一团粒子<br>
      <b>张开手指</b> 放掉<br>
      <b>两只手</b> 前后推进 / 后退<br>
      <b>比 1/2/3/4</b> 跳到四个位置<br>
      <b>手离开画面</b> 滑行后停住
    </div>
  </aside>

  <main id="globe-panel">
    <div id="globe"></div>
    <div id="tip"></div>
<div id="hud">粒子手势 · <strong id="hud-city">捏合抓取，手掌平移飞行</strong></div>
  </main>
</div>

<div id="boot">
  <h1>手势地球</h1>
  <p id="boot-msg">正在准备…</p>
  <div id="bar-outer"><div id="bar-inner"></div></div>
  <button id="boot-btn" disabled>加载中</button>
  <div id="boot-err"></div>
</div>

<script type="module">
/* ============================================================================
 *  手势地球
 *  渲染 three.js（裸写）  识别 MediaPipe Tasks Vision HandLandmarker
 *  单文件，无后端，依赖全部走 CDN
 * ==========================================================================*/

/* ============================== 常量区 ==================================== */

// 依赖源。每个都要有备用，主源慢或不通时自动切。
const THREE_CDNS = [
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
];
const TASKS_VISION_CDN = [
  { js: 'https://registry.npmmirror.com/@mediapipe/tasks-vision/1.1.1/files/vision_bundle.mjs',
    wasm: 'https://registry.npmmirror.com/@mediapipe/tasks-vision/1.1.1/files/wasm' },
  { js: 'https://unpkg.com/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs',
    wasm: 'https://unpkg.com/@mediapipe/tasks-vision@1.1.1/wasm' }
];
// 先找同目录下的模型（部署时一起上传就从自己的站点分发），再回落到 Google 存储
const MODEL_URLS = [
  './hand_landmarker.task',
  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
];
const EARTH_TEXTURE_URL = 'https://unpkg.com/three-globe@2.44.0/example/img/earth-day.jpg';
const MODEL_CACHE = 'gesture-globe-model-v1';
const MODEL_CACHE_KEY = '/__model__/hand_landmarker.task';

// 视觉参数。全息玻璃壳 + 点阵内芯，改动都在这里。
const VIS = {
  LAND_SAMPLES: 46000,     // 斐波那契球面采样总数，取陆地处约三分之一
  LAND_RADIUS: 0.978,      // 在玻璃壳内部
  LAND_SIZE: 0.0145,
  LAND_COLOR: 0xbdefff,
  CITY_RADIUS: 1.008,
  CITY_SIZE: 0.185,
  STAR_COUNT: 1800,
  STAR_RADIUS: 70,
  STAR_SIZE: 0.34,
  SHELL_RADIUS: 1.0,
  SHELL_OPACITY: 0.014,    // 别调高，高了会把陆地粒子糊成白雾
  GRID_STEP: 30,
  GRID_OPACITY: 0.26,
  GRID_COLOR: 0x6fe8ff,
  RIM_COLOR: 0x2ad4ff,
  RIM_POWER: 3.6,
  RIM_STRENGTH: 0.7,
  RIM_SCALE: 1.05,
  RINGS: [[0.85, 1.22, 0.50], [-0.5, 1.34, 0.28], [0.15, 1.46, 0.18]],
  // 细分段数。三角形数不是瓶颈（填充率才是），但没必要白烧，够圆就行。
  SHELL_SEG: [48, 32],
  RIM_SEG: [64, 48],
  RING_SEG: [6, 160],
  DPR_LIMIT: 2
};

// 手势参数。手感不好就改这里，别去改算法。
const GESTURE = {
  // 粒子场景里相机轨道半径 = 9 + altitude * 18
  ALT_MIN: 0.05,             // 约半径 10，贴着粒子飞
  ALT_MAX: 2.0,              // 约半径 45，接近云层边缘
  PITCH_LIMIT: 80,           // 度
  // 增益单位是"每移动一个手掌宽度转多少度"。手掌宽度约是画面宽的 1/6，
  // 所以 60 意味着手掌横扫半个画面约转 200 度。
  YAW_GAIN: 60,
  PITCH_GAIN: 40,
  DEADZONE_PX: 1.5,          // 像素域死区，消掉静止时的高频抖动
  ROT_SMOOTH_MIN: 12,        // 旋转那路的 One Euro 参数
  ROT_SMOOTH_BETA: 0.05,
  // 缩放改用"双手 + 一只张开手掌"触发。单手捏合不再管缩放：
  // 捏合和拖拽在单手姿势里很难分清，是误触发的主要来源。
  OPEN_PALM_MIN: 4,          // 伸直几根手指算"张开手掌"（缩放锚点的条件）
  ZOOM_ENTER: 3,             // 连续几帧满足才进入缩放会话
  ZOOM_EXIT: 5,              // 连续几帧不满足才退出
  // 指距比的自然跨度很大（捏紧约 0.1，张开约 2.3，二十多倍），而高度只有五倍，
  // 所以用 0.7 的指数把它压平一些；用 1.0 的话手指稍微一动就顶到钳位上限。
  ZOOM_PINCH_GAIN: 0.7,
  ZOOM_RATIO_MIN: 0.05,      // 指距比的钳位范围，比自然跨度再宽一点留余量
  ZOOM_RATIO_MAX: 20,
  FLICK_TAU: 0.5,            // 甩动惯性的衰减时间常数，秒
  FLICK_MIN: 12,             // 低于这个角速度就不滑行，直接停
  FLICK_WINDOW: 6,
  JUMP_HOLD: 0.5,            // 比数字要保持多久才触发
  JUMP_COOLDOWN: 0.6,
  FLY_SECONDS: 0.8,          // 跳视角的飞行时长
  TILT_LIMIT: 35,            // 地轴倾斜上限，度
  TILT_GAIN: 1.0,
  TILT_SMOOTH: 5,            // 倾斜的平滑要比旋转更重
  TWOHAND_CONFIRM: 3,        // 连续几帧看到两只手才进双手模式
  TWOHAND_EXIT: 5,           // 连续几帧只有一只手才算真的退出（防一只手闪断）
  LOST_FRAMES: 6,            // 连续几帧没检测到手判定离开
  REACQUIRE_SEC: 0.15        // 手回来后的增益渐入时长
};

// 粒子场里的四个位置，对应比 1/2/3/4 根手指。
// altitude 越小相机越靠里，穿过粒子时视差越强。
const VIEWS = [
  { name: 'front', label: '正面', yaw: 0,   pitch: 0,  altitude: 0.35 },
  { name: 'deep',  label: '深入', yaw: 120, pitch: 12, altitude: 0.08 },
  { name: 'above', label: '俯瞰', yaw: 240, pitch: 45, altitude: 0.55 },
  { name: 'far',   label: '外围', yaw: 300, pitch: -8, altitude: 1.60 }
];

// 城市列表已经不用了：场景换成了粒子场

// 手部关键点索引（MediaPipe 21 点）
const HAND = {
  WRIST: 0,
  THUMB_TIP: 4,
  INDEX_MCP: 5,
  MIDDLE_MCP: 9,
  INDEX_TIP: 8,
  PALM_IDS: [0, 5, 9, 13, 17],                     // 掌指关节，不随手指伸屈移动
  FINGERS: [[8, 6], [12, 10], [16, 14], [20, 18]],  // [指尖, 第二关节]
  EXTEND_RATIO: 1.06,
  THUMB_IN_RATIO: 0.9
};

const HAND_EDGES = [
  [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12], [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20], [0,17]
];

/* ============================== 工具 ====================================== */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/** 动态插脚本，超时或失败都 reject，方便换下一个源。 */
function loadScript(url, timeoutMs = 25000) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true; el.remove(); reject(new Error('timeout'));
    }, timeoutMs);
    el.onload = () => { if (settled) return; settled = true; clearTimeout(timer); resolve(); };
    el.onerror = () => { if (settled) return; settled = true; clearTimeout(timer); el.remove(); reject(new Error('load error')); };
    el.src = url;
    document.head.appendChild(el);
  });
}

/** One Euro 滤波：慢速时强平滑（消抖），快速时几乎不滞后（跟手）。 */
class OneEuro {
  constructor(minCutoff = 1.1, beta = 0.02, dCutoff = 1.0) {
    this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
    this.reset();
  }
  reset() { this.xPrev = null; this.dxPrev = 0; }
  static alpha(cutoff, dt) {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / dt);
  }
  filter(x, dt) {
    if (dt <= 0) return x;
    if (this.xPrev === null) { this.xPrev = x; this.dxPrev = 0; return x; }
    const dx = (x - this.xPrev) / dt;
    const aD = OneEuro.alpha(this.dCutoff, dt);
    const dxHat = aD * dx + (1 - aD) * this.dxPrev;
    const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
    const a = OneEuro.alpha(cutoff, dt);
    const xHat = a * x + (1 - a) * this.xPrev;
    this.xPrev = xHat; this.dxPrev = dxHat;
    return xHat;
  }
}

/* ======================= 手势判定（纯函数，可单独测）======================= */

/**
 * 平移参考点与手掌尺度。
 *
 * 参考点用手腕（0），不是五个掌关节的质心。原因是手腕是手腕侧倾的支点：
 * 侧倾时手腕不动、质心会摆，用质心的话"倾斜地轴"这个手势会顺带把地球
 * 转走（实测一个全幅侧倾会带出约 8 度意外旋转）。用手腕就把两件事解耦了。
 * 手腕也不受手指伸屈影响。
 */
function palmRef(lm) {
  return {
    ref: { x: lm[HAND.WRIST].x, y: lm[HAND.WRIST].y },
    scale: d2(lm[HAND.WRIST], lm[HAND.MIDDLE_MCP]) || 1e-6
  };
}

/**
 * 手部姿态。
 * extended 是食指/中指/无名指/小指里伸直的根数；
 * thumbIn 是拇指内收（比数字）还是外展（摊开手掌），手指计数靠它避免误触发；
 * pinch 是拇指尖到食指尖的距离除以手掌尺度。
 */
function fingerState(lm) {
  const wrist = lm[HAND.WRIST];
  let extended = 0;
  for (const [tipId, pipId] of HAND.FINGERS) {
    if (d2(lm[tipId], wrist) > d2(lm[pipId], wrist) * HAND.EXTEND_RATIO) extended++;
  }
  const { scale } = palmRef(lm);
  return {
    extended,
    thumbIn: d2(lm[HAND.THUMB_TIP], lm[HAND.INDEX_MCP]) / scale < HAND.THUMB_IN_RATIO,
    pinch: d2(lm[HAND.THUMB_TIP], lm[HAND.INDEX_TIP]) / scale
  };
}

/** 手掌竖直时返回 0，向右倾为正。弧度。 */
function palmTilt(lm) {
  const dx = lm[HAND.MIDDLE_MCP].x - lm[HAND.WRIST].x;
  const dy = lm[HAND.MIDDLE_MCP].y - lm[HAND.WRIST].y;
  return Math.atan2(dx, -dy);
}

/* ============================== 手势引擎 ================================== */

/**
 * 把手部关键点变成视角指令。
 *
 * 只有一条主线：手的位移直接累加到角度上（拖拽），手停住就停。捏合、
 * 比数字、双手都是在这条主线上加分支，不是模式切换——用户不需要记住
 * "现在是什么状态"。
 */
function createGestureEngine(C, view) {
  const easeInOutCubic = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);

  let frameW = 640, frameH = 480;
  let lastNow = 0;

  let prevRef = null, prevScale = 0;
  let lastHandCount = -1;
  let flick = [];
  let coasting = null;
  let lostFrames = 0;
  let awaitingReacquire = false;
  let gainRamp = 1;

  let jumpCount = null, jumpSince = 0, jumpCooldownUntil = 0;
  let flying = null;

  let twoHandFrames = 0, singleFrames = 0, twoHandActive = false;
  let twoPrevMid = null;
  let zoomActive = false, zoomFrames = 0, zoomIdleFrames = 0, anchorPrev = null;
  let zoomBasePinch = null, zoomBaseAlt = 0, zoomAnchorIsFirst = null;

  const fTilt = new OneEuro(C.TILT_SMOOTH, 0.01);
  const fZoomPinch = new OneEuro(2.5, 0.02);

  let mode = 'idle';
  let jumpedTo = null;

  function setFrame(w, h) { if (w > 0 && h > 0) { frameW = w; frameH = h; } }

  function reset() {
    // 连视角一起复位：这样每次 reset 都是同一个起点，验证之间不会互相污染
    view.yaw = VIEWS[0].yaw;
    view.pitch = VIEWS[0].pitch;
    view.altitude = VIEWS[0].altitude;
    view.tiltZ = 0;
    prevRef = null; prevScale = 0; lastHandCount = -1;
    flick.length = 0; coasting = null;
    lostFrames = 0; awaitingReacquire = false; gainRamp = 1;
    zoomActive = false; zoomFrames = 0; zoomIdleFrames = 0; anchorPrev = null;
    zoomBasePinch = null; zoomAnchorIsFirst = null;
    jumpCount = null;
    flying = null;
    twoHandFrames = 0; singleFrames = 0; twoHandActive = false;
    twoPrevMid = null;
    fTilt.reset(); fZoomPinch.reset();
    mode = 'idle'; jumpedTo = null;
  }

  function snapshot() {
    return {
      mode, jumpedTo,
      yaw: view.yaw, pitch: view.pitch, altitude: view.altitude, tiltZ: view.tiltZ
    };
  }

  function update(hands, nowMs, dtOverride) {
    const dt = dtOverride || (lastNow ? Math.min(0.05, (nowMs - lastNow) / 1000) : 1 / 30);
    lastNow = nowMs;
    jumpedTo = null;

    // 单手逻辑统一用"离上一帧基准最近的那只手"。MediaPipe 返回的手序不保证稳定，
    // 直接用 hands[0] 会在手序翻转时把另一只手的位置当成位移，算出一大截假转角——
    // 表现就是"手拿出去再放回来之后突然特别灵敏"。
    let primaryIdx = 0;
    if (hands.length >= 2 && prevRef) {
      let best = Infinity;
      for (let i = 0; i < hands.length; i++) {
        const r = palmRef(hands[i]).ref;
        const d = Math.hypot((r.x - prevRef.x) * frameW, (r.y - prevRef.y) * frameH);
        if (d < best) { best = d; primaryIdx = i; }
      }
    }

    let ref = null, scale = 0, fs = null, tilt = 0;
    if (hands.length) {
      const p = palmRef(hands[primaryIdx]);
      ref = p.ref; scale = p.scale;
      fs = fingerState(hands[primaryIdx]);
      tilt = palmTilt(hands[primaryIdx]);
    }

    // 位移一律换算到像素域，再除以手掌尺度的像素值。这样横纵灵敏度一致，
    // 而且把手凑近或拿远摄像头时灵敏度不变。
    let movedPx = 0;
    // 手数增加时（有手回到画面）清掉基准：那一刻手序最可能翻转。
    // 手数减少不清，否则会破坏"一只手闪断一帧不掉出双手模式"的容忍度——
    // 那种情况由双手模式的冻结逻辑负责，不需要在这里处理。
    // 只在"没处在双手模式"时清。双手模式内部靠锚点邻近判定锁定是哪只手，
    // 不需要这个基准；在那里清反而会把"一只手闪断一帧"的容忍度打断。
    if (hands.length > lastHandCount && !twoHandActive) {
      prevRef = null;
      twoPrevMid = null;
      anchorPrev = null;
      flick.length = 0;
      coasting = null;
    }
    if (hands.length !== lastHandCount) {
      lastHandCount = hands.length;
    }

    if (ref && prevRef) {
      movedPx = Math.hypot((ref.x - prevRef.x) * frameW, (ref.y - prevRef.y) * frameH);
    }
    const moving = movedPx > C.DEADZONE_PX;

    // ---- 跳视角飞行中。位移超死区立刻打断，交回给手势 ----
    if (flying) {
      if (moving) {
        flying = null;
      } else {
        flying.t += dt;
        const k = clamp(flying.t / flying.dur, 0, 1);
        const e = easeInOutCubic(k);
        view.yaw = lerp(flying.from.yaw, flying.to.yaw, e);
        view.pitch = lerp(flying.from.pitch, flying.to.pitch, e);
        view.altitude = lerp(flying.from.altitude, flying.to.altitude, e);
        if (k >= 1) flying = null;
        prevRef = ref; prevScale = scale;
        mode = 'jumping';
        return snapshot();
      }
    }

    // ---- 手不见了：冻结，什么都不动，保持当前视角 ----
    if (!hands.length) {
      lostFrames++;
      coasting = null;
      flick.length = 0;
      prevRef = null;
      if (lostFrames >= C.LOST_FRAMES) awaitingReacquire = true;
      mode = 'idle';
      return snapshot();
    }

    // ---- 手刚回到画面：重置基准 + 增益渐入，避免回来那一帧被当成拖拽 ----
    if (awaitingReacquire || prevRef === null) {
      prevRef = ref; prevScale = scale;
      gainRamp = 0;
      awaitingReacquire = false;
      lostFrames = 0;
      flick.length = 0;
      mode = 'rotate';
      return snapshot();
    }
    lostFrames = 0;
    gainRamp = Math.min(1, gainRamp + dt / C.REACQUIRE_SEC);

    // ---- 双手模式的进出 ----
    // 进入要连续看到两只手，退出要连续只看到一只手。双阈值是为了让
    // 一只手闪断一帧不至于掉出模式——那会造成基准重置和视角跳变。
    if (hands.length >= 2) { twoHandFrames++; singleFrames = 0; }
    else { singleFrames++; twoHandFrames = 0; }

    if (!twoHandActive && twoHandFrames >= C.TWOHAND_CONFIRM) {
      twoHandActive = true;
      zoomBasePinch = null;             // 重新采样缩放基准
      twoPrevMid = null;
      fZoomPinch.reset();
    }
    if (twoHandActive && singleFrames >= C.TWOHAND_EXIT) {
      twoHandActive = false;
      twoPrevMid = null;
      prevRef = null;                   // 回到单手的下一帧重新建立基准，避免跳变
      // 缩放会话的状态必须一起清掉。只清基准是不够的：滤波器会留着上一轮的
      // 滞后值，下次进来时基准就取到那个陈旧的值，地球会自己跑一截。
      zoomActive = false; zoomFrames = 0; zoomIdleFrames = 0;
      zoomBasePinch = null; anchorPrev = null;
      fZoomPinch.reset();
    }

    if (twoHandActive) {
      jumpCount = null;                 // 双手时禁用单手的比数字跳视角

      // 一只手短暂丢失：冻结，不切换也不跳变
      if (hands.length < 2) {
        mode = 'twoHand';
        return snapshot();
      }

      const pa = palmRef(hands[0]);
      const pb = palmRef(hands[1]);
      const fa = fingerState(hands[0]);
      const fb = fingerState(hands[1]);
      const aOpen = fa.extended >= C.OPEN_PALM_MIN;
      const bOpen = fb.extended >= C.OPEN_PALM_MIN;

      // 缩放会话的进出用双阈值，手掌姿势抖一下不会反复进出
      if (aOpen || bOpen) { zoomFrames++; zoomIdleFrames = 0; }
      else { zoomIdleFrames++; zoomFrames = 0; }
      if (!zoomActive && zoomFrames >= C.ZOOM_ENTER) {
        zoomActive = true; zoomBasePinch = null;
        fZoomPinch.reset();             // 滤波器也要清，否则基准会取到上一轮残留的滞后值
      }
      if (zoomActive && zoomIdleFrames >= C.ZOOM_EXIT) {
        zoomActive = false; zoomBasePinch = null; anchorPrev = null;
      }

      if (zoomActive) {
        // 选锚点（张开的那只手）。两只都张开时，取离上一帧锚点更近的那只——
        // MediaPipe 每帧返回的手序不保证稳定，不这样做角色会来回翻转、视角乱跳。
        let anchorIsFirst;
        if (aOpen !== bOpen) {
          anchorIsFirst = aOpen;
        } else if (anchorPrev) {
          const da = Math.hypot(pa.ref.x - anchorPrev.x, pa.ref.y - anchorPrev.y);
          const db = Math.hypot(pb.ref.x - anchorPrev.x, pb.ref.y - anchorPrev.y);
          anchorIsFirst = da <= db;
        } else {
          anchorIsFirst = true;
        }
        const anchor = anchorIsFirst ? pa : pb;
        const anchorScale = anchorIsFirst ? pa.scale : pb.scale;
        const controlFingers = anchorIsFirst ? fb : fa;

        // 锚点换手了就重建缩放基准，否则会跳一下
        if (zoomAnchorIsFirst !== null && zoomAnchorIsFirst !== anchorIsFirst) zoomBasePinch = null;
        zoomAnchorIsFirst = anchorIsFirst;

        // 旋转只由锚点手驱动。这样控制手来回移动缩放时，地球不会被带转——
        // 这正是"一只手掌打开、另一只手控制远近"这套分工的意义。
        if (anchorPrev) {
          const dxPx = (anchor.ref.x - anchorPrev.x) * frameW;
          const dyPx = (anchor.ref.y - anchorPrev.y) * frameH;
          if (Math.hypot(dxPx, dyPx) > C.DEADZONE_PX) {
            const scalePx = anchorScale * frameW || 1;
            view.yaw -= (dxPx / scalePx) * C.YAW_GAIN;
            view.pitch = clamp(view.pitch + (dyPx / scalePx) * C.PITCH_GAIN, -C.PITCH_LIMIT, C.PITCH_LIMIT);
          }
        }
        anchorPrev = { x: anchor.ref.x, y: anchor.ref.y };

        // 缩放由控制手自己决定：看它自己的手指开合，和另一只手无关。
        // 捏合 = 缩小（推远），张开 = 放大（拉近）。
        // 仍然是相对映射：进入会话时锁定基准指距和基准高度，之后按比例变化，
        // 否则手一张开地球就会瞬间飞到某个固定距离。
        const p = fZoomPinch.filter(controlFingers.pinch, dt);
        if (p > 1e-4) {
          if (zoomBasePinch === null) { zoomBasePinch = p; zoomBaseAlt = view.altitude; }
          const ratio = clamp(p / zoomBasePinch, C.ZOOM_RATIO_MIN, C.ZOOM_RATIO_MAX);
          view.altitude = clamp(zoomBaseAlt / Math.pow(ratio, C.ZOOM_PINCH_GAIN), C.ALT_MIN, C.ALT_MAX);
        }

        twoPrevMid = null;              // 退出缩放时不要拿旧基准去转
        prevRef = anchor.ref; prevScale = anchorScale;
        mode = 'zoom';
        return snapshot();
      }

      // 没进入缩放会话（两只手都没张开）：保持双手平移旋转
      anchorPrev = null;
      const mid = { x: (pa.ref.x + pb.ref.x) / 2, y: (pa.ref.y + pb.ref.y) / 2 };
      if (twoPrevMid) {
        const dxPx = (mid.x - twoPrevMid.x) * frameW;
        const dyPx = (mid.y - twoPrevMid.y) * frameH;
        if (Math.hypot(dxPx, dyPx) > C.DEADZONE_PX) {
          const scalePx = ((pa.scale + pb.scale) / 2) * frameW || 1;
          view.yaw -= (dxPx / scalePx) * C.YAW_GAIN;
          view.pitch = clamp(view.pitch + (dyPx / scalePx) * C.PITCH_GAIN, -C.PITCH_LIMIT, C.PITCH_LIMIT);
        }
      }
      twoPrevMid = mid;

      prevRef = ref; prevScale = scale;
      mode = 'twoHand';
      return snapshot();
    }
    twoPrevMid = null; zoomBasePinch = null;

    // ---- 手指计数跳视角 ----
    // 三条同时满足：伸直 1~4 根、拇指内收、手基本静止。
    // 拇指内收这条是关键：摊开手掌时拇指外展，所以拖拽完手停住不会误触发。
    const eligible = fs.extended >= 1 && fs.extended <= 4 && fs.thumbIn &&
                     !moving && nowMs >= jumpCooldownUntil;
    if (eligible) {
      if (jumpCount === fs.extended) {
        if (nowMs - jumpSince >= C.JUMP_HOLD * 1000) {
          const v = VIEWS[fs.extended - 1];
          flying = {
            from: { yaw: view.yaw, pitch: view.pitch, altitude: view.altitude },
            to: v, t: 0, dur: C.FLY_SECONDS
          };
          jumpedTo = v.name;
          jumpCooldownUntil = nowMs + C.JUMP_COOLDOWN * 1000;
          jumpCount = null;
          flick.length = 0; coasting = null;
          prevRef = ref;
          mode = 'jumping';
          return snapshot();
        }
      } else {
        jumpCount = fs.extended;
        jumpSince = nowMs;
      }
    } else {
      jumpCount = null;
    }
    const jumpPending = jumpCount !== null;

    // 缩放不在这里做。单手只负责旋转；缩放要两只手，其中一只张开手掌，
    // 见上面的双手分支。这样把"转"和"缩放"分给不同的手，两者不会互相干扰。

    // ---- 拖拽旋转 ----
    if (jumpPending) {
      coasting = null;                  // 正在比数字，别让手抖带转地球
      flick.length = 0;
    } else if (moving) {
      const dxPx = (ref.x - prevRef.x) * frameW;
      const dyPx = (ref.y - prevRef.y) * frameH;
      const scalePx = scale * frameW || 1;
      const dYaw = -(dxPx / scalePx) * C.YAW_GAIN * gainRamp;     // 抓取语义：手往右推，球面往右走
      const dPitch = (dyPx / scalePx) * C.PITCH_GAIN * gainRamp;  // 手往上推，露出南半球
      view.yaw += dYaw;
      view.pitch = clamp(view.pitch + dPitch, -C.PITCH_LIMIT, C.PITCH_LIMIT);
      coasting = null;
      flick.push({ yaw: dYaw, pitch: dPitch, dt });
      if (flick.length > C.FLICK_WINDOW) flick.shift();
    } else if (!coasting) {
      // 手停住了。看刚才划得快不快：快才滑行，慢就干脆停。
      if (flick.length >= 3) {
        let sy = 0, sp = 0, sd = 0;
        for (const s of flick) { sy += s.yaw; sp += s.pitch; sd += s.dt; }
        const vy = sy / sd, vp = sp / sd;
        if (Math.hypot(vy, vp) > C.FLICK_MIN) coasting = { yaw: vy, pitch: vp };
      }
      flick.length = 0;
    }

    // ---- 甩动惯性：指数衰减，低于阈值彻底停 ----
    if (coasting) {
      const k = Math.exp(-dt / C.FLICK_TAU);
      view.yaw += coasting.yaw * dt;
      view.pitch = clamp(view.pitch + coasting.pitch * dt, -C.PITCH_LIMIT, C.PITCH_LIMIT);
      coasting.yaw *= k; coasting.pitch *= k;
      if (Math.hypot(coasting.yaw, coasting.pitch) < C.FLICK_MIN) coasting = null;
    }

    // ---- 掌心倾斜 → 地轴。比旋转更重的平滑，免得手抖让地球晃 ----
    const tiltDeg = fTilt.filter(tilt, dt) * 180 / Math.PI * C.TILT_GAIN;
    view.tiltZ = clamp(tiltDeg, -C.TILT_LIMIT, C.TILT_LIMIT);

    prevRef = ref; prevScale = scale;
    mode = 'rotate';
    return snapshot();
  }

  return {
    update, reset, setFrame, snapshot,
    // 只在 ?debug 下通过调试钩子暴露，用来排查缩放之类的内部状态
    _dbg: () => ({
      zoomActive, zoomBasePinch, zoomBaseAlt, zoomFrames, zoomIdleFrames,
      anchorIsFirst: zoomAnchorIsFirst, twoHandActive, singleFrames,
      pinchFiltered: fZoomPinch.xPrev
    })
  };
}

/* ============================== 粒子场景 ================================== */

async function loadThree(onStage) {
  let lastErr = null;
  for (const url of THREE_CDNS) {
    try {
      if (onStage) onStage('正在加载 3D 库…（' + new URL(url).host + '）');
      return await import(url);
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('three.js 加载失败');
}

const FIELD = {
  COUNT: 26000,
  R_MIN: 26,               // 云的内半径。相机轨道最大只有 48，所以永远在云里面，
  R_MAX: 130,              // 这样平移才会产生"穿过粒子"的视差，而不是"看着一团东西转"
  ORBIT_BASE: 9,
  ORBIT_GAIN: 18,
  GRAB_COUNT: 420,
  GRAB_DIST: 6,
  COLOR_A: 0x9fe8ff,
  COLOR_B: 0x7aa8ff,
  COLOR_C: 0xd8c6ff,
  DPR_LIMIT: 2
};

/** 粒子场。位置一次性生成，流动和闪烁在着色器里做，CPU 每帧零开销。 */
function buildField(THREE) {
  const n = FIELD.COUNT;
  const pos = new Float32Array(n * 3);
  const seed = new Float32Array(n);
  const tint = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1;
    const th = Math.random() * Math.PI * 2;
    const rr = Math.sqrt(Math.max(0, 1 - u * u));
    const R = FIELD.R_MIN + Math.pow(Math.random(), 0.65) * (FIELD.R_MAX - FIELD.R_MIN);
    pos[i * 3] = rr * Math.cos(th) * R;
    pos[i * 3 + 1] = u * R * 0.55;          // 压扁成片状，飞行时更像穿过星云
    pos[i * 3 + 2] = rr * Math.sin(th) * R;
    seed[i] = Math.random();
    tint[i] = Math.random();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  g.setAttribute('aTint', new THREE.BufferAttribute(tint, 1));
  return g;
}

function fieldMaterial(THREE) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uOpacity: { value: 1 },
      cA: { value: new THREE.Color(FIELD.COLOR_A) },
      cB: { value: new THREE.Color(FIELD.COLOR_B) },
      cC: { value: new THREE.Color(FIELD.COLOR_C) }
    },
    vertexShader: `
      attribute float aSeed;
      attribute float aTint;
      uniform float uTime;
      varying float vShade;
      varying float vTint;
      void main() {
        vec3 p = position;
        float t = uTime * 0.35 + aSeed * 6.283;
        p.x += sin(t * 0.70) * 1.6;
        p.y += cos(t * 0.53) * 1.1;
        p.z += sin(t * 0.61 + 1.7) * 1.6;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float d = -mv.z;
        vShade = clamp(1.0 - (d - 20.0) / 150.0, 0.12, 1.0);
        vTint = aTint;
        gl_PointSize = clamp(120.0 / d, 1.0, 7.0) * (0.7 + aSeed * 0.6);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform float uOpacity;
      uniform vec3 cA; uniform vec3 cB; uniform vec3 cC;
      varying float vShade;
      varying float vTint;
      void main() {
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        float a = smoothstep(0.5, 0.05, r);
        vec3 col = mix(mix(cA, cB, vTint), cC, smoothstep(0.75, 1.0, vTint));
        gl_FragColor = vec4(col, a * vShade * uOpacity);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
}

async function createScene(container, onStage) {
  const THREE = await loadThree(onStage);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, FIELD.DPR_LIMIT));
  renderer.setClearColor(0x04060e, 1);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(62, 1, 0.5, 4000);

  const geo = buildField(THREE);
  const mat = fieldMaterial(THREE);
  scene.add(new THREE.Points(geo, mat));

  // 捏合抓起来的那一团：单独一组点，位置跟着相机前方走
  const grabGeo = new THREE.BufferGeometry();
  const grabPos = new Float32Array(FIELD.GRAB_COUNT * 3);
  const grabSeed = new Float32Array(FIELD.GRAB_COUNT);
  for (let i = 0; i < FIELD.GRAB_COUNT; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
    const rr = Math.sqrt(Math.max(0, 1 - u * u));
    grabPos[i * 3] = rr * Math.cos(th) * 3;
    grabPos[i * 3 + 1] = u * 3;
    grabPos[i * 3 + 2] = rr * Math.sin(th) * 3;
    grabSeed[i] = Math.random();
  }
  grabGeo.setAttribute('position', new THREE.BufferAttribute(grabPos, 3));
  grabGeo.setAttribute('aSeed', new THREE.BufferAttribute(grabSeed, 1));
  grabGeo.setAttribute('aTint', new THREE.BufferAttribute(grabSeed.slice(), 1));
  const grabMat = fieldMaterial(THREE);
  grabMat.uniforms.uOpacity.value = 0;
  const grabPoints = new THREE.Points(grabGeo, grabMat);
  grabPoints.frustumCulled = false;
  scene.add(grabPoints);

  function resize() {
    const w = container.clientWidth || 1;
    const h = container.clientHeight || 1;
    // 第三参数必须是 true，否则 2 倍屏上 canvas 会按设备像素显示、比容器大一倍
    renderer.setSize(w, h, true);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));

  const camDir = new THREE.Vector3();
  const lookTarget = new THREE.Vector3(0, 0, 0);
  let grabMix = 0;
  let grabAmount = 0;

  function apply(s) {
    const r = FIELD.ORBIT_BASE + s.altitude * FIELD.ORBIT_GAIN;
    const yawRad = s.yaw * Math.PI / 180;
    const pitchRad = clamp(s.pitch, -70, 70) * Math.PI / 180;
    camera.position.set(
      r * Math.cos(pitchRad) * Math.sin(yawRad),
      r * Math.sin(pitchRad),
      r * Math.cos(pitchRad) * Math.cos(yawRad)
    );
    camDir.copy(lookTarget).sub(camera.position).normalize();
    const up = new THREE.Vector3(0, 1, 0).applyAxisAngle(camDir, (s.tiltZ || 0) * Math.PI / 180);
    camera.up.copy(up);
    camera.lookAt(lookTarget);

    // 抓取点放在相机前方固定距离，捏得越紧这一团收得越小、转得越快
    grabPoints.position.copy(camera.position).add(camDir.clone().multiplyScalar(FIELD.GRAB_DIST));
    grabPoints.scale.setScalar(1.0 + (1 - grabAmount) * 2.2);
    grabPoints.rotation.y += 0.006 + grabAmount * 0.02;
  }

  /** amount: 0 松手 ~ 1 捏紧。也控制淡入淡出。 */
  function setGrab(amount) {
    grabAmount = clamp(amount, 0, 1);
    grabMix = grabAmount;
  }

  function render(elapsed) {
    mat.uniforms.uTime.value = elapsed;
    grabMat.uniforms.uTime.value = elapsed;
    grabMat.uniforms.uOpacity.value = grabMix * 0.95;
    renderer.render(scene, camera);
  }

  function stats() {
    return {
      particles: FIELD.COUNT,
      grabbed: FIELD.GRAB_COUNT,
      drawCalls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles
    };
  }

  return { THREE, apply, render, resize, stats, setGrab, camera, renderer, scene, dispose() { renderer.dispose(); } };
}

async function openModelCache() {
  try {
    if (typeof caches === 'undefined') return null;
    return await caches.open(MODEL_CACHE);
  } catch (_) { return null; }
}

/**
 * 同时向多个来源发起下载，5 秒后比谁传得多，留快的、掐掉慢的。
 *
 * 不要改成"按顺序 try 每个源"——上一版就是这么写的，卡在一条不通的线路上
 * 不回退，进度条一动不动，而且没有超时，用户只能干等。
 */
async function fetchModelBuffer(onProgress) {
  const cache = await openModelCache();
  if (cache) {
    try {
      const hit = await cache.match(MODEL_CACHE_KEY);
      if (hit) {
        onProgress(1, 1, 1, true);
        return new Uint8Array(await hit.arrayBuffer());
      }
    } catch (_) { /* 继续走网络 */ }
  }

  const makeRacer = (url) => ({
    url, ctrl: new AbortController(),
    chunks: [], got: 0, total: 0, done: false, ok: false, err: null
  });

  const runRacer = async (r) => {
    try {
      const res = await fetch(r.url, { mode: 'cors', signal: r.ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      r.total = Number(res.headers.get('content-length')) || 0;
      if (!res.body || !res.body.getReader) {
        const buf = new Uint8Array(await res.arrayBuffer());
        r.chunks.push(buf); r.got = buf.length; r.ok = true; r.done = true;
        return;
      }
      const reader = res.body.getReader();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        r.chunks.push(value);
        r.got += value.length;
      }
      r.ok = true;
    } catch (err) {
      r.err = err;
    }
    r.done = true;
  };

  const racers = MODEL_URLS.map(makeRacer);
  racers.forEach(runRacer);

  const probeUntil = performance.now() + 5000;
  const giveUpAt = performance.now() + 20000;
  let winner = null;
  while (performance.now() < giveUpAt) {
    const finished = racers.find((r) => r.done && r.ok);
    if (finished) { winner = finished; break; }
    if (performance.now() > probeUntil) {
      const best = racers.slice().sort((a, b) => b.got - a.got)[0];
      if (best && best.got > 65536) { winner = best; break; }
    }
    await sleep(150);
  }
  if (!winner) {
    const best = racers.slice().sort((a, b) => b.got - a.got)[0];
    if (best && best.got > 0) winner = best;
  }
  if (!winner) {
    racers.forEach((r) => r.ctrl.abort());
    throw new Error('所有模型源都没能开始传输（这个网络到两个地址都不通）');
  }
  racers.forEach((r) => { if (r !== winner) r.ctrl.abort(); });

  let lastBytes = winner.got;
  let lastMove = performance.now();
  while (!winner.done) {
    await sleep(200);
    if (winner.got !== lastBytes) { lastBytes = winner.got; lastMove = performance.now(); }
    onProgress(winner.total ? winner.got / winner.total : 0, winner.got, winner.total, false);
    if (performance.now() - lastMove > 20000) {
      winner.ctrl.abort();
      throw new Error('下载停住了（20 秒没有新数据）');
    }
  }
  if (!winner.ok) throw new Error('下载中断：' + ((winner.err && winner.err.message) || '未知原因'));

  const buf = new Uint8Array(winner.got);
  let off = 0;
  for (const ch of winner.chunks) { buf.set(ch, off); off += ch.length; }

  if (cache) {
    cache.put(MODEL_CACHE_KEY, new Response(buf.slice(), {
      headers: {
        'Content-Type': 'application/octet-stream',
        'Content-Length': String(buf.length)
      }
    })).catch(() => {});
  }
  return buf;
}

async function createLandmarker(modelBuf) {
  let mod = null, wasmPath = '', lastErr = null;
  for (const cdn of TASKS_VISION_CDN) {
    try { mod = await import(cdn.js); wasmPath = cdn.wasm; break; }
    catch (err) { lastErr = err; }
  }
  if (!mod) throw lastErr || new Error('MediaPipe 运行时加载失败');

  const fileset = await mod.FilesetResolver.forVisionTasks(wasmPath);
  const options = {
    baseOptions: { modelAssetBuffer: modelBuf, delegate: 'GPU' },
    runningMode: 'VIDEO',
    numHands: 2,                     // 双手模式需要
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  };
  try {
    return await mod.HandLandmarker.createFromOptions(fileset, options);
  } catch (_) {
    options.baseOptions.delegate = 'CPU';   // 少数设备上 GPU 委托起不来
    return await mod.HandLandmarker.createFromOptions(fileset, options);
  }
}

/* ============================== 主流程 ==================================== */

let scene = null;
let landmarker = null;
let running = false;
const view = { yaw: VIEWS[0].yaw, pitch: VIEWS[0].pitch, altitude: VIEWS[0].altitude, tiltZ: 0 };
const engine = createGestureEngine(GESTURE, view);
let mouseHoldUntil = 0;

function drawCameraFrame(landmarks) {
  const w = $camCanvas.width, h = $camCanvas.height;
  camCtx.setTransform(1, 0, 0, 1, 0, 0);
  camCtx.clearRect(0, 0, w, h);
  camCtx.save();
  camCtx.translate(w, 0);
  camCtx.scale(-1, 1);
  try { camCtx.drawImage($video, 0, 0, w, h); } catch (_) {}
  camCtx.restore();

  if (!landmarks || !landmarks.length) return;
  for (const lm of landmarks) {
    const px = (i) => ({ x: (1 - lm[i].x) * w, y: lm[i].y * h });
    camCtx.lineWidth = 2;
    camCtx.strokeStyle = 'rgba(74,157,255,.85)';
    camCtx.beginPath();
    for (const [a, b] of HAND_EDGES) {
      const pa = px(a), pb = px(b);
      camCtx.moveTo(pa.x, pa.y);
      camCtx.lineTo(pb.x, pb.y);
    }
    camCtx.stroke();
    const tips = new Set([4, 8, 12, 16, 20]);
    for (let i = 0; i < lm.length; i++) {
      const p = px(i);
      camCtx.beginPath();
      camCtx.arc(p.x, p.y, tips.has(i) ? 3.6 : 2.2, 0, Math.PI * 2);
      camCtx.fillStyle = tips.has(i) ? '#ffd166' : '#eaf2ff';
      camCtx.fill();
    }
  }
}

let lastDetectAt = 0;
let lastVideoTime = -1;
let handsForGrab = [];      // 最近一次检测到的手，供渲染循环读捏合程度
let grabSmooth = 0;         // 抓取程度的平滑值
let fpsAcc = 0, fpsFrames = 0, fpsStamp = 0;
let lastFrameAt = 0;

function frame(now) {
  requestAnimationFrame(frame);

  const dt = lastFrameAt ? Math.min(0.05, (now - lastFrameAt) / 1000) : 0;
  lastFrameAt = now;

  // 检测限速到 30fps。渲染循环从场景建好就跑，所以启动遮罩后面
  // 一直能看见地球在转——干等黑屏是最难熬的。
  if (running && landmarker &&
      $video.readyState >= 2 && $video.videoWidth > 0 &&
      now - lastDetectAt >= 33 && $video.currentTime !== lastVideoTime) {
    lastDetectAt = now;
    lastVideoTime = $video.currentTime;
    let hands = [];
    try {
      const res = landmarker.detectForVideo($video, now);
      hands = (res && res.landmarks) || [];
    } catch (_) { hands = []; }
    handsForGrab = hands;

    // 鼠标刚动过就让手势先等一秒，否则两边会互相抢相机
    const snap = now >= mouseHoldUntil
      ? engine.update(hands, now)
      : engine.snapshot();
    const f0 = hands.length ? fingerState(hands[0]) : null;
    $pinchFill.style.width = f0
      ? Math.round((1 - clamp(f0.pinch / 1.5, 0, 1)) * 100) + '%'
      : '0%';
    updateStatusFromHands(hands, snap);
    drawCameraFrame(hands);

    fpsAcc += now - (fpsStamp || now);
    fpsFrames++;
    fpsStamp = now;
    if (fpsAcc > 500) {
      $fps.textContent = Math.round(fpsFrames * 1000 / fpsAcc) + ' fps';
      fpsAcc = 0; fpsFrames = 0;
    }
  }

  // 捏合程度直接驱动"抓取一团粒子"：捏得越紧，那一团收得越小、转得越快
  if (handsForGrab.length) {
    const f = fingerState(handsForGrab[0]);
    grabSmooth += (clamp((0.85 - f.pinch) / 0.5, 0, 1) - grabSmooth) * Math.min(1, dt * 12);
  } else {
    grabSmooth += (0 - grabSmooth) * Math.min(1, dt * 6);
  }
  scene.setGrab(grabSmooth);
  scene.apply(view);
  scene.render(now / 1000);
}

function updateStatusFromHands(hands, snap) {
  if (!hands.length) {
    setStatus('searching', '检测中', '把手放进画面');
    return;
  }
  if (snap.mode === 'twoHand') { setStatus('active', '双手模式', '两手掌距控制远近'); return; }
  if (snap.mode === 'jumping') { setStatus('active', '跳转中', '正在飞往预设视角'); return; }
  if (snap.mode === 'zoom') { setStatus('active', '缩放中', '控制手捏合推远，张开拉近'); return; }
  const f = fingerState(hands[0]);
  setStatus('active', '控制生效',
    (f.thumbIn && f.extended >= 1 && f.extended <= 4)
      ? '保持这个手势就会跳视角'
      : ('伸直 ' + f.extended + ' 指'));
}

/** 桌面上的鼠标操作：拖动旋转、滚轮缩放。手势接管时会被暂停。 */
function bindMouse(canvas) {
  let dragging = false, lastX = 0, lastY = 0;

  /** 鼠标一动就把手势接管推迟一秒，避免鼠标和手势同时改相机 */
  const holdGestures = () => { mouseHoldUntil = performance.now() + 1000; };

  canvas.addEventListener('pointerdown', (e) => {
    holdGestures();
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    holdGestures();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    view.yaw -= dx * 0.28;                                  // 抓取语义
    view.pitch = clamp(view.pitch + dy * 0.22, -GESTURE.PITCH_LIMIT, GESTURE.PITCH_LIMIT);
  });
  canvas.addEventListener('pointerup', (e) => {
    dragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    holdGestures();
    view.altitude = clamp(view.altitude + e.deltaY * 0.0016, GESTURE.ALT_MIN, GESTURE.ALT_MAX);
  }, { passive: false });
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      facingMode: 'user',
      width: { ideal: 640 },
      height: { ideal: 480 },
      frameRate: { ideal: 30, max: 30 }
    }
  });
  $video.srcObject = stream;
  await $video.play();
  await new Promise((resolve) => {
    if ($video.videoWidth > 0) return resolve();
    $video.addEventListener('loadeddata', resolve, { once: true });
  });
  engine.setFrame($video.videoWidth, $video.videoHeight);
}

async function boot() {
  // 分阶段推进，每一步都写在界面上，卡住时一眼能看出卡在哪一环
  $bootMsg.textContent = '正在加载 3D 库…';
  try {
    scene = await createScene($('globe'), (msg) => { $bootMsg.textContent = msg; });
    $bootMsg.textContent = '正在初始化地球…';
    bindMouse(scene.renderer.domElement);
    window.__scene = scene;
    $bootMsg.textContent = '正在准备手部识别运行时…';
    lastFrameAt = 0;
    requestAnimationFrame(frame);      // 场景先跑起来，后面加载模型期间也能看见
  } catch (err) {
    $bootMsg.textContent = '3D 初始化失败。';
    $bootErr.textContent = String(err.message || err);
    return;
  }

  try {
    $bootMsg.textContent = '正在准备手部识别运行时…';
    let lastPaint = 0;
    const modelBuf = await fetchModelBuffer((frac, got, total, cached) => {
      const pct = total ? Math.round(frac * 100) : 0;
      const now = performance.now();
      if (now - lastPaint < 120 && frac < 1) return;
      lastPaint = now;
      $bar.style.width = (cached ? 100 : pct) + '%';
      $bootMsg.textContent = cached
        ? '识别模型已在本机缓存，无需再次下载。'
        : '正在下载手部识别模型（第一次打开需要下载约 7.8MB）' +
          (total ? ' — ' + pct + '%  ' + (got / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB' : '');
    });
    $bar.style.width = '100%';
    $bootMsg.textContent = '正在启动识别引擎…';
    landmarker = await createLandmarker(modelBuf);
    $bootMsg.textContent = '模型就绪。点击开始，浏览器会请求摄像头权限。';
    $bootBtn.disabled = false;
    $bootBtn.textContent = '开始';
  } catch (err) {
    $bootMsg.textContent = '模型加载失败。';
    $bootErr.textContent = String(err.message || err) + '\n（把这行提示发给我。）';
  }
}

$bootBtn.addEventListener('click', async () => {
  $bootBtn.disabled = true;
  $bootBtn.textContent = '启动中…';
  try {
    await startCamera();
  } catch (err) {
    $bootBtn.disabled = false;
    $bootBtn.textContent = '重试';
    $bootErr.textContent = '拿不到摄像头：' + String(err.message || err) +
      '\n必须是 HTTPS 或 localhost，并且不要在微信等内置浏览器里打开。';
    return;
  }
  $boot.classList.add('hidden');
  running = true;
  setStatus('searching', '检测中', '把手放进画面');
});

// 调试钩子：网址带 ?debug 才挂上
if (new URLSearchParams(location.search).has('debug')) {
  let simNow = 0;
  window.__gesture = {
    probe(lm) {
      const p = palmRef(lm);
      return Object.assign({}, p, fingerState(lm), { tilt: palmTilt(lm) });
    },
    reset() { engine.reset(); simNow = 0; },
    step(hands, dt = 1 / 30) {
      simNow += dt * 1000;
      return engine.update(hands, simNow, dt);
    },
    dbg() { return engine._dbg(); },
    state() { return Object.assign({}, view); },
    constants: GESTURE
  };
}

boot();
</script>
