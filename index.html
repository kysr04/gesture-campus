<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="data:,">
<title>手势控制地球 · Gesture Globe</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #05070d; color: #e8eefc; overflow: hidden;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  #app { display: flex; height: 100%; width: 100%; }

  /* ---------- 左侧：摄像头 + 关键点 ---------- */
  #cam-panel {
    flex: 0 0 292px; width: 292px; height: 100%;
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px; background: #080c16;
    border-right: 1px solid #16203a;
    overflow: hidden;
  }
  #cam-title {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #6f80a6;
  }
  #cam-title span:last-child { font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
  #cam-canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 4 / 3;
    background: #000; border-radius: 10px; border: 1px solid #16203a;
  }
  #status-box {
    border-radius: 10px; padding: 10px 12px;
    background: #0d1424; border: 1px solid #1d2a48;
  }
  #status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #6b7a99; margin-right: 8px; vertical-align: middle;
    transition: background .2s ease, box-shadow .2s ease;
  }
  #status-text { font-size: 15px; font-weight: 600; line-height: 1.3; }
  #status-sub { font-size: 12px; color: #7d8cab; margin-top: 5px; line-height: 1.4; }
  #status-box[data-state="active"] #status-dot { background: #37e08a; box-shadow: 0 0 10px #37e08a99; }
  #status-box[data-state="paused"] #status-dot { background: #ffb020; box-shadow: 0 0 10px #ffb02099; }
  #status-box[data-state="searching"] #status-dot { background: #4a9dff; box-shadow: 0 0 10px #4a9dff99; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  #pinch-wrap { font-size: 11px; color: #7d8cab; }
  #pinch-bar { height: 5px; border-radius: 3px; background: #16203a; margin-top: 6px; overflow: hidden; }
  #pinch-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4a9dff, #37e08a); transition: width .08s linear; }

  #help { font-size: 11.5px; color: #61708f; line-height: 1.65; margin-top: auto; }
  #help b { color: #8698bd; font-weight: 600; }

  /* ---------- 右侧：globe.gl ---------- */
  #globe-panel { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; background: #05070d; }
  #globe { position: absolute; inset: 0; }
  #globe * { outline: none; }

  #globe-hud {
    position: absolute; top: 14px; left: 16px; pointer-events: none;
    font-size: 12px; color: #5d6c8c; letter-spacing: .04em;
  }
  #globe-hud strong { color: #9fb2d8; font-weight: 600; }

  /* hover 提示：globe.gl 的 pointLabel 走这个 class */
  .scene-tooltip { font-family: inherit !important; }
  .city-tip {
    background: rgba(10, 16, 30, .92); color: #ffe6ad;
    padding: 4px 9px; border-radius: 7px; font-size: 13px;
    border: 1px solid rgba(255, 209, 102, .35); white-space: nowrap;
  }

  /* ---------- 启动遮罩 ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center;
    /* 半透明：模型下载期间也能看见后面的地球在转 */
    background: radial-gradient(circle at 50% 40%, rgba(13,24,48,.88) 0%, rgba(5,7,13,.94) 68%);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  #boot.hidden { display: none; }
  #boot h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: .01em; }
  #boot p { margin: 0; font-size: 13px; color: #7d8cab; max-width: 420px; line-height: 1.7; }
  #bar-outer { width: min(360px, 78vw); height: 6px; border-radius: 3px; background: #16203a; overflow: hidden; }
  #bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, #4a9dff, #37e08a); transition: width .25s ease; }
  #boot-btn {
    -webkit-appearance: none; appearance: none; border: 0; cursor: pointer;
    padding: 13px 42px; border-radius: 999px; font-size: 16px; font-weight: 600;
    color: #04121f; background: linear-gradient(135deg, #7fe0ff, #37e08a);
    font-family: inherit; transition: opacity .2s ease, transform .12s ease;
  }
  #boot-btn:active { transform: scale(.97); }
  #boot-btn[disabled] { opacity: .35; cursor: default; }
  #boot-err { font-size: 13px; color: #ff8080; max-width: 460px; line-height: 1.6; word-break: break-all; }

  /* ---------- 竖屏 / 窄屏：摄像头面板变成画中画 ---------- */
  @media (orientation: portrait) and (max-width: 900px) {
    #app { display: block; }
    #globe-panel { position: absolute; inset: 0; }
    #cam-panel {
      position: absolute; z-index: 20; top: 12px; left: 12px;
      width: 168px; height: auto; flex: none;
      padding: 8px; gap: 7px;
      background: rgba(8, 12, 22, .82);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border: 1px solid #1d2a48; border-radius: 12px;
    }
    #cam-title span:last-child { display: none; }
    #status-box { padding: 7px 9px; }
    #status-text { font-size: 12px; }
    #status-sub, #pinch-wrap, #help { display: none; }
  }
</style>
</head>
<body>

<div id="app">
  <aside id="cam-panel">
    <div id="cam-title"><span>手势输入</span><span id="fps">--</span></div>

</div>

<div id="boot">

  <div id="bar-outer"><div id="bar-inner"></div></div>
  <button id="boot-btn" disabled>加载中</button>
  <div id="boot-err"></div>
</div>

<script type="module">
/* ============================================================================
 *  手势控制地球 — 单文件前端
 *  渲染：globe.gl (three.js)   识别：MediaPipe Tasks Vision HandLandmarker
 *  全部依赖走 CDN，无后端，无本地模型文件。
 * ==========================================================================*/

/* ------------------------------ 可调参数 ---------------------------------- */

// globe.gl（含 three.js）没有国内 CDN，只有这两种来源，按速度排序自动切换
const GLOBE_CDNS = [
  'https://unpkg.com/globe.gl@2.46.2/dist/globe.gl.min.js',
  'https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js'
];

// MediaPipe 运行时。npmmirror 在国内是秒开，unpkg 作为兜底。
const TASKS_VISION_CDN = [
  { js: 'https://registry.npmmirror.com/@mediapipe/tasks-vision/1.1.1/files/vision_bundle.mjs',
    wasm: 'https://registry.npmmirror.com/@mediapipe/tasks-vision/1.1.1/files/wasm' },
  { js: 'https://unpkg.com/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs',
    wasm: 'https://unpkg.com/@mediapipe/tasks-vision@1.1.1/wasm' }
];

// 手部关键点模型（7.8MB）。第一次打开会下载并缓存到浏览器，之后再次打开是秒进。
// 顺序很重要：先找同目录下的 hand_landmarker.task（把模型文件跟 index.html 一起
// 部署，就从你自己的站点/CDN 分发，比 Google 那条线快得多）；
// 找不到才回落到 Google 存储。第一个 URL 404 是预期行为，会自动往下试。
const MODEL_URLS = [
  './hand_landmarker.task',
  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
];
const MODEL_CACHE = 'gesture-globe-model-v1';
const MODEL_CACHE_KEY = '/__model__/hand_landmarker.task';

// 缩放范围（altitude 是"地球半径的倍数"，0.35 ≈ 贴脸，3.0 ≈ 看整颗球）
const ALT_MIN = 0.35, ALT_MAX = 3.0;
// 缩放映射：食指-拇指距离 / 手掌尺寸 落在这个区间
const PINCH_NEAR = 0.30, PINCH_FAR = 1.15;
// 低于这个比值就认为是"捏着"，用来把捏合和张开手掌区分开
const PINCH_HOLD = 0.55;

const YAW_SPEED = 42;    // 度/秒，手掌左右满偏时
const PITCH_SPEED = 26;  // 度/秒，手掌上下满偏时
const AXIS_DEAD = 0.14;  // 中心死区
const PITCH_LIMIT = 72;  // 俯仰上下限

// 30 座城市
const CITIES = [
  { name: '北京',       lat: 39.9042,  lng: 116.4074 },
  { name: '上海',       lat: 31.2304,  lng: 121.4737 },
  { name: '香港',       lat: 22.3193,  lng: 114.1694 },
  { name: '东京',       lat: 35.6762,  lng: 139.6503 },
  { name: '首尔',       lat: 37.5665,  lng: 126.9780 },
  { name: '新加坡',     lat: 1.3521,   lng: 103.8198 },
  { name: '曼谷',       lat: 13.7563,  lng: 100.5018 },
  { name: '孟买',       lat: 19.0760,  lng: 72.8777  },
  { name: '迪拜',       lat: 25.2048,  lng: 55.2708  },
  { name: '伊斯坦布尔', lat: 41.0082,  lng: 28.9784  },
  { name: '莫斯科',     lat: 55.7558,  lng: 37.6173  },
  { name: '开罗',       lat: 30.0444,  lng: 31.2357  },
  { name: '内罗毕',     lat: -1.2921,  lng: 36.8219  },
  { name: '开普敦',     lat: -33.9249, lng: 18.4241  },
  { name: '伦敦',       lat: 51.5074,  lng: -0.1278  },
  { name: '巴黎',       lat: 48.8566,  lng: 2.3522   },
  { name: '柏林',       lat: 52.5200,  lng: 13.4050  },
  { name: '马德里',     lat: 40.4168,  lng: -3.7038  },
  { name: '罗马',       lat: 41.9028,  lng: 12.4964  },
  { name: '阿姆斯特丹', lat: 52.3676,  lng: 4.9041   },
  { name: '纽约',       lat: 40.7128,  lng: -74.0060 },
  { name: '洛杉矶',     lat: 34.0522,  lng: -118.2437 },
  { name: '芝加哥',     lat: 41.8781,  lng: -87.6298 },
  { name: '多伦多',     lat: 43.6532,  lng: -79.3832 },
  { name: '墨西哥城',   lat: 19.4326,  lng: -99.1332 },
  { name: '圣保罗',     lat: -23.5505, lng: -46.6333 },
  { name: '布宜诺斯艾利斯', lat: -34.6037, lng: -58.3816 },
  { name: '利马',       lat: -12.0464, lng: -77.0428 },
  { name: '悉尼',       lat: -33.8688, lng: 151.2093 },
  { name: '奥克兰',     lat: -36.8485, lng: 174.7633 }
];

// 手部骨架连线
const HAND_EDGES = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

/* ------------------------------ 小工具 ------------------------------------ */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/** 动态插脚本，带超时，失败或超时都 reject，方便换下一个源。 */
function loadScript(url, timeoutMs = 25000) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      el.remove();
      reject(new Error('timeout'));
    }, timeoutMs);
    el.onload = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve();
    };
    el.onerror = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      el.remove();
      reject(new Error('load error'));
    };
    el.src = url;
    document.head.appendChild(el);
  });
}

/** One Euro 滤波：慢速时强平滑（消抖），快速时几乎不滞后（跟手）。 */
class OneEuro {
  constructor(minCutoff = 1.1, beta = 0.02, dCutoff = 1.0) {
    this.minCutoff = minCutoff;
    this.beta = beta;
    this.dCutoff = dCutoff;
    this.reset();
  }
  reset() { this.xPrev = null; this.dxPrev = null; }
  static alpha(cutoff, dt) {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / dt);
  }
  filter(x, dt) {
    if (dt <= 0) return x;
    if (this.xPrev === null) { this.xPrev = x; this.dxPrev = 0; return x; }
    const dx = (x - this.xPrev) / dt;
    const aD = OneEuro.alpha(this.dCutoff, dt);
    const dxHat = this.dxPrev === null ? dx : aD * dx + (1 - aD) * this.dxPrev;
    const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
    const a = OneEuro.alpha(cutoff, dt);
    const xHat = a * x + (1 - a) * this.xPrev;
    this.xPrev = xHat;
    this.dxPrev = dxHat;
    return xHat;
  }
}

/** 把 [-1,1] 的轴输入裁掉死区，再线性映射到 [-1,1]。 */
function deadZone(v) {
  const a = Math.abs(v);
  if (a <= AXIS_DEAD) return 0;
  return Math.sign(v) * clamp((a - AXIS_DEAD) / (1 - AXIS_DEAD), 0, 1);
}

/* ---------------------- 手势判定（纯函数，可单独测） --------------------- */

const HAND = {
  WRIST: 0,
  THUMB_TIP: 4,
  INDEX_MCP: 5,
  MIDDLE_MCP: 9,
  INDEX_TIP: 8,
  PALM_IDS: [0, 5, 9, 13, 17],                    // 掌指关节，不随手指伸屈移动
  FINGERS: [[8, 6], [12, 10], [16, 14], [20, 18]], // [指尖, 第二关节]
  EXTEND_RATIO: 1.06,
  THUMB_IN_RATIO: 0.9
};

const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/** 掌心质心与手掌尺度。用掌指关节而不是指尖，所以不受手指伸屈影响。 */
function palmRef(lm) {
  let x = 0, y = 0;
  for (const i of HAND.PALM_IDS) { x += lm[i].x; y += lm[i].y; }
  const n = HAND.PALM_IDS.length;
  return {
    ref: { x: x / n, y: y / n },
    scale: d2(lm[HAND.WRIST], lm[HAND.MIDDLE_MCP]) || 1e-6
  };
}

/**
 * 手部姿态。
 * extended 是食指/中指/无名指/小指里伸直的根数；
 * thumbIn 是拇指内收（比数字）还是外展（摊开手掌）——手指计数靠它避免误触发；
 * pinch 是拇指尖到食指尖的距离除以手掌尺度，越小越像捏合。
 */
function fingerState(lm) {
  const wrist = lm[HAND.WRIST];
  let extended = 0;
  for (const [tipId, pipId] of HAND.FINGERS) {
    if (d2(lm[tipId], wrist) > d2(lm[pipId], wrist) * HAND.EXTEND_RATIO) extended++;
  }
  const { scale } = palmRef(lm);
  return {
    extended,
    thumbIn: d2(lm[HAND.THUMB_TIP], lm[HAND.INDEX_MCP]) / scale < HAND.THUMB_IN_RATIO,
    pinch: d2(lm[HAND.THUMB_TIP], lm[HAND.INDEX_TIP]) / scale
  };
}

/** 手掌竖直时返回 0，向右倾为正。单位弧度。 */
function palmTilt(lm) {
  const dx = lm[HAND.MIDDLE_MCP].x - lm[HAND.WRIST].x;
  const dy = lm[HAND.MIDDLE_MCP].y - lm[HAND.WRIST].y;
  return Math.atan2(dx, -dy);
}

/* ------------------------------ DOM -------------------------------------- */

const $boot = document.getElementById('boot');
const $bootMsg = document.getElementById('boot-msg');
const $bootBtn = document.getElementById('boot-btn');
const $bootErr = document.getElementById('boot-err');
const $bar = document.getElementById('bar-inner');
const $video = document.createElement('video');
const $camCanvas = document.getElementById('cam-canvas');
const camCtx = $camCanvas.getContext('2d');
const $statusBox = document.getElementById('status-box');
const $statusLabel = document.getElementById('status-label');
const $statusSub = document.getElementById('status-sub');
const $pinchFill = document.getElementById('pinch-fill');
const $fps = document.getElementById('fps');
const $hudCity = document.getElementById('hud-city');

$video.playsInline = true;
$video.muted = true;
$video.autoplay = true;

function setStatus(state, label, sub) {
  $statusBox.dataset.state = state;
  $statusLabel.textContent = label;
  $statusSub.textContent = sub;
}

/* ========================== 1. 3D 地球 ==================================== */

const RENDERER_CONFIG = {
  antialias: false,
  alpha: false,
  powerPreference: 'high-performance',
  preserveDrawingBuffer: false,
  stencil: false,
  depth: true,
  failIfMajorPerformanceCaveat: false
};

let world = null;

function initGlobe() {
  if (typeof Globe !== 'function') {
    throw new Error('globe.gl 没能从 CDN 加载，请检查网络后刷新。');
  }

  world = Globe({ rendererConfig: RENDERER_CONFIG })(document.getElementById('globe'));

  world
    // 关掉所有花哨特效：大气层、经纬网（globe.gl 2.x 已经没有云层特效了）
    .showAtmosphere(false)
    .showGraticules(false)
    // 白天地表贴图（245KB，unpkg 直连）。earth-dark.jpg 平均亮度只有 11/255，
    // 几乎全黑、看不清大陆，所以不用它。
    .globeImageUrl('https://unpkg.com/three-globe@2.44.0/example/img/earth-day.jpg')
    // 城市小圆点
    .pointsData(CITIES)
    .pointLat('lat')
    .pointLng('lng')
    .pointColor(() => '#ffd166')
    .pointAltitude(0.008)
    .pointRadius(0.42)
    .pointResolution(12)
    // 鼠标 hover 显示城市名
    .pointLabel(d => `<div class="city-tip">${d.name}</div>`)
    .onPointClick(d => { $hudCity.textContent = d.name; });

  // 贴图是 phong 材质：抹掉高光（不要反光），并把贴图本身当作自发光贴图，
  // 这样暗部不会黑成一片，也就不用靠复杂光源去补。整体更亮、更省。
  const tuneMaterial = () => {
    const m = world.globeMaterial && world.globeMaterial();
    if (!m) return;
    if ('shininess' in m) m.shininess = 0;
    if (m.specular && m.specular.setRGB) m.specular.setRGB(0, 0, 0);
      if ('emissiveMap' in m && m.map) {
      m.emissiveMap = m.map;
      if (m.emissive && m.emissive.setRGB) m.emissive.setRGB(1, 1, 1);
        if ('emissiveIntensity' in m) m.emissiveIntensity = 0.45;
    }
    m.needsUpdate = true;
  };
  world.onGlobeReady(tuneMaterial);
  setTimeout(tuneMaterial, 300);

  // 相机距离限制：altitude 与距离的关系是 distance = 100 * (1 + altitude)
  // globe.gl 2.x 默认用 TrackballControls，它的属性名和 OrbitControls 不一样，
  // 所以每一项都先探测存在再赋值。
  const c = world.controls();
  if (c) {
    if ('minDistance' in c) c.minDistance = 100 * (1 + ALT_MIN);
    if ('maxDistance' in c) c.maxDistance = 100 * (1 + ALT_MAX);
    if ('enableDamping' in c) c.enableDamping = true;
    if ('dampingFactor' in c) c.dampingFactor = 0.12;
    if ('rotateSpeed' in c) c.rotateSpeed = 0.55;
    if ('zoomSpeed' in c) c.zoomSpeed = 0.6;
    if ('enablePan' in c) c.enablePan = false;
    if ('noPan' in c) c.noPan = true;
  }

  world.pointOfView({ lat: 22, lng: 105, altitude: 2.4 });

  const resize = () => {
    const p = document.getElementById('globe-panel');
    if (p) world.width(p.clientWidth).height(p.clientHeight);
  };
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));
  setTimeout(resize, 0);
}

/* ========================== 2. 模型下载（带缓存） ========================= */

async function openCache() {
  try {
    if (typeof caches === 'undefined') return null;
    return await caches.open(MODEL_CACHE);
  } catch (_) { return null; }
}

/**
 * 同时开几条线路一起下，比谁真的在动，留快的那条，其余掐掉。
 * 这样做是因为不同网络下"哪个源快"事先根本猜不准——你的网络上
 * 本地隧道和 Google 存储可能一个通一个死。
 */
async function fetchModelBuffer(onProgress) {
  const cache = await openCache();

  if (cache) {
    try {
      const hit = await cache.match(MODEL_CACHE_KEY);
      if (hit) {
        onProgress(1, 1, 1, true);
        return new Uint8Array(await hit.arrayBuffer());
      }
    } catch (_) { /* 忽略，继续走网络 */ }
  }

  const makeRacer = (url) => ({
    url, ctrl: new AbortController(),
    chunks: [], got: 0, total: 0, done: false, ok: false, err: null
  });

  const runRacer = async (r) => {
    try {
      const res = await fetch(r.url, { mode: 'cors', signal: r.ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      r.total = Number(res.headers.get('content-length')) || 0;
      if (!res.body || !res.body.getReader) {
        const buf = new Uint8Array(await res.arrayBuffer());
        r.chunks.push(buf); r.got = buf.length; r.ok = true; r.done = true;
        return;
      }
      const reader = res.body.getReader();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        r.chunks.push(value);
        r.got += value.length;
      }
      r.ok = true;
    } catch (err) {
      r.err = err;
    }
    r.done = true;
  };

  const racers = MODEL_URLS.map(makeRacer);
  racers.forEach(runRacer);

  // 试探阶段：先给 5 秒看谁动得快，谁都没动静最多再等到 20 秒
  const probeUntil = performance.now() + 5000;
  const giveUpAt = performance.now() + 20000;
  let winner = null;
  while (performance.now() < giveUpAt) {
    const finished = racers.find(r => r.done && r.ok);
    if (finished) { winner = finished; break; }
    if (performance.now() > probeUntil) {
      const best = racers.slice().sort((a, b) => b.got - a.got)[0];
      if (best && best.got > 65536) { winner = best; break; }
    }
    await sleep(150);
  }
  if (!winner) {
    const best = racers.slice().sort((a, b) => b.got - a.got)[0];
    if (best && best.got > 0) winner = best;
  }
  if (!winner) {
    racers.forEach(r => r.ctrl.abort());
    throw new Error('所有模型源都没能开始传输（网络到这两个地址都不通）');
  }
  racers.forEach(r => { if (r !== winner) r.ctrl.abort(); });

  // 看着赢家跑完，20 秒没有任何新字节能到就判定断了
  let lastBytes = winner.got;
  let lastMove = performance.now();
  while (!winner.done) {
    await sleep(200);
    if (winner.got !== lastBytes) { lastBytes = winner.got; lastMove = performance.now(); }
    onProgress(winner.total ? winner.got / winner.total : 0, winner.got, winner.total, false);
    if (performance.now() - lastMove > 20000) {
      winner.ctrl.abort();
      throw new Error('下载停住了（20 秒没有新数据）');
    }
  }
  if (!winner.ok) throw new Error('下载中断：' + ((winner.err && winner.err.message) || '未知原因'));

  const buf = new Uint8Array(winner.got);
  let off = 0;
  for (const ch of winner.chunks) { buf.set(ch, off); off += ch.length; }

  if (cache) {
    cache.put(MODEL_CACHE_KEY, new Response(buf.slice(), {
      headers: {
        'Content-Type': 'application/octet-stream',
        'Content-Length': String(buf.length)
      }
    })).catch(() => {});
  }
  return buf;
}

/* ========================== 3. 手势识别 =================================== */

const PALM_IDS = [0, 5, 9, 13, 17];   // 手腕 + 四个掌指关节
const TIP = { thumb: 4, index: 8, middle: 12, ring: 16, pinky: 20 };
const PIP = { index: 6, middle: 10, ring: 14, pinky: 18 };

let handLandmarker = null;
let running = false;
let lastVideoTime = -1;
let lastDetectAt = 0;

// 平滑器
const fPalmX = new OneEuro(0.9, 0.02);
const fPalmY = new OneEuro(0.9, 0.02);
const fPinch = new OneEuro(0.8, 0.01);

// 控制状态
let paused = false;          // 握拳暂停
let hasHand = false;         // 本帧是否看到手
let yawVel = 0, pitchVel = 0;
let lastLoopAt = 0;
let pinchNorm = 0.5;         // 0=捏紧 1=张开，仅用于 UI 显示

function palmCenter(lm) {
  let x = 0, y = 0;
  for (const i of PALM_IDS) { x += lm[i].x; y += lm[i].y; }
  return { x: x / PALM_IDS.length, y: y / PALM_IDS.length };
}

const dist2d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/** 手指是否伸直：指尖离手腕比第二关节更远，就算伸直。 */
function isExtended(lm, tipId, pipId) {
  const w = lm[0];
  return dist2d(lm[tipId], w) > dist2d(lm[pipId], w) * 1.06;
}

/** 返回 0~4，表示食指/中指/无名指/小指有几根是伸直的。 */
function extendedCount(lm) {
  let n = 0;
  if (isExtended(lm, TIP.index, PIP.index)) n++;
  if (isExtended(lm, TIP.middle, PIP.middle)) n++;
  if (isExtended(lm, TIP.ring, PIP.ring)) n++;
  if (isExtended(lm, TIP.pinky, PIP.pinky)) n++;
  return n;
}

/** 拇指尖到食指尖的距离，用"手腕→中指根"做归一化，剔除离镜头远近的影响。 */
function pinchRatio(lm) {
  const scale = dist2d(lm[0], lm[9]) || 1e-6;
  return dist2d(lm[TIP.thumb], lm[TIP.index]) / scale;
}

function resetFilters() {
  fPalmX.reset(); fPalmY.reset(); fPinch.reset();
}

function updateHand(lm, dt) {
  const ext = extendedCount(lm);
  const ratio = pinchRatio(lm);
  // 捏合时其余三指通常也是伸直的，所以"张开手掌"必须排除正在捏合的状态，
  // 否则捏一下就相当于解除了握拳暂停。
  const pinching = ratio < PINCH_HOLD;
  const open = ext >= 4 && !pinching;
  const fist = ext <= 1;

  // 状态闩锁：只有明确张开手掌才恢复，避免半握状态来回抖
  if (paused) {
    if (open) { paused = false; resetFilters(); }
  } else if (fist) {
    paused = true;
  }

  const palm = palmCenter(lm);

  // 前置摄像头：镜像之后手掌实际左右方向要和视觉一致
  const cx = (0.5 - palm.x) * 2;   // 手掌偏右 → +1
  const cy = (0.5 - palm.y) * 2;   // 手掌偏上 → +1

  fPalmX.filter(cx, dt);
  fPalmY.filter(cy, dt);

  fPinch.filter(ratio, dt);

  // t: 0 = 捏紧，1 = 张开
  const t = clamp((ratio - PINCH_NEAR) / (PINCH_FAR - PINCH_NEAR), 0, 1);
  pinchNorm = 1 - t;               // 进度条表示"捏合程度"，捏紧时最满

  if (paused) {
    setStatus('paused', '握拳暂停', '张开手掌即可继续控制');
    yawVel = 0; pitchVel = 0;
    return null;
  }

  setStatus('active', '张开，控制生效',
    open ? '正在用整只手掌控制' : '手掌移动 + 捏合控制');

  // 相对速度控制：手掌偏离中心越多，转得越快；回中心即停。
  yawVel = deadZone(fPalmX.xPrev) * YAW_SPEED;
  pitchVel = deadZone(fPalmY.xPrev) * PITCH_SPEED;

  // 捏紧 → 拉近（altitude 小），张开 → 推远（altitude 大）
  return clamp(lerp(ALT_MIN, ALT_MAX, t), ALT_MIN, ALT_MAX);
}

/* ---------------------- 关键点绘制（左侧小窗） --------------------------- */

function drawCameraFrame(landmarks) {
  const w = $camCanvas.width, h = $camCanvas.height;

  camCtx.save();
  camCtx.setTransform(1, 0, 0, 1, 0, 0);
  camCtx.clearRect(0, 0, w, h);
  camCtx.translate(w, 0);
  camCtx.scale(-1, 1);           // 镜像，看起来像照镜子
  try { camCtx.drawImage($video, 0, 0, w, h); } catch (_) {}
  camCtx.restore();

  if (!landmarks || !landmarks.length) return;

  const lm = landmarks[0];
  const px = i => ({ x: (1 - lm[i].x) * w, y: lm[i].y * h });

  camCtx.lineWidth = 2;
  camCtx.strokeStyle = paused ? 'rgba(255,176,32,.85)' : 'rgba(74,157,255,.85)';
  camCtx.beginPath();
  for (const [a, b] of HAND_EDGES) {
    const pa = px(a), pb = px(b);
    camCtx.moveTo(pa.x, pa.y);
    camCtx.lineTo(pb.x, pb.y);
  }
  camCtx.stroke();

  const tipSet = new Set([4, 8, 12, 16, 20]);
  for (let i = 0; i < lm.length; i++) {
    const p = px(i);
    camCtx.beginPath();
    camCtx.arc(p.x, p.y, tipSet.has(i) ? 3.6 : 2.2, 0, Math.PI * 2);
    camCtx.fillStyle = tipSet.has(i) ? '#ffd166' : '#eaf2ff';
    camCtx.fill();
  }
}

/* ---------------------- 主循环 ------------------------------------------ */

function loop(now) {
  if (!running) return;
  requestAnimationFrame(loop);

  const dt = lastLoopAt ? Math.min(0.05, (now - lastLoopAt) / 1000) : 0;
  lastLoopAt = now;

  // 识别限速到 ~30fps，中间帧靠速度积分保持流畅
  let landmarks = null;
  const ready = $video.readyState >= 2 && $video.videoWidth > 0;
  if (ready && now - lastDetectAt >= 33 && $video.currentTime !== lastVideoTime) {
    lastDetectAt = now;
    lastVideoTime = $video.currentTime;
    try {
      const res = handLandmarker.detectForVideo($video, now);
      landmarks = res && res.landmarks;
    } catch (err) {
      landmarks = null;
    }
    hasHand = !!(landmarks && landmarks.length);

    if (hasHand) {
      const detectDt = clamp((now - (lastDetectStamp || now)) / 1000, 1 / 60, 0.2);
      lastDetectStamp = now;
      targetAlt = updateHand(landmarks[0], detectDt);
    } else {
      if (!paused) setStatus('searching', '检测中', '把手放进画面');
      yawVel = 0; pitchVel = 0;
      resetFilters();
    }

    // FPS
    fpsAcc += now - (fpsStamp || now);
    fpsFrames++;
    fpsStamp = now;
    if (fpsAcc > 500) {
      $fps.textContent = Math.round(fpsFrames * 1000 / fpsAcc) + ' fps';
      fpsAcc = 0; fpsFrames = 0;
    }

    drawCameraFrame(landmarks);
  }

  $pinchFill.style.width = (pinchNorm * 100).toFixed(0) + '%';

  // 只有"看到手且没有握拳"时才接管相机
  if (hasHand && !paused) {
    const pov = world.pointOfView();
    const nextLng = pov.lng + yawVel * dt;
    const nextLat = clamp(pov.lat + pitchVel * dt, -PITCH_LIMIT, PITCH_LIMIT);

    // 缩放做速率限制，避免手一抖就跳
    const curAlt = (typeof pov.altitude === 'number') ? pov.altitude : targetAlt;
    const maxStep = 1.6 * dt;
    const alt = curAlt + clamp(targetAlt - curAlt, -maxStep, maxStep);

    world.pointOfView({ lat: nextLat, lng: nextLng, altitude: clamp(alt, ALT_MIN, ALT_MAX) }, 0);
  }
}

let targetAlt = 2.4;
let lastDetectStamp = 0;
let fpsAcc = 0, fpsFrames = 0, fpsStamp = 0;

/* ========================== 4. 启动流程 =================================== */

async function loadModel() {
  let lastPaint = 0;
  const buf = await fetchModelBuffer((frac, got, total, cached) => {
    const pct = total ? Math.round(frac * 100) : 0;
    const now = performance.now();
    if (now - lastPaint < 120 && frac < 1) return;   // 别刷太频繁
    lastPaint = now;
    $bar.style.width = (cached ? 100 : pct) + '%';
    if (cached) {
      $bootMsg.textContent = '识别模型已在本机缓存，无需再次下载。';
    } else {
      $bootMsg.textContent =
        `正在下载手部识别模型（第一次打开需要下载约 7.8MB）` +
        (total ? ` — ${pct}%  ${(got / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB` : '');
    }
  });
  $bar.style.width = '100%';
  return buf;
}

async function createLandmarker(modelBuf) {
  let mod = null;
  let wasmPath = '';
  let lastErr = null;
  for (const cdn of TASKS_VISION_CDN) {
    try {
      mod = await import(/* 动态加载，失败可换源 */ cdn.js);
      wasmPath = cdn.wasm;
      break;
    } catch (err) { lastErr = err; }
  }
  if (!mod) throw lastErr || new Error('MediaPipe 运行时加载失败');

  const fileset = await mod.FilesetResolver.forVisionTasks(wasmPath);
  const options = {
    baseOptions: { modelAssetBuffer: modelBuf, delegate: 'GPU' },
    runningMode: 'VIDEO',
    numHands: 1,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  };

  try {
    return await mod.HandLandmarker.createFromOptions(fileset, options);
  } catch (err) {
    // 少数设备上 GPU 委托起不来，退回 CPU
    options.baseOptions.delegate = 'CPU';
    return await mod.HandLandmarker.createFromOptions(fileset, options);
  }
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      facingMode: 'user',
      width: { ideal: 640 },
      height: { ideal: 480 },
      frameRate: { ideal: 30, max: 30 }
    }
  });
  $video.srcObject = stream;
  await $video.play();
  await new Promise(resolve => {
    if ($video.videoWidth > 0) return resolve();
    $video.addEventListener('loadeddata', resolve, { once: true });
  });
}

async function boot() {
  // 分阶段推进，每一步都写在界面上——卡住的时候一眼能看出卡在哪一环
  $bootMsg.textContent = '正在加载 3D 库…';
  try {
    let loaded = null;
    for (const url of GLOBE_CDNS) {
      try {
        const host = new URL(url).host;
        $bootMsg.textContent = '正在加载 3D 库…（' + host + '）';
        await loadScript(url, 25000);
        if (typeof Globe === 'function') { loaded = host; break; }
      } catch (_) { /* 换下一个源 */ }
    }
    if (!loaded) throw new Error('两个 CDN 都没能把 globe.gl 加载下来');

    $bootMsg.textContent = '正在初始化地球…';
    initGlobe();
  } catch (err) {
    $bootMsg.textContent = '3D 库加载失败。';
    $bootErr.textContent = String(err.message || err);
    return;
  }

  try {
    $bootMsg.textContent = '正在准备手部识别运行时…';
    const modelBuf = await loadModel();
    $bootMsg.textContent = '正在启动识别引擎…';
    handLandmarker = await createLandmarker(modelBuf);
    $bootMsg.textContent = '模型就绪。点击开始，浏览器会请求摄像头权限。';
    $bootBtn.disabled = false;
    $bootBtn.textContent = '开始';
  } catch (err) {
    $bootMsg.textContent = '模型加载失败。';
    $bootErr.textContent =
      String(err.message || err) +
      '\n（把这行提示发给我。多半是这个网络到模型源不通或太慢。）';
  }
}

$bootBtn.addEventListener('click', async () => {
  $bootBtn.disabled = true;
  $bootBtn.textContent = '启动中…';
  try {
    await startCamera();
  } catch (err) {
    $bootBtn.disabled = false;
    $bootBtn.textContent = '重试';
    $bootErr.textContent =
      '拿不到摄像头：' + String(err.message || err) +
      '\n必须是 HTTPS 或 localhost，并且不要在微信等内置浏览器里打开。';
    return;
  }
  $boot.classList.add('hidden');
  running = true;
  setStatus('searching', '检测中', '把手放进画面');
  requestAnimationFrame(loop);
});

// 调试钩子：只有在网址后面加 ?debug 才会挂上。
// 用来在没有真实摄像头的情况下验证手势判定 / 调灵敏度：
//   __gesture.step(landmarks, dt)  →  { alt, paused, yawVel, pitchVel, pinchNorm }
if (new URLSearchParams(location.search).has('debug')) {
  window.__gesture = {
    // 纯判定探针：给一帧关键点，返回判定结果，不改任何状态
    probe(lm) {
      const p = palmRef(lm);
      return Object.assign({}, p, fingerState(lm), { tilt: palmTilt(lm) });
    },
    step(lm, dt = 1 / 30) {
      const alt = updateHand(lm, dt);
      return { alt, paused, yawVel, pitchVel, pinchNorm };
    },
    reset() {
      paused = false; hasHand = false; yawVel = 0; pitchVel = 0;
      resetFilters();
    },
    constants: { ALT_MIN, ALT_MAX, PINCH_NEAR, PINCH_FAR, AXIS_DEAD, YAW_SPEED, PITCH_SPEED }
  };
}

boot();
</script>
